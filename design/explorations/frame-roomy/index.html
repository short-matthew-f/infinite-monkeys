<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6B4423" />
<title>Pop-up Floor Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Courier+Prime&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
/* ---------- tokens (copied from game/style.css, plus derived paper tokens) ---------- */
:root {
  --paper: #f2e8d5; --paper-shade: #e4d6bc; --ink: #2b2622; --ink-muted: #5e554c;
  --walnut: #6b4423; --concrete: #8a8780; --mustard: #c9a227; --tangerine: #d9732b;
  --olive: #6e7046; --alert: #b23a2e; --phosphor-amber: #b87400; --phosphor-green: #3f7d4e;
  --glow: #ffe9b0; --screen: #14110d; --screen-ink: #ffb000; --screen-muted: #a89c8a;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --font-type: 'Courier Prime', 'Courier New', monospace;
  /* derived for this exploration: three clearly separated value layers */
  --edge: #fffaf0;          /* the white of cut paper (rims, tabs) */
  --on-walnut: #f2e8d5;
  --table: color-mix(in srgb, var(--walnut) 72%, var(--screen));
  --floor: color-mix(in srgb, var(--paper-shade) 40%, var(--walnut));   /* darkest sheet: cream rim on it is 3.5:1 */
  --pad: color-mix(in srgb, var(--paper) 80%, var(--paper-shade));          /* zone rugs: lightest sheet */
  --ctl: var(--walnut);     /* control edges: >= 3:1 on sheet and on header */
  --hdr-edge: var(--mustard); --slp: 36%; --slc: var(--screen);
  --sheet: var(--paper);
  --head: var(--walnut);
  --focus: var(--ink);
  --stamp: color-mix(in srgb, var(--alert) 68%, var(--ink));
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #1f1b17; --paper-shade: #2a241e; --ink: #ede3cf; --ink-muted: #a89c8a;
    --walnut: #8a5a33; --concrete: #5e5b55; --mustard: #d9b23a; --tangerine: #e8843a;
    --olive: #8c8f5a; --alert: #d2554a; --phosphor-amber: #ffb000; --phosphor-green: #7cd992;
    --glow: #ffd27a; --edge: #d8ccb4; --on-walnut: #f2e8d5; --sheet: #302920; --head: #d9b23a;
    --table: color-mix(in srgb, var(--paper) 70%, var(--screen));
    --floor: color-mix(in srgb, var(--paper) 78%, var(--screen));
    --pad: color-mix(in srgb, var(--paper-shade) 30%, var(--concrete));
    --stamp: color-mix(in srgb, var(--alert) 66%, var(--ink));
    --ctl: color-mix(in srgb, var(--ink-muted) 55%, var(--ink)); --hdr-edge: var(--edge); --slp: 40%; --slc: var(--edge);
  }
}
:root[data-theme='dark'] {
  --paper: #1f1b17; --paper-shade: #2a241e; --ink: #ede3cf; --ink-muted: #a89c8a;
  --walnut: #8a5a33; --concrete: #5e5b55; --mustard: #d9b23a; --tangerine: #e8843a;
  --olive: #8c8f5a; --alert: #d2554a; --phosphor-amber: #ffb000; --phosphor-green: #7cd992;
  --glow: #ffd27a; --edge: #d8ccb4; --on-walnut: #f2e8d5; --sheet: #302920; --head: #d9b23a;
  --table: color-mix(in srgb, var(--paper) 70%, var(--screen));
  --floor: color-mix(in srgb, var(--paper) 78%, var(--screen));
  --pad: color-mix(in srgb, var(--paper-shade) 30%, var(--concrete));
  --stamp: color-mix(in srgb, var(--alert) 66%, var(--ink));
  --ctl: color-mix(in srgb, var(--ink-muted) 55%, var(--ink)); --hdr-edge: var(--edge); --slp: 40%; --slc: var(--edge);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--table); color: var(--ink); font: 16px/1.45 var(--font-body); overscroll-behavior: none; position: relative; }
button { font: inherit; color: inherit; }
/* focus: ink on every paper/floor value in light, cream in dark (>= 3:1 against all backgrounds it sits on) */
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 6px var(--paper); }
h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; font-weight: 700; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- stage, camera, world ---------- */
.stage { position: absolute; inset: 0; overflow: hidden; width: 390px; max-width: 100%; margin: 0 auto; }
@media (min-width: 391px) { .stage { box-shadow: 0 0 0 1px var(--concrete); } }
.cam {
  position: absolute; left: 0; top: 0; width: 860px; height: 1670px;
  --tx: -235px; --ty: -748px; --s: 1;
  transform: translate3d(var(--tx), var(--ty), 0) scale(var(--s)); transform-origin: 0 0;
  transition: transform 760ms cubic-bezier(.5, .02, .2, 1);
  touch-action: none;
}
.cam.dragging { transition: none; will-change: transform; }
.cam.snap { transition-duration: 460ms; }
#map { position: absolute; left: 0; top: 0; width: 860px; height: 1670px; display: block; overflow: visible; }
.hot { position: absolute; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; border-radius: 10px; }
.hot:focus-visible { outline: 3px dashed var(--focus); outline-offset: -4px; box-shadow: none; }

/* ---------- map art: paper cutouts ---------- */
.floor { fill: var(--floor); }
.floor-edge { fill: color-mix(in srgb, var(--floor) 55%, var(--screen)); }
.floor-rim { fill: none; stroke: var(--edge); stroke-width: 1.6; opacity: .75; }
.table-shadow { fill: var(--screen); opacity: .35; }
.grain { mix-blend-mode: overlay; opacity: .45; pointer-events: none; }
.dots { fill: var(--edge); opacity: .28; }
.crease { stroke: var(--screen); stroke-width: 1; stroke-dasharray: 3 6; opacity: .22; fill: none; }
.crease-hi { stroke: var(--edge); stroke-width: 1; opacity: .35; fill: none; }
.route { stroke: var(--mustard); stroke-width: 2.4; stroke-dasharray: 1 8; stroke-linecap: round; fill: none; opacity: .95; }
.pad { fill: color-mix(in srgb, var(--tint, var(--concrete)) 16%, var(--pad)); stroke: var(--edge); stroke-width: 1.8; }
.pad-th { fill: color-mix(in srgb, var(--tint, var(--concrete)) 26%, color-mix(in srgb, var(--pad) 52%, var(--floor))); stroke: var(--edge); stroke-width: 1.4; }   /* mid value: floor, then paper thickness, then pad */
.pad-th-in { fill: color-mix(in srgb, var(--screen) 22%, var(--pad)); }
.pad-sh { fill: var(--screen); opacity: .34; }
.pad-sh2 { fill: var(--screen); opacity: .2; filter: url(#soft2); }
.curl-sh { fill: var(--screen); opacity: .32; filter: url(#soft); }
.curl { fill: color-mix(in srgb, var(--edge) 94%, var(--tint, var(--concrete))); stroke: var(--concrete); stroke-width: 1.2; stroke-linejoin: round; }
.curl-cut { fill: var(--floor); stroke: var(--edge); stroke-width: 1.4; stroke-linejoin: round; }
.t-pl { --tint: var(--olive); } .t-pe { --tint: var(--mustard); } .t-dp { --tint: var(--concrete); } .t-dr { --tint: var(--walnut); }
.rug { stroke: var(--edge); stroke-width: 1.2; }
.ring { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; opacity: 0; transition: opacity .3s; }
.zone.active .ring { opacity: .9; }
.fdec { fill: var(--mustard); stroke: var(--edge); stroke-width: 1.2; stroke-linejoin: round; }
.tape { fill: var(--mustard); opacity: .9; stroke: var(--edge); stroke-width: .8; }

.up { transition: transform 620ms cubic-bezier(.3, .8, .25, 1); transform: scaleY(1); }
.zone.pop .up { transform: scaleY(1.18); }
.stage:has(.hot[data-zone='personnel']:is(:hover, :active)) #z-personnel .up,
.stage:has(.hot[data-zone='pool']:is(:hover, :active)) #z-pool .up,
.stage:has(.hot[data-zone='departments']:is(:hover, :active)) #z-departments .up,
.stage:has(.hot[data-zone='director']:is(:hover, :active)) #z-director .up { transform: scaleY(1.07); transition-duration: 160ms; }

/* standing pieces: front face, lighter cut rim, lighter top face, two shadow tiers */
.fr { fill: var(--c, var(--walnut)); stroke: var(--edge); stroke-width: 1.7; stroke-linejoin: round; }
.tp { fill: color-mix(in srgb, var(--c, var(--walnut)) 62%, var(--edge)); stroke: var(--edge); stroke-width: 1.7; stroke-linejoin: round; }
.rim { fill: none; stroke: var(--edge); stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: round; opacity: .95; }
.shl { fill: var(--screen); opacity: .2; filter: url(#soft); }
.shc { fill: var(--screen); opacity: .42; }
.sh { fill: var(--screen); opacity: .3; }
.tb { fill: var(--edge); stroke: var(--concrete); stroke-width: .8; stroke-linejoin: round; opacity: .95; }
.c-walnut { --c: var(--walnut); } .c-concrete { --c: var(--concrete); } .c-mustard { --c: var(--mustard); }
.c-olive { --c: var(--olive); } .c-alert { --c: var(--alert); } .c-paper { --c: color-mix(in srgb, var(--edge) 88%, var(--paper-shade)); }
.c-shade { --c: var(--paper-shade); } .c-steel { --c: color-mix(in srgb, var(--concrete) 62%, var(--glow)); }
.c-glass { --c: var(--glow); } .c-wall { --c: color-mix(in srgb, var(--paper-shade) 70%, var(--concrete)); }
.c-paper .fr, .c-shade .fr, .c-wall .fr { stroke: var(--edge); }
.ink { fill: var(--screen); } .inkl { stroke: var(--screen); fill: none; stroke-linecap: round; }
.glowf { fill: var(--glow); } .brass { fill: var(--mustard); stroke: var(--screen); stroke-width: .8; }
.sg { font: 700 12px var(--font-display); letter-spacing: .1em; fill: var(--screen); text-anchor: middle; text-transform: uppercase; }
.sg.sm { font-size: 11px; letter-spacing: .06em; }
.halo { fill: url(#halo); }
/* tap cues that read in a still frame: lamps are always fully lit (only an outer ring breathes), signs hang from a rail and swing, pads sit on a visible edge with a lifted corner */
.pulse { animation: pulse 3.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: .75; } }
.swing { animation: swing 5s ease-in-out infinite; animation-delay: var(--nd, 0s); }
@keyframes swing { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
.rays { stroke: var(--tangerine); stroke-width: 2; stroke-linecap: round; fill: none; }
.lampc { fill: var(--glow); stroke: var(--edge); stroke-width: 1.2; }
.cue { animation: cue 1.3s steps(2, jump-none) infinite; }
@keyframes cue { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
.cuesh { animation: cuesh 1.3s steps(2, jump-none) infinite; transform-box: fill-box; transform-origin: center; }
@keyframes cuesh { 0%, 100% { transform: scale(1); } 50% { transform: scale(.78); } }
.nextcue { transition: opacity .3s; }
.hired .nextcue { opacity: 0; visibility: hidden; }
.glass-f { fill: color-mix(in srgb, var(--glow) 12%, transparent); stroke: var(--mustard); stroke-width: 2; stroke-linejoin: round; }
.glass-t { fill: color-mix(in srgb, var(--glow) 30%, transparent); stroke: var(--mustard); stroke-width: 1.6; stroke-linejoin: round; }
.leaf { fill: var(--olive); stroke: var(--edge); stroke-width: .9; }
.leaf2 { fill: color-mix(in srgb, var(--olive) 70%, var(--phosphor-green)); stroke: var(--edge); stroke-width: .9; }
.page { fill: var(--edge); stroke: var(--concrete); stroke-width: .7; }
.sil { fill: var(--screen); stroke: var(--edge); stroke-width: .8; stroke-opacity: .55; }
.skyg { fill: color-mix(in srgb, var(--glow) 82%, var(--paper)); }
.cloud { fill: var(--edge); opacity: .9; animation: cloud 80s linear infinite; }
@keyframes cloud { from { transform: translateX(-120px); } to { transform: translateX(900px); } }

/* monkeys */
:root { --lift: 0%; --deep: 42%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --lift: 50%; --deep: 0%; } }
:root[data-theme='dark'] { --lift: 50%; --deep: 0%; }
.f0 { --fur0: var(--walnut); }
.f1 { --fur0: color-mix(in srgb, var(--walnut) 55%, var(--tangerine)); }
.f2 { --fur0: color-mix(in srgb, var(--walnut) 40%, var(--concrete)); }
.f3 { --fur0: color-mix(in srgb, var(--walnut) 92%, var(--screen)); }
.f4 { --fur0: color-mix(in srgb, var(--mustard) 50%, var(--walnut)); }
.f5 { --fur0: color-mix(in srgb, var(--tangerine) 70%, var(--walnut)); }
.f0, .f1, .f2, .f3, .f4, .f5 { --fur: color-mix(in srgb, color-mix(in srgb, var(--fur0), var(--screen) var(--deep)), var(--glow) var(--lift)); }
.fur { fill: var(--fur); stroke: var(--edge); stroke-width: 1.2; stroke-linejoin: round; }
.furl { fill: none; stroke: var(--fur); stroke-width: 2.4; stroke-linecap: round; }
.face { fill: color-mix(in srgb, var(--fur) 40%, var(--glow)); }
.tongue { fill: color-mix(in srgb, var(--alert) 60%, var(--glow)); stroke: var(--screen); stroke-width: .5; }
.shirt { fill: var(--shirt); stroke: var(--shirt-ln); stroke-width: 1.5; stroke-linejoin: round; }
.shirt-sh { fill: var(--screen); opacity: .16; }
.sleeve { stroke: var(--shirt); stroke-width: 7; stroke-linecap: round; fill: none; }
.sleeve-o { stroke: var(--shirt-ln); stroke-width: 9.4; stroke-linecap: round; fill: none; }
[class*='sk-'] { --shirt-ln: color-mix(in srgb, var(--shirt) var(--slp), var(--slc)); }   /* light theme: a darker line of its own colour; dark theme: a lighter cut edge */
.hand { fill: var(--fur); stroke: var(--edge); stroke-width: .9; }
.chair { fill: color-mix(in srgb, var(--concrete) 50%, var(--paper)); stroke: var(--edge); stroke-width: 1.4; stroke-linejoin: round; }
.sk-paper { --shirt: var(--edge); } .sk-mustard { --shirt: var(--mustard); } .sk-olive { --shirt: color-mix(in srgb, var(--olive), var(--glow) calc(var(--lift) * .6)); }
.sk-shade { --shirt: color-mix(in srgb, var(--concrete), var(--edge) calc(38% + var(--lift) * .34)); } .sk-rust { --shirt: color-mix(in srgb, var(--tangerine) 60%, var(--edge)); }
.sk-ink { --shirt: color-mix(in srgb, color-mix(in srgb, var(--screen) 66%, var(--walnut)), var(--glow) calc(var(--lift) * 1)); }
.vacant .mk, .vacant .hands, .vacant .tail, .vacant .tw, .vacant .prp, .vacant .chr { display: none; }
.vx { display: none; }
.vacant .vx { display: inline; }
.arrive { animation: arrive 700ms cubic-bezier(.3, .8, .25, 1) both; }
@keyframes arrive { from { transform: translateY(-26px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.sit { animation: sit 320ms steps(4) 1; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes sit { 0% { transform: scale(1, .86); } 60% { transform: scale(1, 1.05); } 100% { transform: scale(1); } }
.hl { filter: drop-shadow(0 0 5px var(--mustard)) drop-shadow(0 0 2px var(--edge)); }
.walker .wb { animation: wbob .28s steps(2, jump-none) infinite; }
@keyframes wbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
.zz { font: 700 10px var(--font-display); fill: var(--ink); opacity: 0; }
.g-glance .eyes { animation: glance 7s ease-in-out infinite; animation-delay: var(--d); }
@keyframes glance { 0%, 38%, 100% { transform: translateX(0); } 44%, 62% { transform: translateX(1.6px); } 70% { transform: translateX(-1px); } }

/* behaviours */
@keyframes tap { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
@keyframes hb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(.8px); } }
.b-type .armL { animation: tap calc(.2s * var(--t)) ease-in-out infinite; }
.b-type .armR { animation: tap calc(.23s * var(--t)) ease-in-out infinite reverse; }
.b-type .head { animation: hb calc(.4s * var(--t)) ease-in-out infinite; }
@keyframes peck { 0%, 8% { transform: rotate(-16deg); } 15% { transform: rotate(3deg); } 22%, 46% { transform: rotate(-16deg); } 53% { transform: rotate(-1deg); } 60%, 100% { transform: rotate(-14deg); } }
@keyframes look { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(4deg); } 53% { transform: rotate(-4deg); } 80% { transform: rotate(1deg); } }
.b-peck .armR { animation: peck calc(3.6s * var(--t)) linear infinite; animation-delay: var(--d); }
.b-peck .head { animation: look calc(3.6s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
@keyframes slam { 0%, 58%, 100% { transform: rotate(0); } 64% { transform: rotate(-34deg); } 74% { transform: rotate(-34deg); } 82% { transform: rotate(0); } }
@keyframes feed { 0%, 70% { transform: translateY(0); } 71%, 98% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
.b-slam .armR { animation: slam calc(3.4s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-slam .armL { animation: tap calc(.3s * var(--t)) ease-in-out infinite; }
.b-slam .tsheet { animation: feed calc(3.4s * var(--t)) steps(1) infinite; animation-delay: var(--d); }
@keyframes sip { 0%, 16% { transform: rotate(0); } 30%, 52% { transform: rotate(var(--sa)); } 66%, 100% { transform: rotate(0); } }
@keyframes mugt { 0%, 16% { transform: rotate(0); } 30%, 52% { transform: rotate(-64deg); } 66%, 100% { transform: rotate(0); } }
.b-sip .armR { animation: sip calc(6s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-sip .mug { animation: mugt calc(6s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
@keyframes stL { 0%, 52%, 100% { transform: rotate(0); } 60%, 70% { transform: rotate(150deg); } 78% { transform: rotate(0); } }
@keyframes stR { 0%, 52%, 100% { transform: rotate(0); } 60%, 70% { transform: rotate(-150deg); } 78% { transform: rotate(0); } }
@keyframes stH { 0%, 52%, 100% { transform: translateY(0); } 60%, 70% { transform: translateY(-3px); } 78% { transform: translateY(0); } }
.b-stretch .armL { animation: stL calc(9s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-stretch .armR { animation: stR calc(9s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-stretch .head { animation: stH calc(9s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
@keyframes flip { 0%, 66%, 100% { transform: scaleX(1); } 72% { transform: scaleX(.12); } 78% { transform: scaleX(1); } }
@keyframes scan { 0%, 100% { transform: translateX(-1.2px); } 50% { transform: translateX(1.2px); } }
.b-read .rpage { animation: flip calc(5s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-read .eyes { animation: scan calc(1.6s * var(--t)) ease-in-out infinite; }
@keyframes doze { 0% { transform: rotate(0); } 12%, 46% { transform: rotate(17deg) translateY(3px); } 52% { transform: rotate(-6deg); } 58% { transform: rotate(0); } 66%, 92% { transform: rotate(17deg) translateY(3px); } 100% { transform: rotate(0); } }
@keyframes lids { 0%, 6% { transform: scaleY(1); } 12%, 46% { transform: scaleY(.12); } 52%, 60% { transform: scaleY(1); } 66%, 92% { transform: scaleY(.12); } 98%, 100% { transform: scaleY(1); } }
@keyframes zzf { 0%, 10% { opacity: 0; transform: translate(0, 0); } 24%, 40% { opacity: 1; transform: translate(3px, -5px); } 48%, 62% { opacity: 0; } 76%, 88% { opacity: 1; transform: translate(3px, -5px); } 96%, 100% { opacity: 0; } }
.b-doze .head { animation: doze calc(9s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-doze .eyes { animation: lids calc(9s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-doze .zz { animation: zzf calc(9s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
@keyframes crank { 0%, 44%, 100% { transform: rotate(0); } 48% { transform: rotate(-7deg); } 52% { transform: rotate(3deg); } 56% { transform: rotate(-7deg); } 60% { transform: rotate(3deg); } 64% { transform: rotate(-7deg); } 68% { transform: rotate(3deg); } 72% { transform: rotate(0); } }
@keyframes spin { 0%, 44% { transform: rotate(0); } 72%, 100% { transform: rotate(720deg); } }
.b-sharpen .armL { animation: crank calc(4s * var(--t)) linear infinite; animation-delay: var(--d); }
.b-sharpen .cr { animation: spin calc(4s * var(--t)) linear infinite; animation-delay: var(--d); }
/* editor stamps and sends a capsule up the tube */
@keyframes stampT { 0%, 30% { transform: translateY(-13px); } 38%, 50% { transform: translateY(0); } 62%, 100% { transform: translateY(-13px); } }
@keyframes stampA { 0%, 30% { transform: rotate(0); } 38%, 50% { transform: rotate(18deg); } 62%, 100% { transform: rotate(0); } }
@keyframes mark { 0%, 37% { opacity: 0; } 39%, 96% { opacity: 1; } 100% { opacity: 0; } }
@keyframes tube { 0%, 52% { transform: translateY(0); opacity: 0; } 54% { opacity: 1; } 80% { transform: translateY(-96px); opacity: 1; } 84%, 100% { transform: translateY(-100px); opacity: 0; } }
.b-stamp .stampT { animation: stampT 3.4s cubic-bezier(.6, 0, .4, 1) infinite; }
.b-stamp .armR { animation: stampA 3.4s cubic-bezier(.6, 0, .4, 1) infinite; }
.b-stamp .mark { animation: mark 3.4s steps(1) infinite; }
.cap { animation: tube 3.4s ease-in infinite; }
.b-stamp .armL { animation: tap 1.1s ease-in-out infinite; }
@keyframes foot { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-12deg); } 86% { transform: rotate(0); } 92% { transform: rotate(-12deg); } }
.foot { animation: foot 2.6s ease-in-out infinite; }
.cand { transition: opacity .6s; }
.cand.gone { opacity: 0; }

/* ---------- life in the aisles ---------- */
.cartpos { animation: cartxy var(--cd) linear infinite; animation-delay: var(--cdl); }
.cartflip { animation: cartflip var(--cd) steps(1) infinite; animation-delay: var(--cdl); }
.wheel { animation: roll .5s linear infinite; }
@keyframes roll { to { transform: rotate(360deg); } }
.cartbob { animation: cbob .7s steps(2, jump-none) infinite; }
@keyframes cbob { 0% { transform: translateY(0); } 50% { transform: translateY(-.8px); } }
.plane { animation: plane 17s ease-in-out infinite; animation-delay: -5s; }
.planesh { animation: planesh 17s ease-in-out infinite; animation-delay: -5s; }
@keyframes plane { 0% { transform: translate(0, 0) rotate(8deg); opacity: 0; } 3% { opacity: 1; } 14% { transform: translate(60px, -22px) rotate(-5deg); } 28% { transform: translate(140px, -8px) rotate(6deg); } 42% { transform: translate(230px, -26px) rotate(-6deg); } 56% { transform: translate(310px, -12px) rotate(7deg); opacity: 1; } 60% { transform: translate(330px, -6px) rotate(14deg); opacity: 0; } 100% { transform: translate(330px, -6px); opacity: 0; } }
@keyframes planesh { 0% { transform: translate(0, 0); opacity: 0; } 3% { opacity: .28; } 56% { transform: translate(310px, 0); opacity: .28; } 60%, 100% { transform: translate(330px, 0); opacity: 0; } }
@keyframes water { 0%, 8%, 62%, 100% { transform: rotate(0); } 18%, 50% { transform: rotate(32deg); } }
@keyframes drop { 0%, 18% { transform: translateY(0); opacity: 0; } 22% { opacity: 1; } 50% { transform: translateY(24px); opacity: 1; } 54%, 100% { transform: translateY(26px); opacity: 0; } }
.shred { animation: shred 6s steps(8) infinite; }
@keyframes shred { 0%, 20% { transform: translateY(-14px); opacity: 0; } 24% { opacity: 1; } 60% { transform: translateY(8px); opacity: 1; } 62%, 100% { transform: translateY(10px); opacity: 0; } }
.can { animation: water 7s ease-in-out infinite; }
.drp { animation: drop 7s linear infinite; }
@keyframes bub { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-20px); opacity: 0; } }
.bub { animation: bub 2.4s ease-in infinite; animation-delay: var(--d); }
@keyframes cup { 0%, 20% { transform: rotate(0); } 34%, 56% { transform: rotate(var(--sa)); } 70%, 100% { transform: rotate(0); } }
.cupa { animation: cup 8s ease-in-out infinite; }
@keyframes scanbar { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(26px); } }
@keyframes eject { 0%, 45% { transform: translateY(0); } 70%, 100% { transform: translateY(7px); } }
.scan { animation: scanbar 2.6s ease-in-out infinite; }
.eject { animation: eject 5.2s steps(6) infinite; }
@keyframes coat { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
.coat { animation: coat 6s ease-in-out infinite; animation-delay: var(--d); }
@keyframes drawer { 0%, 50%, 100% { transform: translateY(0); } 58%, 82% { transform: translateY(5px); } }
.drw { animation: drawer 9s ease-in-out infinite; animation-delay: var(--d); }
@keyframes dstamp { 0%, 52% { transform: translateY(-9px); } 58%, 66% { transform: translateY(0); } 74%, 100% { transform: translateY(-9px); } }
@keyframes dmark { 0%, 57% { opacity: 0; } 59%, 96% { opacity: 1; } 100% { opacity: 0; } }
@keyframes dlean { 0%, 100% { transform: rotate(0); } 40%, 60% { transform: rotate(4deg); } }
.dst { animation: dstamp 7s steps(1) infinite; } .dmk { animation: dmark 7s steps(1) infinite; }
.dsil { animation: dlean 7s ease-in-out infinite; }
@keyframes elev { 0%, 80%, 100% { opacity: .25; } 84%, 94% { opacity: 1; } }
.elv { animation: elev 7s steps(1) infinite; }

/* performance: areas outside the camera and everything while the page is hidden stop animating */
.offscreen, .offscreen * { animation-play-state: paused !important; }
body.hidden-pause, body.hidden-pause * { animation-play-state: paused !important; }

/* reduced motion: no loops, no travel; each scene holds the pose that carries its meaning */
@media (prefers-reduced-motion: reduce) {
  .cam, .up { transition: none !important; }
  .pulse, .swing, .bub, .foot, .arrive, .cloud, .wheel, .cartbob, .g-glance .eyes, [class*='b-'] *, .scan, .eject, .cap, .shred, .coat, .drw, .dst, .dmk, .dsil, .elv, .cue, .cuesh, .sit, .walker .wb { animation: none !important; }
  .swing { transform: rotate(-1.6deg); }
  .pulse { opacity: .6; }
  .cartpos, .cartflip, .plane, .planesh, .can, .drp, .cupa { animation: none !important; }
  .cartpos { transform: translate(250px, 1062px); }
  .plane { transform: translate(250px, 6px) rotate(14deg); opacity: 1; } .planesh { transform: translate(250px, 18px); opacity: .3; }
  .can { transform: rotate(32deg); } .drp { opacity: 1; } .cupa { transform: rotate(var(--sa)); }
  .b-peck .armR { transform: rotate(-14deg); } .b-slam .armR { transform: rotate(-30deg); }
  .b-sip .armR { transform: rotate(var(--sa)); } .b-sip .mug { transform: rotate(-64deg); }
  .b-stretch .armL { transform: rotate(130deg); } .b-stretch .armR { transform: rotate(-130deg); }
  .b-doze .head { transform: rotate(17deg) translateY(3px); } .b-doze .eyes { transform: scaleY(.12); }
  .b-doze .zz { opacity: 1; transform: translate(3px, -5px); }
  .b-sharpen .armL { transform: rotate(-5deg); } .b-stamp .mark, .dmk { opacity: 1; } .b-stamp .stampT { transform: translateY(0); } .dst { transform: translateY(0); }
  .cap { opacity: 1; transform: translateY(-50px); } .elv { opacity: 1; }
}

/* ---------- header ---------- */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; z-index: 30;
  padding: max(8px, env(safe-area-inset-top)) 12px 8px; background: var(--walnut);
  border-bottom: 2px solid var(--mustard); color: var(--on-walnut);
  box-shadow: 0 6px 14px color-mix(in srgb, var(--screen) 40%, transparent);
  display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center;
}
.hdr .seal { width: 36px; height: 36px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .eb { font: 500 .75rem var(--font-display); letter-spacing: .12em; text-transform: uppercase; opacity: .92; margin: 0; line-height: 1.1; }
.brand h1 { font-size: 1.45rem; line-height: 1; color: var(--on-walnut); }
.dirbtn {
  min-width: 44px; min-height: 44px; border: 2px solid var(--hdr-edge); background: var(--paper); color: var(--ink);
  font: 700 .95rem var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px;
  display: flex; align-items: center; gap: 6px; border-radius: 6px 6px 14px 6px; cursor: pointer;
}
.dirbtn:active { transform: translateY(2px); }
.readout { grid-column: 1 / -1; display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 1px; background: var(--concrete); border: 1px solid var(--concrete); }
.readout > div { background: var(--screen); padding: 3px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 6px; min-width: 0; }
.readout .lb { font: 500 .7rem var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--screen-muted); }
.readout .v { font: 600 .98rem var(--font-mono); color: var(--screen-ink); font-variant-numeric: tabular-nums; text-shadow: 0 0 6px color-mix(in srgb, var(--screen-ink) 45%, transparent); }

/* ---------- paper UI: cut-paper cards, folder tabs, brass discs, typed forms ---------- */
:root { --btn: color-mix(in srgb, var(--sheet) 78%, var(--edge)); --rule: color-mix(in srgb, var(--walnut) 45%, transparent); --lift-sh: color-mix(in srgb, var(--screen) 45%, transparent); --soft-sh: color-mix(in srgb, var(--screen) 34%, transparent); }
.disc {
  display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--mustard) 55%, var(--edge)) 0 22%, var(--mustard) 60%, color-mix(in srgb, var(--mustard) 78%, var(--screen)) 100%);
  border: 1.5px solid var(--screen); box-shadow: 0 1.5px 0 var(--lift-sh), inset 0 0 0 2px color-mix(in srgb, var(--edge) 55%, transparent);
  color: var(--screen); font: 700 .95rem var(--font-type); line-height: 1;
}
.disc.sm { width: 22px; height: 22px; font-size: .8rem; }
/* tab: outer shape is the white cut rim, inner shape is the coloured paper; the wrapper carries the two-tier shadow */
.tabw { position: absolute; z-index: 2; filter: drop-shadow(0 -1px 0 var(--lift-sh)) drop-shadow(0 -4px 5px var(--soft-sh)); pointer-events: none; }
.fold-tab {
  position: relative; height: 34px; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 8px; white-space: nowrap;
  background: var(--edge); color: var(--screen);
  clip-path: polygon(0 100%, 0 30%, 10px 0, calc(100% - 10px) 0, 100% 30%, 100% 100%);
  font: 700 .9rem var(--font-display); letter-spacing: .12em; text-transform: uppercase;
}
.fold-tab::before { content: ''; position: absolute; inset: 2.5px 2.5px 0; background: var(--mustard); clip-path: polygon(0 100%, 0 30%, 8px 0, calc(100% - 8px) 0, 100% 30%, 100% 100%); z-index: 0; }
.fold-tab > * { position: relative; z-index: 1; }
.typed { font: 400 .76rem var(--font-type); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); margin: 0; }

/* directory: a cream card with a folder tab, typed index lines and brass number discs */
.dir {
  position: absolute; z-index: 40; right: 8px; top: calc(var(--hdr, 98px) + 44px); width: 262px;
  background: var(--sheet); border: 2px solid var(--edge); border-radius: 4px 8px 8px 8px; padding: 12px 12px 8px; color: var(--ink);
  box-shadow: 0 3px 0 var(--lift-sh), 6px 12px 22px var(--soft-sh);
  transform-origin: 90% 0; transition: transform .28s cubic-bezier(.3, .8, .25, 1), opacity .2s, visibility 0s;
}
.dir::after { content: ''; position: absolute; inset: 5px; border: 1px solid var(--rule); border-radius: 2px; pointer-events: none; }
.dir[hidden] { display: block; visibility: hidden; opacity: 0; transform: perspective(500px) rotateX(-60deg); pointer-events: none; transition: transform .22s, opacity .2s, visibility 0s .22s; }
.dir .tabw { top: -32px; right: 18px; }
.dir .typed { margin: 4px 4px 2px; }
.dir ul { list-style: none; margin: 0; padding: 0; }
.dir li { border-bottom: 1.5px dotted var(--concrete); }
.dir li:last-child { border-bottom: 0; }
.dir button, .dir .dis { width: 100%; min-height: 48px; display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 10px; text-align: left; background: transparent; border: 0; border-radius: 3px; padding: 4px 6px; color: var(--ink); cursor: pointer; position: relative; }
.dir button:active { background: color-mix(in srgb, var(--glow) 55%, transparent); }
.dir .dis { cursor: default; margin-top: 4px; border: 2px dashed var(--concrete); }
.dir .plate { display: grid; place-items: center; width: 30px; height: 24px; border: 2px dashed var(--ink-muted); border-radius: 3px; font: 700 .8rem var(--font-type); color: var(--ink-muted); }
.dir .nm { font: 700 1.04rem var(--font-display); letter-spacing: .06em; text-transform: uppercase; line-height: 1; color: var(--ink); }
.dir .hn { display: block; font: 400 .74rem var(--font-type); letter-spacing: 0; text-transform: none; color: var(--ink-muted); margin-top: 3px; }
.dir button[aria-current='true']::after { content: ''; position: absolute; left: 44px; right: 8px; bottom: 3px; height: 3px; background: var(--tangerine); }

/* ---------- sheet: a paper form that unfolds, capped at 40% of the screen ---------- */
.sheetwrap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; perspective: 900px; pointer-events: none; }
.sheet {
  position: relative; pointer-events: auto; background: var(--sheet); color: var(--ink);
  display: flex; flex-direction: column; max-height: 40dvh;
  border: 2px solid var(--edge); border-bottom: 0; border-radius: 8px 8px 0 0; margin: 0 8px;
  padding: 12px 14px calc(8px + env(safe-area-inset-bottom));
  box-shadow: 0 -2px 0 var(--lift-sh), 0 -12px 26px var(--soft-sh);
  transform-origin: 50% 100%; transform: rotateX(78deg) translateY(30px); opacity: 0; visibility: hidden;
  transition: transform 560ms cubic-bezier(.3, .8, .25, 1), opacity 300ms, visibility 0s 560ms;
}
.sheet.open { transform: none; opacity: 1; visibility: visible; transition-delay: 220ms, 220ms, 0s; }
/* a second, offset sheet peeks out behind (paper under paper) */
.sheet::before { content: ''; position: absolute; left: 14px; right: 14px; top: -9px; height: 9px; background: var(--paper-shade); border: 2px solid var(--edge); border-bottom: 0; border-radius: 6px 6px 0 0; z-index: -1; box-shadow: 0 -2px 4px var(--soft-sh); }
.sheet::after { content: ''; position: absolute; inset: 5px 5px 0; border: 1px solid var(--rule); border-bottom: 0; border-radius: 4px 4px 0 0; pointer-events: none; }
.sheetgrain { position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply; border-radius: inherit;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='5'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.16'/></svg>"); }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .sheetgrain { mix-blend-mode: screen; opacity: .35; } }
:root[data-theme='dark'] .sheetgrain { mix-blend-mode: screen; opacity: .35; }
.sheet .tabw { top: -33px; left: 16px; }
.shead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding-bottom: 6px; border-bottom: 3px double var(--rule); flex: none; position: relative; }
.sheet h2 { font-size: 1.5rem; line-height: 1; color: var(--head); }
.sheet h2:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
.form { font: 400 .76rem var(--font-type); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 4px 0 0; }
.close {
  min-height: 44px; min-width: 44px; background: var(--btn); border: 2px solid var(--ctl); border-radius: 3px 3px 12px 3px; color: var(--ink);
  box-shadow: 0 3px 0 var(--ctl), 0 5px 6px var(--soft-sh); cursor: pointer;
  font: 700 .92rem var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex: none;
}
.close:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ctl); }
.sbody { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 8px 4px 4px; margin: 0 -4px; position: relative; }
.sheet > .sheetgrain { position: absolute; }
.sheet > :not(.sheetgrain):not(.tabw) { position: relative; }
.field { display: flex; align-items: baseline; gap: 8px; }
.field .lead { flex: 1; border-bottom: 1.5px dotted var(--concrete); transform: translateY(-4px); min-width: 12px; }
.lab { font: 400 .8rem var(--font-type); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); margin: 0; font-weight: 700; }
.big { font: 600 1.35rem var(--font-mono); font-variant-numeric: tabular-nums; line-height: 1.1; }
.big small { font: 400 .85rem var(--font-body); }
.desks { display: flex; gap: 4px; margin-top: 6px; }
.desks i { flex: 1; height: 18px; position: relative; border-radius: 2px; border: 1.5px dashed var(--ink-muted); background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--concrete) 22%, transparent) 4px 6px); }
.desks i.on { border: 1.5px solid var(--screen); background: linear-gradient(var(--walnut) 0 28%, color-mix(in srgb, var(--walnut) 80%, var(--screen)) 28%); box-shadow: 0 1.5px 0 var(--lift-sh); }
.desks i.on::after { content: ''; position: absolute; left: 50%; top: 9px; width: 8px; height: 3px; margin-left: -4px; border-radius: 1.5px; background: var(--mustard); }
.desks i.fresh { animation: fresh 1.4s ease-out 1; }
@keyframes fresh { 0%, 60% { box-shadow: 0 0 0 3px var(--mustard); } 100% { box-shadow: 0 1.5px 0 var(--lift-sh); } }
.note { font: 400 .9rem var(--font-body); margin: 6px 0 0; }
.delta { font: 400 .82rem var(--font-type); margin: 0; color: var(--ink); }
.why { font: 400 .82rem var(--font-type); color: var(--ink-muted); margin: 0; }
.formbox { border: 1.5px solid var(--rule); background: color-mix(in srgb, var(--paper-shade) 38%, var(--sheet)); padding: 8px 10px; margin-top: 8px; position: relative; }
.formbox::before { content: attr(data-no); position: absolute; right: 8px; top: -9px; padding: 0 6px; background: var(--sheet); font: 400 .68rem var(--font-type); letter-spacing: .12em; color: var(--ink-muted); }
.hirebox { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; justify-items: center; margin-top: 12px; position: relative; }
.hirebox.tut { padding-left: 50px; }
.hirebox.tut .hire { width: 100%; }
.hire {
  --d: 6px; width: min(100%, 300px); min-height: 56px; border: 3px solid var(--ctl); background: var(--tangerine); color: var(--screen);
  font: 700 1.35rem var(--font-display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  border-radius: 44px 44px 30px 30px / 40px 40px 26px 26px; box-shadow: inset 0 0 0 2px var(--mustard), 0 var(--d) 0 var(--ctl), 0 calc(var(--d) + 4px) 8px color-mix(in srgb, var(--screen) 40%, transparent);
  position: relative; transition: transform 90ms, box-shadow 90ms; padding: 2px 18px;
}
.hire:focus-visible { box-shadow: inset 0 0 0 2px var(--mustard), 0 var(--d) 0 var(--ctl), 0 0 0 6px var(--paper); }
.hire::before { content: ''; position: absolute; left: 22%; right: 22%; top: 5px; height: 8px; border-radius: 50%; background: var(--glow); opacity: .5; }
.hire:active:not(:disabled) { transform: translateY(5px); --d: 1px; }
.hire:disabled { background: var(--concrete); color: var(--screen); border-color: var(--ctl); cursor: not-allowed; }
.hire.nudge { animation: nudge 2s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { outline: 0 solid transparent; } 50% { outline: 6px solid color-mix(in srgb, var(--mustard) 50%, transparent); outline-offset: 2px; } }
.pt { position: absolute; left: -2px; top: 8px; width: 46px; height: 34px; pointer-events: none; animation: ptn 1.6s steps(2, jump-none) infinite; filter: drop-shadow(2px 3px 0 color-mix(in srgb, var(--screen) 35%, transparent)); }
@keyframes ptn { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
.row2 { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.btn2 { min-height: 44px; padding: 6px 14px; background: var(--btn); border: 2px solid var(--ctl); font: 700 .98rem var(--font-display); letter-spacing: .08em; text-transform: uppercase; border-radius: 3px 3px 10px 3px; cursor: pointer; color: var(--ink); box-shadow: 0 3px 0 var(--ctl), 0 5px 6px var(--soft-sh); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn2:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ctl); }
.bn { width: 22px; height: 15px; flex: none; }
.btn2:disabled { border: 2px dashed var(--ink-muted); background: transparent; color: var(--ink-muted); cursor: not-allowed; box-shadow: none; }
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gauge { text-align: center; }
.gauge svg { width: 100%; height: auto; max-width: 150px; filter: drop-shadow(0 2px 0 var(--lift-sh)); }
.gauge .gv { font: 700 .82rem var(--font-type); letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
.gauge .lab { margin-top: 0; }
.bar { height: 14px; border: 1.5px solid var(--walnut); background: var(--sheet) linear-gradient(90deg, transparent calc(100% - 1.5px), var(--rule) 0) 0 0 / 10% 100%; position: relative; margin-top: 4px; }
.bar > i { position: absolute; inset: 1px auto 1px 1px; background: repeating-linear-gradient(135deg, var(--olive) 0 5px, color-mix(in srgb, var(--olive) 62%, var(--edge)) 5px 8px); border-right: 3px solid var(--mustard); }
.drow { display: grid; grid-template-columns: 1fr 104px; gap: 4px 10px; align-items: center; padding: 6px 0; border-top: 1.5px dotted var(--concrete); }
.drow:first-child { border-top: 0; }
.drow .nm { font: 700 1.05rem var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.stamp { display: inline-block; border: 3px double var(--stamp); color: var(--stamp); font: 700 .9rem var(--font-display); letter-spacing: .16em; padding: 1px 8px; transform: rotate(-4deg); border-radius: 2px; }

/* ---------- Ernest: peeks over his card from the bottom-right aisle, never over what he teaches ---------- */
.ewrap { position: absolute; z-index: 35; right: 8px; bottom: 10px; width: 156px; pointer-events: none; display: flex; flex-direction: column; align-items: flex-end;
  transform: translate(190px, 0) rotate(3deg); opacity: 0; visibility: hidden; transform-origin: 100% 100%;
  transition: transform 620ms cubic-bezier(.3, .8, .25, 1), opacity 260ms, visibility 0s 620ms; }
.ewrap.in { transform: none; opacity: 1; visibility: visible; transition-delay: 0s; }
.ewrap.docked { bottom: auto; top: calc(var(--hdr, 98px) + 6px); width: 134px; }
.efig { width: 104px; height: 97px; margin: 0 4px -16px 0; pointer-events: none; position: relative; z-index: 0; }
.ewrap.docked .efig { width: 58px; height: 52px; margin: 0 8px -5px 0; }   /* a peek: face and pencil over the card corner */
.efig .arm { transform-origin: 74px 78px; transform: rotate(var(--aim, 0deg)); }
.ernest {
  position: relative; z-index: 1; pointer-events: auto; width: 100%; padding: 8px 10px 8px 12px;
  background: var(--sheet); color: var(--ink); border: 2px solid var(--edge); border-radius: 4px;
  box-shadow: 0 2px 0 var(--lift-sh), 4px 8px 14px var(--soft-sh);
}
.ernest::before { content: ''; position: absolute; inset: 3px; border: 1px solid var(--rule); pointer-events: none; }
.ernest .reel { white-space: nowrap; font: 400 .66rem var(--font-type); letter-spacing: .03em; text-transform: uppercase; color: var(--ink-muted); margin: 0; }
.ernest h2 { font-size: 1.1rem; color: var(--head); line-height: 1.05; }
.ernest p.say { margin: 3px 0 6px; font-size: .84rem; line-height: 1.28; }
.ernest .ok { min-height: 44px; width: 100%; display: block; padding: 0 12px; background: var(--walnut); color: var(--on-walnut); border: 2px solid var(--ctl); border-radius: 3px 3px 10px 3px; font: 700 .98rem var(--font-display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; box-shadow: 0 3px 0 var(--ctl); }

<script>
(() => {

const f1 = n => Math.round(n * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const BEH_LABEL = { type: 'touch-typing', peck: 'hunt-and-peck', slam: 'carriage-return slam', sip: 'sipping from a mug', stretch: 'stretching', read: 'reading a page', doze: 'dozing', sharpen: 'sharpening a pencil', stamp: 'stamping' };

  { fur: 1, H: 47, bw: 25, tw: 1.2, hr: 12.5, ears: 'big', lean: 8, view: 'pr', gaze: [1, .6], eyes: 'wide', mouth: 'tongue', head: 'swirl', body: 'none', tail: 'curl', prop: 1, ps: -1, beh: 'peck', shirt: 'sk-mustard', chair: 'short', fwd: 4 },
  { fur: 2, H: 64, bw: 26, tw: .95, hr: 11, ears: 'tuft', lean: 4, view: 'f', gaze: [0, -.9], eyes: 'wide', mouth: 'teeth', head: 'glassesS', body: 'bowtie', tail: 'hang', prop: 5, ps: 1, beh: 'slam', shirt: 'sk-olive', chair: 'round' },

  { fur: 0, H: 58, bw: 40, tw: .88, hr: 14.5, ears: 'small', lean: 0, view: 'f', gaze: [0, 0], eyes: 'closed', mouth: 'o', head: 'none', body: 'lanyard', tail: 'none', prop: 4, ps: -1, beh: 'stretch', shirt: 'sk-rust', chair: 'short' },
  { fur: 5, H: 55, bw: 24, tw: 1.0, hr: 11.5, ears: 'round', lean: -5, view: 'pl', gaze: [-1, .3], eyes: 'open', mouth: 'frown', head: 'glassesR', body: 'bowtie', tail: 'up', prop: 2, ps: 1, beh: 'read', shirt: 'sk-paper', chair: 'round', fwd: 3 },

  { fur: 2, H: 54, bw: 30, tw: 1.0, hr: 12, ears: 'tuft', lean: 7, view: 'l', gaze: [-1, .5], eyes: 'wide', mouth: 'smile', head: 'bow', body: 'none', tail: 'curl', prop: 4, ps: 1, beh: 'sharpen', shirt: 'sk-olive', chair: 'short' },
  // beyond the first eight desks: generated from the desk index
];
const EARS = ['round', 'big', 'small', 'tuft'], VIEWS = ['f', 'l', 'r', 'pl', 'pr'], MOUTHS = ['smile', 'flat', 'o', 'tongue', 'teeth', 'frown', 'smirk'];
const BEHS = ['type', 'peck', 'slam', 'sip', 'stretch', 'read', 'doze', 'sharpen'];
function gen(i) {
  const r = (k, n) => hash(i * 31 + k * 977) % n;
  return { fur: r(1, 6), H: 46 + r(2, 18), bw: 24 + r(3, 16), tw: .9 + r(4, 45) / 100, hr: 11 + r(5, 4), ears: EARS[r(6, 4)], lean: r(7, 15) - 7, view: VIEWS[r(8, 5)], gaze: [r(9, 3) - 1, r(10, 3) - 1], eyes: ['open', 'wide', 'heavy'][r(11, 3)], mouth: MOUTHS[r(12, 7)], head: ['none', 'none', 'glassesR', 'bow', 'pencil'][r(13, 5)], body: ['none', 'tie', 'cardigan', 'lanyard'][r(14, 4)], tail: ['curl', 'up', 'hang', 'none'][r(15, 4)], prop: r(16, 6), ps: r(17, 2) ? 1 : -1, beh: BEHS[r(18, 8)], shirt: ['sk-paper', 'sk-mustard', 'sk-olive', 'sk-shade', 'sk-rust'][r(19, 5)], chair: ['tall', 'short', 'round'][r(20, 3)] };

const rot = (p, a, o) => { const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r), x = p[0] - o[0], y = p[1] - o[1]; return [o[0] + x * c - y * s, o[1] + x * s + y * c]; };

/* ===== svg helpers ===== */
// standing piece: contact + long shadow, fold tabs, front face, cut rim, lighter top face
function pbox({ x, yb, w, h, d = 8, c = 'walnut', extra = '', before = '', cls = '', tabs = true, shadow = true, glass = false, sk = 1 }) {

    `<polygon class="shc" points="${x + 8},${base - 3} ${x + w - 8},${base - 3} ${x + w - 4},${base + 2} ${x + 4},${base + 2}" style="opacity:.16"/>` +

function ficus(cx, yb, s = 1) {

  areas.forEach(a => { const r = a.el.getBoundingClientRect(); a.box = [(r.left - o.left) / cs, (r.top - o.top) / cs, (r.right - o.left) / cs, (r.bottom - o.top) / cs]; });
}
function cull() {
  if (!areas[0].box) return;
  const m = 8 / cs, x0 = -cx / cs - m, x1 = (VW - cx) / cs + m, y0 = (HDRH - cy) / cs - m, y1 = (VH - cy) / cs + m;
  for (const a of areas) { const b = a.box, off = b[2] < x0 || b[0] > x1 || b[3] < y0 || b[1] > y1; if (off !== a.off) { a.off = off; a.el.classList.toggle('offscreen', off); } }
}
function put(x, y, s) { cx = x; cy = y; cs = s; cam.style.setProperty('--tx', x + 'px'); cam.style.setProperty('--ty', y + 'px'); cam.style.setProperty('--s', s); cull(); placeSigns(); }
const lim = (s = cs) => ({ minX: VW - WW * s - 18, maxX: 18, minY: VH - WH * s - 14, maxY: HDRH + 6 });   // a sliver of table shows at each edge
function clampFree(x, y, s = cs) { const l = lim(s); return [clamp(x, l.minX, l.maxX), clamp(y, l.minY, l.maxY)]; }
function frameBox([bx, by, bw, bh], dock = 0) {
  const sh = sheet.offsetHeight || 330, bottom = VH - sh - 38, top = HDRH + 8, availW = VW - dock;
  const s = clamp(Math.min((availW - 10) / bw, (bottom - top) / bh), .5, 1.35);
  put(availW / 2 - s * (bx + bw / 2), (top + bottom) / 2 - s * (by + bh / 2), s);
}
const dockW = () => (state.ernest ? 142 : 0);
function frameZone(id) { frameBox(Z[id].box, dockW()); }
const areaVisible = (id, x, y) => { const [bx, by, bw, bh] = Z[id].box, tx = x + (bx + bw / 2) * PS, ty = y + (by + bh / 2) * PS; return tx > 20 && tx < VW - 20 && ty > HDRH + 20 && ty < VH - 20; };
function open(id) {
  const z = Z[id];
  if (!state.open) free = areaVisible(id, cx, cy) ? [cx, cy, cs] : homeCam(id);   // coming from the Directory, close returns to the room, not to where you were
  if (state.open && state.open !== id) $(`#z-${state.open}`).classList.remove('pop', 'active');
  state.open = id;
  $('#foldtab').innerHTML = `<span class="disc sm" aria-hidden="true">${z.n}</span><span>${z.name}</span>`;
  renderBody(id);
  $(`#z-${id}`).classList.add('pop', 'active');
  setDock(state.ernest);
  sheet.classList.add('open');
  signsEl.hidden = true;
  const hd = $('#sheet-h'); if (hd) hd.focus({ preventScroll: true });   // keyboard focus moves into the sheet, to its heading
  frameZone(id);
  document.querySelectorAll('#dirlist button').forEach(b => b.setAttribute('aria-current', b.dataset.zone === id ? 'true' : 'false'));
  say(z.name + ' opened.');
  setTimeout(() => { if (state.open === id && !state.walking) frameZone(id); }, 60);
  ernestSay();
}
let free = DEFAULT.slice();
function close() {
  if (!state.open) return;
  const id = state.open; state.open = null;
  $(`#z-${id}`).classList.remove('pop', 'active');
  sheet.classList.remove('open');
  put(...free);
  setDock(false);
  signsEl.hidden = false; placeSigns();
  document.querySelectorAll('#dirlist button').forEach(b => b.setAttribute('aria-current', 'false'));
  const hot = $(`.hot[data-zone="${id}"]`); if (hot) { closing = true; hot.focus({ preventScroll: true }); closing = false; }
  say('Back on the floor.');
  ernestSay();
}
function setDock(on) {   // docked Ernest keeps his face and pencil: the figure is cropped to a head peek on the card corner
  ewrap.classList.toggle('docked', !!on);
  efig.setAttribute('viewBox', on ? '56 12 72 66' : '0 0 138 128');
}
function wire() {
  const c = $('#closebtn'); if (c) c.onclick = close;
  const h = $('#hire'); if (h) h.onclick = hire;
  const b = $('#buydesk'); if (b) b.onclick = buyDesk;
}
function renderBody(id) {
  const z = Z[id];
  $('#sheethead').innerHTML = `<div class="shead"><div><h2 id="sheet-h" tabindex="-1">${z.name}</h2><p class="form">${z.form}</p></div><button class="close" id="closebtn" aria-label="Fold down ${z.name}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>Fold down</button></div>`;
  $('#sheetbody').innerHTML = SHEETS[id]();
  wire();
}

/* ===== hiring: the waiting candidate walks (mechanically) from the entrance to the vacant desk and sits ===== */
const NS = 'http://www.w3.org/2000/svg';
const WALK_BOX = [195, 900, 400, 460], SPEED = 250;   // the last stretch: left aisle, up, and into the Pool's front row
function hire() {
  if (state.seated >= state.desks) return;
  const idx = state.seated;
  state.seated++; state.monkeys++; state.income += 1.1; state.bananas -= state.hireCost;
  state.hired = true; state.tut = false; state.fresh = idx; stage.classList.add('hired');
  paintReadout(); say(`Monkey hired and walking to desk ${idx + 1}. ${state.seated} of ${state.desks} desks seated.`);
  ernestSay();
  const h = $('#hire'); const focusHire = document.activeElement === h;
  renderBody('personnel'); if (focusHire && $('#hire') && !$('#hire').disabled) $('#hire').focus(); else if ($('#buydesk')) $('#buydesk').focus();
  walkTo(idx);
}
function walkTo(idx) {
  const seat = $(`.seat[data-i="${idx}"]`), cand = $('#cand'), map = $('#map');
  const hasSeat = !!seat && idx < 10;
  const tx = hasSeat ? POOL.xs[idx % 4] : 330, ty = (hasSeat ? POOL.rows[idx >> 2] : 1000) + POOL.dy + (hasSeat ? 24 : 0);
  const done = () => {
    if (hasSeat) { seat.classList.remove('vacant'); seat.classList.add('sit', 'hl'); setTimeout(() => seat.classList.remove('sit'), 400); setTimeout(() => seat.classList.remove('hl'), 1700); }
    state.walking = Math.max(0, state.walking - 1);
    if (!state.walking && state.open === 'personnel') setTimeout(() => { if (!state.walking && state.open === 'personnel') frameZone('personnel'); }, reduce.matches ? 1400 : 500);
    // the next candidate comes through the door if a desk is still free
    if (state.seated + state.pending < state.desks && cand) setTimeout(() => { cand.style.visibility = ''; if (!reduce.matches) { cand.classList.remove('arrive'); void cand.getBoundingClientRect(); cand.classList.add('arrive'); } }, 700);
  };
  state.walking++;
  if (cand) cand.style.visibility = 'hidden';
  if (state.open === 'personnel') frameBox(WALK_BOX, dockW());
  if (reduce.matches) { done(); return; }
  const w = document.createElementNS(NS, 'g'); w.setAttribute('class', 'walker');
  w.innerHTML = `<g class="wf"><g class="wb">${cand.innerHTML}</g></g>`;
  map.appendChild(w);
  const pts = [[532, 1336], [236, 1336], [236, ty], [tx, ty]];   // from the door, along the front of the pad, up the left aisle, into the Pool
  const d = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1])), total = d.reduce((a, b) => a + b, 0);
  let acc = 0; const offs = [0, ...d.map(v => (acc += v) / total)];
  const kf = pts.map((p, i) => ({ offset: offs[i], transform: `translate(${p[0]}px, ${p[1]}px)` }));
  w.style.transform = kf[0].transform;
  const run = () => {
    const a = w.animate(kf, { duration: total / SPEED * 1000, easing: 'linear', fill: 'forwards' });
    w.querySelector('.wf').animate([{ transform: 'scaleX(1)', offset: 0 }, { transform: 'scaleX(1)', offset: offs[2] }, { transform: 'scaleX(-1)', offset: offs[2] }, { transform: 'scaleX(-1)', offset: 1 }], { duration: total / SPEED * 1000, easing: 'linear', fill: 'forwards' });
    a.onfinish = () => { w.remove(); done(); };
  };
  setTimeout(run, 520);                        // let the camera pull back first
}
function buyDesk() { state.desks++; state.bananas -= state.deskCost; paintReadout(); say(`Desk ${state.desks} installed.`); renderBody('personnel'); $('#buydesk').focus(); const c = $('#cand'); if (c && !state.walking) c.style.visibility = ''; }

/* ===== signposts: small paper pointers at the screen edge name the neighbours of where you are; tap one to pan there ===== */
const signsEl = $('#signs');
const LINKS = { personnel: ['pool'], pool: ['personnel', 'departments', 'director'], departments: ['director', 'pool'], director: ['departments', 'pool'] };
const ARROW = '<svg class="sp-arrow" viewBox="0 0 24 24" aria-hidden="true"><g class="rot"><g class="nudge"><path d="M2.5 9.4h10.2V3.6L22 12l-9.3 8.4v-5.8H2.5z" fill="var(--screen)" stroke="var(--edge)" stroke-width="1.1" stroke-linejoin="round"/></g></g></svg>';
const SP = {};
Object.entries(Z).forEach(([id, z]) => {
  const b = document.createElement('button');
  b.className = 'sp u'; b.hidden = true; b.dataset.go = id;
  b.innerHTML = `<span class="sp-in">${ARROW}<span>${z.go}</span></span>`;
  b.addEventListener('click', () => { panTo(id); const h = $(`.hot[data-zone="${id}"]`); if (h) h.focus({ preventScroll: true }); say(`Panned to ${z.name}.`); });
  signsEl.appendChild(b); SP[id] = { el: b, w: 0, h: 46, dir: '', word: '' };
});
const nearest = () => { let best = null, bd = 1e9; for (const id in Z) { const h = homeCam(id), d = Math.hypot(cx - h[0], cy - h[1]); if (d < bd) { bd = d; best = id; } } return [best, bd]; };
const WORDS = ['right', 'down and right', 'down', 'down and left', 'left', 'up and left', 'up', 'up and right'];
function placeSigns(x = cx, y = cy) {
  if (state.open) return;
  const want = new Set(LINKS[nearest()[0]]);
  const top = HDRH + 8, bot = VH - 8, items = [];
  for (const id in SP) {
    const sp = SP[id], b = sp.el;
    const [bx, by, bw, bh] = Z[id].box, tx = x + (bx + bw / 2) * cs, ty = y + (by + bh / 2) * cs;
    // hide when it is already the thing in front of you, or when it is not one of this place's neighbours
    const onscreen = tx > 24 && tx < VW - 24 && ty > top + 40 && ty < bot - 40;
    if (!want.has(id) || onscreen) { if (!b.hidden) b.hidden = true; continue; }
    if (b.hidden) b.hidden = false;
    if (!sp.w) { sp.w = b.offsetWidth; sp.h = b.offsetHeight; }
    const dx = tx - VW / 2, dy = ty - (top + bot) / 2;
    let px, py;
    if (Math.abs(dy) >= Math.abs(dx) * .6) {                       // above or below: pin to the top or bottom edge band, slide along it toward the target
      py = dy < 0 ? top + sp.h / 2 + 40 : bot - sp.h / 2 - 48;
      px = clamp(VW / 2 + dx * Math.abs((py - (top + bot) / 2) / dy), 10 + sp.w / 2, (dy > 0 && state.ernest ? 218 : VW - 10) - sp.w / 2);   // Ernest's card owns the bottom right
    } else {                                                        // beside: pin to the left or right edge, just below the target's floor edge so it never hides the place itself
      px = dx < 0 ? 6 + sp.w / 2 : VW - 6 - sp.w / 2;
      py = clamp(ty + bh * cs / 2 + 36, top + 60, bot - 100);
    }
    items.push({ id, sp, tx, ty, px, py });
  }

  items.sort((a, c) => a.py - c.py);

    const a = items[k], c = items[i];
    if (Math.abs(a.px - c.px) < (a.sp.w + c.sp.w) / 2 + 4 && Math.abs(a.py - c.py) < a.sp.h + 6) c.py = a.py + a.sp.h + 8;
  }
  for (const it of items) {
    const { id, sp, tx, ty, px, py } = it, b = sp.el;
    const ang = Math.atan2(ty - py, tx - px) * 180 / Math.PI, a = ((ang + 360) % 360);
    const cls = a < 45 || a >= 315 ? 'r' : a < 135 ? 'd' : a < 225 ? 'l' : 'u';
    if (cls !== sp.dir) { b.className = 'sp ' + cls; sp.dir = cls; sp.w = b.offsetWidth; sp.h = b.offsetHeight; }
    b.style.transform = `translate(${f1(px - sp.w / 2)}px, ${f1(py - sp.h / 2)}px)`;
    b.style.setProperty('--a', f1(ang) + 'deg');
    const word = WORDS[Math.round(a / 45) % 8];
    if (word !== sp.word) { sp.word = word; b.setAttribute('aria-label', `${Z[id].name}, ${word}. Pans there.`); }
  }
}
function trackSigns(ms) {   // signposts follow the camera while it eases
  const t0 = performance.now();
  const tick = t => { const m = new DOMMatrix(getComputedStyle(cam).transform); placeSigns(m.m41, m.m42); if (t - t0 < ms) requestAnimationFrame(tick); else placeSigns(); };
  requestAnimationFrame(tick);
}
function panTo(id, snap) {
  cam.classList.toggle('snap', !!snap);
  put(...homeCam(id));
  if (!reduce.matches) trackSigns(snap ? 520 : 820);
  if (snap) setTimeout(() => cam.classList.remove('snap'), 540);
}
/* after a pan settles, a gentle magnet: if a place is nearly centred, ease it fully into the frame */
function settle() {
  if (reduce.matches || state.open) return;
  const [id, d] = nearest();
  if (d > 2 && d < 140) panTo(id, true); else placeSigns();
}
/* keyboard: Tab into a place's button brings that place into view */
document.querySelectorAll('.hot').forEach(h => h.addEventListener('focus', () => { if (!state.open && nearest()[0] !== h.dataset.zone && !closing) panTo(h.dataset.zone); }));
let closing = false;
/* a modal sheet traps Tab */
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || !state.open) return;
  const list = [...sheet.querySelectorAll('button:not([disabled]), [href], input, select, textarea')].filter(el => el.getClientRects().length);
  if (!list.length) { e.preventDefault(); return; }
  const a = document.activeElement, i = list.indexOf(a), inside = sheet.contains(a);
  if (e.shiftKey) { if (i <= 0) { e.preventDefault(); list[list.length - 1].focus(); } }
  else if (!inside || i === list.length - 1) { e.preventDefault(); list[0].focus(); }
});

/* directory */
const dir = $('#dir'), dirbtn = $('#dirbtn');
$('#dirlist').innerHTML = Object.entries(Z).map(([id, z]) => `<li><button data-zone="${id}" aria-current="false"><span class="disc" aria-hidden="true">${z.n}</span><span class="nm">${z.name}<span class="hn">${z.hint()}</span></span></button></li>`).join('');
function closeDir() { dir.hidden = true; dirbtn.setAttribute('aria-expanded', 'false'); }
dirbtn.addEventListener('click', () => { setHdr(); const o = dir.hidden; dir.hidden = !o; dirbtn.setAttribute('aria-expanded', String(o)); if (o) document.querySelectorAll('#dirlist button').forEach(b => { b.querySelector('.hn').textContent = Z[b.dataset.zone].hint(); }); });
$('#dirlist').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; closeDir(); open(b.dataset.zone); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!dir.hidden) { closeDir(); dirbtn.focus(); } else close(); }
  if (!state.open && e.target === document.body && e.key.startsWith('Arrow')) { const d = { ArrowLeft: [80, 0], ArrowRight: [-80, 0], ArrowUp: [0, 80], ArrowDown: [0, -80] }[e.key]; const [x, y] = clampFree(cx + d[0], cy + d[1], PS); put(x, y, PS); clearTimeout(window.__kt); window.__kt = setTimeout(settle, 400); }
});
document.addEventListener('pointerdown', e => { if (!dir.hidden && !e.target.closest('#dir, #dirbtn')) closeDir(); });
document.addEventListener('visibilitychange', () => document.body.classList.toggle('hidden-pause', document.hidden));

/* ===== free pan: drag with gentle momentum, clamped edges ===== */
let dragMoved = false, coasting = false;
(() => {
  let down = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, hist = [], raf = 0;
  const live = () => { const m = new DOMMatrix(getComputedStyle(cam).transform); return [m.m41, m.m42]; };
  cam.addEventListener('pointerdown', e => {
    if (state.open) return;
    cancelAnimationFrame(raf); const wasCoast = coasting; coasting = false;
    const [lx, ly] = live(); put(lx, ly, PS); cam.classList.add('dragging');
    down = true; moved = false; sx = e.clientX; sy = e.clientY; ox = lx; oy = ly; hist = [[performance.now(), lx, ly]];
    if (wasCoast) dragMoved = true;
  });
  window.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < 6) return;
    moved = true;
    const [x, y] = clampFree(ox + dx, oy + dy, PS); put(x, y, PS);
    hist.push([performance.now(), x, y]); if (hist.length > 6) hist.shift();
  });
  window.addEventListener('pointerup', () => {
    if (!down) return; down = false;
    if (!moved) { cam.classList.remove('dragging'); if (dragMoved) setTimeout(() => (dragMoved = false), 80); return; }
    dragMoved = true; setTimeout(() => (dragMoved = false), 120);
    const a = hist[0], b = hist[hist.length - 1], dt = Math.max(1, b[0] - a[0]);
    let vx = (b[1] - a[1]) / dt, vy = (b[2] - a[2]) / dt;
    if (performance.now() - b[0] > 90 || reduce.matches) { cam.classList.remove('dragging'); settle(); return; }
    coasting = true; let last = performance.now();
    const step = t => {
      const d = Math.min(32, t - last); last = t;
      const k = Math.pow(.93, d / 16); vx *= k; vy *= k;
      let nx = cx + vx * d, ny = cy + vy * d; const [qx, qy] = clampFree(nx, ny, PS);
      if (qx !== nx) vx = 0; if (qy !== ny) vy = 0;
      put(qx, qy, PS);
      if (Math.hypot(vx, vy) > .03 && coasting) raf = requestAnimationFrame(step); else { coasting = false; cam.classList.remove('dragging'); setTimeout(() => (dragMoved = false), 80); settle(); }
    };
    raf = requestAnimationFrame(step);
  });
})();
document.querySelectorAll('.hot').forEach(h => h.addEventListener('click', () => { if (dragMoved) return; closeDir(); open(h.dataset.zone); }));

/* ===== Ernest: peeks over his card from the bottom-right aisle, points at Personnel, never covers it ===== */
function ernestSay() {
  const t = $('#esay');
  if (state.hired) t.textContent = state.open ? 'Well seated. Carry on.' : 'Your first monkey is seated. Carry on.';
  else if (state.open) t.textContent = state.open === 'personnel' ? 'Press Hire monkey.' : 'Back to Personnel to hire.';
  else t.textContent = 'Tap Personnel, the desk with the sign, to seat a monkey.';
  efig.style.setProperty('--aim', '-18deg');
}
function showErnest() {
  state.ernest = true;
  setDock(!!state.open); ewrap.classList.add('in');
  ernestSay();
  if (state.open) frameZone(state.open);
}
$('#ernest-ok').addEventListener('click', () => {
  state.ernest = false; ewrap.classList.remove('in');
  if (state.open) frameZone(state.open);
  say('Orientation card dismissed.');
});
if (!/noernest/.test(location.search)) setTimeout(showErnest, reduce.matches ? 500 : 3000);

window.__beh = Array.from({ length: 8 }, (_, i) => CAST[i].beh);
window.__cam = { put, open, close, showErnest, hire, panTo, homeCam, nearest, settle, placeSigns, get: () => [cx, cy, cs], state };
paintReadout();
requestAnimationFrame(() => { measureAreas(); cull(); placeSigns(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const id in SP) SP[id].w = 0; placeSigns(); });
})();
</script>
</body>
