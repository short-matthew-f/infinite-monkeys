<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Departments split: A tabs vs B cabinets</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Courier+Prime&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
/* Tokens copied from game/style.css; derived ones from game/ui/forms.css (.sheet-pane) and game/world/bureau.css. */
:root {
  --paper: #f2e8d5; --paper-shade: #e4d6bc; --ink: #2b2622; --ink-muted: #5e554c;
  --walnut: #6b4423; --concrete: #8a8780; --mustard: #c9a227; --tangerine: #d9732b;
  --olive: #6e7046; --alert: #b23a2e; --phosphor-amber: #b87400; --phosphor-green: #3f7d4e;
  --glow: #ffe9b0; --screen: #14110d; --screen-ink: #ffb000; --screen-muted: #a89c8a;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --font-type: 'Courier Prime', 'Courier New', monospace;
  --edge: #fffaf0; --on-walnut: #f2e8d5;
  --table: color-mix(in srgb, var(--walnut) 72%, var(--screen));
  --floor: color-mix(in srgb, var(--paper-shade) 60%, var(--walnut));
  --pad: color-mix(in srgb, var(--paper) 88%, var(--glow));
  --sheet: var(--paper); --head: var(--walnut); --focus: var(--ink);
  --ctl: var(--walnut); --btn: var(--paper); --on-ctl: var(--paper);
  --rule: color-mix(in srgb, var(--walnut) 55%, var(--paper));
  --lift-sh: color-mix(in srgb, var(--ink) 30%, transparent);
  --soft-sh: color-mix(in srgb, var(--ink) 18%, transparent);
  --stamp: color-mix(in srgb, var(--alert) 68%, var(--ink));
  --box: color-mix(in srgb, var(--paper-shade) 38%, var(--sheet));
  /* new in this exploration */
  --on-fill: var(--paper);                                             /* text on a filled (affordable) price button */
  --save-fill: color-mix(in srgb, var(--mustard) 38%, var(--btn));     /* the saving-up fill; ink on it stays >= 4.5:1 */
  --next-bg: color-mix(in srgb, var(--glow) 42%, var(--sheet));
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #1f1b17; --paper-shade: #2a241e; --ink: #ede3cf; --ink-muted: #a89c8a;
    --walnut: #8a5a33; --concrete: #5e5b55; --mustard: #d9b23a; --tangerine: #e8843a;
    --olive: #8c8f5a; --alert: #d2554a; --phosphor-amber: #ffb000; --phosphor-green: #7cd992;
    --glow: #ffd27a; --edge: #d8ccb4; --on-walnut: #f2e8d5; --sheet: #302920; --head: #d9b23a;
    --table: color-mix(in srgb, var(--paper) 70%, var(--screen));
    --floor: color-mix(in srgb, var(--paper) 78%, var(--screen));
    --pad: color-mix(in srgb, var(--paper-shade) 55%, var(--concrete));
    --ctl: color-mix(in srgb, var(--mustard) 80%, var(--paper)); --btn: var(--paper-shade); --on-ctl: var(--ink);
    --rule: color-mix(in srgb, var(--walnut) 55%, var(--paper));
    --lift-sh: color-mix(in srgb, #000 55%, transparent); --soft-sh: color-mix(in srgb, #000 40%, transparent);
    --stamp: color-mix(in srgb, var(--alert) 80%, var(--ink));
    --box: color-mix(in srgb, var(--paper-shade) 38%, var(--sheet));
    --on-fill: var(--screen); --save-fill: color-mix(in srgb, var(--mustard) 34%, var(--btn));
    --next-bg: color-mix(in srgb, var(--mustard) 13%, var(--sheet));
  }
}
:root[data-theme='dark'] {
  --paper: #1f1b17; --paper-shade: #2a241e; --ink: #ede3cf; --ink-muted: #a89c8a;
  --walnut: #8a5a33; --concrete: #5e5b55; --mustard: #d9b23a; --tangerine: #e8843a;
  --olive: #8c8f5a; --alert: #d2554a; --phosphor-amber: #ffb000; --phosphor-green: #7cd992;
  --glow: #ffd27a; --edge: #d8ccb4; --on-walnut: #f2e8d5; --sheet: #302920; --head: #d9b23a;
  --table: color-mix(in srgb, var(--paper) 70%, var(--screen));
  --floor: color-mix(in srgb, var(--paper) 78%, var(--screen));
  --pad: color-mix(in srgb, var(--paper-shade) 55%, var(--concrete));
  --ctl: color-mix(in srgb, var(--mustard) 80%, var(--paper)); --btn: var(--paper-shade); --on-ctl: var(--ink);
  --rule: color-mix(in srgb, var(--walnut) 55%, var(--paper));
  --lift-sh: color-mix(in srgb, #000 55%, transparent); --soft-sh: color-mix(in srgb, #000 40%, transparent);
  --stamp: color-mix(in srgb, var(--alert) 80%, var(--ink));
  --box: color-mix(in srgb, var(--paper-shade) 38%, var(--sheet));
  --on-fill: var(--screen); --save-fill: color-mix(in srgb, var(--mustard) 34%, var(--btn));
  --next-bg: color-mix(in srgb, var(--mustard) 13%, var(--sheet));
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--table); color: var(--ink); font: 16px/1.45 var(--font-body); display: flex; justify-content: center; overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; touch-action: manipulation; }
h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; font-weight: 700; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
svg.bn { width: 18px; height: 14px; flex: none; }

.stage { position: relative; width: min(100vw, 390px); height: min(100dvh, 844px); overflow: hidden; background: var(--floor); isolation: isolate; }

/* ---------- mockup controls (scaffolding, not part of the design) ---------- */
.harness { position: absolute; z-index: 100; left: 0; right: 0; top: 0; height: 72px; padding: 4px 6px; display: grid; gap: 4px; background: var(--screen); color: var(--screen-muted); font: 600 14px/1 var(--font-body); }
.harness .row { display: flex; gap: 4px; align-items: stretch; }
.harness button, .harness select { flex: 1 1 0; min-width: 0; height: 30px; border: 1.5px solid var(--screen-muted); border-radius: 3px; background: transparent; color: var(--screen-muted); font: 600 14px var(--font-body); padding: 0 4px; cursor: pointer; }
.harness button[aria-pressed='true'] { background: var(--mustard); border-color: var(--mustard); color: var(--screen); }
.harness select { background: var(--screen); flex: 1.5 1 0; }
.harness .th { flex: .55 1 0; }

/* ---------- room (above the sheet) ---------- */
.hdr { position: absolute; z-index: 5; top: 72px; left: 0; right: 0; height: 55px; background: var(--walnut); color: var(--on-walnut); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 3px solid var(--mustard); }
.hdr h1 { font-size: 1.45rem; letter-spacing: .06em; line-height: 1; }
.hdr small { display: block; font: 500 .875rem/1 var(--font-display); letter-spacing: .14em; opacity: .9; margin-bottom: 3px; }
.bank { display: flex; align-items: center; gap: 8px; background: var(--screen); border: 1.5px solid var(--edge); padding: 4px 10px; font: 600 1.15rem/1 var(--font-mono); color: var(--screen-ink); height: 36px; }
.bank span { font: 500 .875rem var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--screen-muted); }
.room { position: absolute; z-index: 1; top: 127px; left: 0; width: 390px; height: 380px; }
.room svg { position: absolute; inset: 0; width: 390px; height: 380px; display: block; }
.room .hit { position: absolute; background: transparent; border: 0; border-radius: 6px; padding: 0; cursor: pointer; }
.room .hit[aria-current='true'] { outline: 3px solid var(--mustard); outline-offset: 1px; box-shadow: 0 0 22px 4px color-mix(in srgb, var(--glow) 60%, transparent); }
.reopen { position: absolute; z-index: 15; left: 50%; bottom: 14px; transform: translateX(-50%); min-height: 48px; padding: 0 22px; border: 2px solid var(--ctl); border-radius: 3px 3px 10px 3px; background: var(--btn); box-shadow: 0 3px 0 var(--ctl), 0 5px 8px var(--soft-sh); font: 700 1.05rem var(--font-display); letter-spacing: .08em; text-transform: uppercase; display: none; }
.closed .reopen { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- the pull-up sheet ---------- */
.sheet { position: absolute; z-index: 20; left: 8px; right: 8px; bottom: 0; height: 40%; display: flex; flex-direction: column;
  background: var(--sheet); color: var(--ink); border: 2px solid var(--edge); border-bottom: 0; border-radius: 10px 10px 0 0;
  box-shadow: 0 -2px 0 var(--lift-sh), 0 -12px 26px var(--soft-sh); transition: height 320ms cubic-bezier(.3,.8,.25,1), transform 320ms cubic-bezier(.3,.8,.25,1); }
.sheet[data-detent='full'] { height: 85%; }
.sheet.dragging { transition: none; }
.closed .sheet { transform: translateY(105%); }
.sheet::before { content: ''; position: absolute; left: 16px; right: 16px; top: -9px; height: 9px; background: var(--paper-shade); border: 2px solid var(--edge); border-bottom: 0; border-radius: 6px 6px 0 0; z-index: -1; }
.sheet::after { content: ''; position: absolute; inset: 5px 5px 0; border: 1px solid var(--rule); border-bottom: 0; border-radius: 6px 6px 0 0; pointer-events: none; }
.grab { flex: none; position: relative; height: 18px; width: 100%; border: 0; background: transparent; padding: 0; cursor: grab; touch-action: none; }
.grab::before { content: ''; position: absolute; left: 50%; top: 6px; width: 56px; height: 7px; transform: translateX(-50%); border-radius: 4px; background: var(--ink-muted); }  /* >= 3:1 against the sheet */
.grab::after { content: ''; position: absolute; left: 50%; top: 9px; width: 30px; height: 1.5px; transform: translateX(-50%); background: var(--sheet); }
.grab i { position: absolute; left: 50%; top: -11px; width: 140px; height: 44px; transform: translateX(-50%); }   /* 44 px hit area */
.shead { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px 4px; border-bottom: 3px double var(--rule); margin: 0 4px; padding-left: 10px; padding-right: 10px; position: relative; z-index: 1; }
.shead .ttl { flex: 1 1 auto; min-width: 0; }
.shead h2 { font-size: 1.55rem; line-height: 1; color: var(--head); }
.code { font: 400 .76rem/1.3 var(--font-type); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); margin-top: 3px; white-space: nowrap; }
.shead .bank { height: 32px; font-size: 1rem; padding: 3px 8px; gap: 6px; background: var(--screen); }
.ibtn { flex: none; width: 44px; height: 44px; min-width: 44px; padding: 0; display: grid; place-items: center; border: 2px solid var(--ctl); border-radius: 3px 3px 10px 3px; background: var(--btn); box-shadow: 0 3px 0 var(--ctl); margin-bottom: 3px; cursor: pointer; }
.ibtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ctl); }
.ibtn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.sbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 14px calc(14px + env(safe-area-inset-bottom)); position: relative; z-index: 1; }
.sheet[data-detent='peek'] .sbody { padding-bottom: 6px; }

/* ---------- Next step card ---------- */
.next { position: relative; margin: 19px 0 8px; padding: 18px 10px 8px; background: var(--next-bg); border: 2px solid var(--ctl); border-radius: 3px 3px 8px 3px; box-shadow: 0 3px 0 var(--ctl); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.tabw { position: absolute; z-index: 2; left: 10px; top: -17px; filter: drop-shadow(0 -1px 0 var(--lift-sh)); pointer-events: none; }
.fold-tab { position: relative; height: 28px; padding: 0 16px 0 12px; display: flex; align-items: center; gap: 7px; white-space: nowrap; background: var(--edge); color: var(--screen);
  clip-path: polygon(0 100%, 0 30%, 10px 0, calc(100% - 10px) 0, 100% 30%, 100% 100%); font: 700 .95rem var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
.fold-tab::before { content: ''; position: absolute; inset: 2.5px 2.5px 0; background: var(--mustard); clip-path: polygon(0 100%, 0 30%, 8px 0, calc(100% - 8px) 0, 100% 30%, 100% 100%); z-index: 0; }
.fold-tab > * { position: relative; z-index: 1; }
.disc { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--screen); color: var(--mustard); font: 700 .7rem/1 var(--font-body); }
.next h3 { font: 700 1.2rem/1.15 var(--font-display); letter-spacing: .03em; text-transform: none; }
.next .why { font: 400 .875rem/1.35 var(--font-body); color: var(--ink); margin-top: 2px; }
.next .ba { font: 600 .875rem/1.35 var(--font-body); font-variant-numeric: tabular-nums; margin-top: 3px; }
.next .ba em { font-style: normal; color: var(--ink); font-weight: 400; }
.ba .arr, .po .arr { color: var(--ink); }

/* ---------- buttons ---------- */
.btn { min-height: 52px; min-width: 104px; padding: 4px 12px; background: var(--btn); color: var(--ink); border: 2px solid var(--ctl); border-radius: 3px 3px 10px 3px; box-shadow: 0 3px 0 var(--ctl), 0 5px 6px var(--soft-sh); margin-bottom: 3px;
  font: 700 1rem/1.1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform 70ms, box-shadow 70ms; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ctl); }
.btn.strong { background: var(--ctl); color: var(--on-fill); }
.btn.quiet { background: transparent; box-shadow: none; border-color: var(--rule); margin-bottom: 0; min-height: 44px; font-size: .95rem; flex-direction: row; gap: 6px; }
.btn.wide { width: 100%; }
/* fill-as-you-save price button: the fill is how close the bank is to the price */
.price { position: relative; overflow: hidden; z-index: 0; }
.price::before { content: ''; position: absolute; z-index: -1; inset: 0 auto 0 0; width: var(--fill, 0%); background: repeating-linear-gradient(135deg, var(--save-fill) 0 6px, color-mix(in srgb, var(--save-fill) 70%, var(--btn)) 6px 9px); }
.price.save::before { border-right: 3px solid var(--mustard); }
.price.can { background: var(--ctl); color: var(--on-fill); }
.price.can::before { display: none; }
.price.save { border-style: dashed; border-color: var(--ink-muted); box-shadow: none; margin-bottom: 3px; }
.price .cost { display: inline-flex; align-items: center; gap: 5px; font: 600 .95rem var(--font-mono); letter-spacing: 0; text-transform: none; }
.price.save:active { transform: none; }

/* ---------- panels, rows ---------- */
.panel { border: 1.5px solid var(--rule); background: var(--box); padding: 10px; display: grid; gap: 12px; min-width: 0; }
.plain { display: grid; gap: 12px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; }
.pn { font: 700 1rem/1.25 var(--font-body); }
.po { font: 400 .875rem/1.35 var(--font-body); font-variant-numeric: tabular-nums; }
.po b { font-weight: 600; }
.pw { font: 700 .875rem/1.3 var(--font-body); color: var(--ink); margin-top: 2px; }
.pw::before { content: '\2022\00a0'; color: var(--tangerine); }
.lock { display: flex; gap: 8px; align-items: center; font: 400 .9375rem/1.35 var(--font-body); }
.lock svg { width: 18px; height: 18px; flex: none; stroke: var(--ink-muted); fill: none; stroke-width: 2; }
.sent { font: 400 .9375rem/1.4 var(--font-body); }
.legend { font: 400 .875rem/1.35 var(--font-body); color: var(--ink-muted); display: flex; gap: 8px; align-items: baseline; border-top: 1.5px dotted var(--concrete); padding-top: 8px; }
.legend b { font: 700 1rem var(--font-mono); color: var(--ink); }
.stamp { display: inline-block; border: 3px double currentColor; color: var(--stamp); font: 700 .95rem/1.2 var(--font-display); letter-spacing: .14em; text-transform: uppercase; padding: 1px 8px; transform: rotate(-3deg); border-radius: 2px; }

/* ---------- A: folder tabs ---------- */
.tabs { position: sticky; top: -4px; z-index: 5; display: flex; gap: 3px; align-items: flex-end; padding: 3px 0 0; margin: 0 -2px; background: var(--sheet); }
.tab { position: relative; flex: 1 1 auto; min-width: 0; height: 44px; padding: 0 5px; border: 0; background: var(--edge); cursor: pointer; margin: 0;
  clip-path: polygon(0 100%, 0 28%, 9px 0, calc(100% - 9px) 0, 100% 28%, 100% 100%); font: 700 .98rem var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
.tab::before { content: ''; position: absolute; inset: 2.5px 2.5px 0; background: var(--paper-shade); clip-path: polygon(0 100%, 0 28%, 7px 0, calc(100% - 7px) 0, 100% 28%, 100% 100%); z-index: 0; }
.tab > * { position: relative; z-index: 1; }
.tab[aria-selected='true'] { height: 48px; color: var(--screen); }
.tab[aria-selected='true']::before { background: var(--mustard); }
.tab:active::before { background: var(--glow); }
.tab .dot { position: absolute; top: 5px; right: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--tangerine); border: 2px solid var(--screen); }
.folder { border: 1.5px solid var(--rule); border-top: 3px solid var(--mustard); background: var(--box); padding: 10px; display: grid; gap: 12px; margin-top: -1px; position: relative; z-index: 1; }

/* ---------- B: summary rows ---------- */
.rows { display: grid; gap: 3px; }
.crow { width: 100%; min-height: 44px; display: grid; grid-template-columns: 28px minmax(0, 1fr) 20px; align-items: center; gap: 10px; text-align: left; padding: 2px 10px; background: var(--btn); border: 2px solid var(--ctl); border-radius: 3px 3px 10px 3px; box-shadow: 0 3px 0 var(--ctl); margin-bottom: 3px; cursor: pointer; }
.crow:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ctl); }
.crow .disc { width: 28px; height: 28px; font-size: .95rem; background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--mustard) 55%, var(--edge)) 0 22%, var(--mustard) 60%); color: var(--screen); border: 1.5px solid var(--screen); }
.crow .nm { font: 700 1.2rem/1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; display: block; }
.crow .sb { font: 400 .875rem/1.25 var(--font-body); color: var(--ink-muted); display: block; font-variant-numeric: tabular-nums; }
.crow svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- funding ---------- */
.presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pre { min-height: 62px; padding: 6px 4px; background: var(--btn); border: 2px solid var(--rule); border-radius: 3px 3px 10px 3px; cursor: pointer; display: grid; align-content: center; gap: 2px; justify-items: center; text-align: center; }
.pre .pnm { font: 600 .9375rem/1.15 var(--font-body); }
.pre .psp { font: 400 .875rem/1.2 var(--font-mono); color: var(--ink); }
.pre[aria-checked='true'] { border-color: var(--ctl); background: var(--next-bg); box-shadow: 0 3px 0 var(--ctl); margin-bottom: -3px; }
.pre[aria-checked='true'] .pnm::before { content: '\2713\00a0'; }
.pre:active { transform: translateY(1px); }
.meters { display: grid; gap: 9px; }
.meter { display: grid; gap: 3px; }
.meter .mh { display: flex; justify-content: space-between; gap: 8px; font: 600 .9375rem/1.2 var(--font-body); font-variant-numeric: tabular-nums; }
.meter .mh span:last-child { font-weight: 400; }
.meter .mh em { font-style: normal; font-weight: 700; }
.ledger { position: relative; height: 16px; padding: 1px; border: 1.5px solid var(--ctl); background: var(--sheet) linear-gradient(90deg, transparent calc(100% - 1.5px), var(--rule) 0) 0 0 / 10% 100%; }
.ledger > i { display: block; height: 100%; width: var(--fill, 0%); background: repeating-linear-gradient(135deg, var(--olive) 0 5px, color-mix(in srgb, var(--olive) 62%, var(--edge)) 5px 8px); border-right: 3px solid var(--mustard); transition: width 300ms; }
.ledger > u { position: absolute; top: -3px; bottom: -3px; left: var(--now, 0%); width: 3px; background: var(--ink); text-decoration: none; }
.mnote { font: 400 .875rem/1.35 var(--font-body); color: var(--ink-muted); }
.fold-sw { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border: 1.5px solid var(--rule); border-radius: 3px; background: transparent; cursor: pointer; font: 600 1rem var(--font-body); text-align: left; }
.fold-sw svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; transition: transform 200ms; }
.fold-sw[aria-expanded='true'] svg { transform: rotate(180deg); }
.fold-sw[aria-expanded='true'] { border-bottom-color: transparent; background: color-mix(in srgb, var(--paper-shade) 60%, var(--sheet)); }
.hand { display: grid; gap: 4px; padding: 6px 12px 10px; border: 1.5px solid var(--rule); border-top: 0; margin-top: -12px; background: color-mix(in srgb, var(--paper-shade) 60%, var(--sheet)); }
.sl { display: grid; grid-template-columns: 6.6rem minmax(0, 1fr) 3rem; align-items: center; gap: 4px 8px; font: 600 .9375rem var(--font-body); }
.sl output { font: 600 .9375rem var(--font-mono); text-align: right; }
input[type='range'] { width: 100%; min-height: 44px; margin: 0; accent-color: var(--tangerine); }
.sflash { position: absolute; z-index: 30; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--screen); color: var(--screen-ink); border: 2px solid var(--edge); padding: 8px 14px; font: 600 .9375rem var(--font-body); border-radius: 3px; opacity: 0; pointer-events: none; transition: opacity 200ms; white-space: nowrap; }
.sflash.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .sheet, .btn, .ledger > i, .fold-sw svg { transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bn" viewBox="0 0 18 14"><path d="M1.2 2.2C0.8 9.5 8 13.4 16.8 8.8C16.9 7.8 16.2 7.5 15.5 7.6C10.5 8.6 6.6 6 5.6 1.2Z" style="fill:var(--mustard);stroke:var(--screen);stroke-width:1" stroke-linejoin="round"/></symbol>
  <symbol id="chev-r" viewBox="0 0 20 20"><path d="M7 3l7 7-7 7"/></symbol>
  <symbol id="chev-l" viewBox="0 0 20 20"><path d="M13 3l-7 7 7 7"/></symbol>
  <symbol id="chev-d" viewBox="0 0 20 20"><path d="M3 7l7 7 7-7"/></symbol>
</svg>

<div class="stage" id="stage">
  <div class="harness" role="group" aria-label="Mockup controls (not part of the design)">
    <div class="row">
      <button data-h="v" data-v="a">A · Folder tabs</button>
      <button data-h="v" data-v="b">B · Per cabinet</button>
      <button class="th" data-h="theme" aria-label="Theme">Auto</button>
    </div>
    <div class="row">
      <button data-h="d" data-v="peek">Peek</button>
      <button data-h="d" data-v="full">Full</button>
      <select id="hs" aria-label="Screen"></select>
      <select id="hb" aria-label="Bananas on hand"><option value="12">🍌 12</option><option value="206" selected>🍌 206</option><option value="18200">🍌 18.2K</option></select>
    </div>
  </div>
  <header class="hdr"><div><small>BUREAU OF INFINITE TYPING</small><h1>First floor</h1></div><div class="bank"><span>Bananas</span><b id="bk">206</b></div></header>
  <div class="room" id="room"></div>
  <button class="reopen" id="reopen"><svg class="bn"><use href="#bn"/></svg> Departments</button>
  <section class="sheet" id="sheet" data-detent="peek" aria-label="Departments"></section>
  <div class="sflash" id="flash" role="status" aria-live="polite"></div>
</div>

<script>
const DEPTS = ['recruiting', 'construction', 'editing'];
const NAME = { recruiting: 'Recruiting', construction: 'Construction', editing: 'Editing', funding: 'Funding' };
const UNIT = { recruiting: 'monkeys/s', construction: 'desks/s', editing: 'review units/s' };
const BASE = { recruiting: 0.6, construction: 0.13, editing: 0.5333 };
const COST0 = { recruiting: [20, 1], construction: [23, 1], editing: [30, 5] };
const STAGE_MUL = { recruiting: 3, construction: 3, editing: 4 };
const STAGE_COST = 20000;
const WHY = { recruiting: 'More Recruiters bring monkeys in faster.', construction: 'More Builders add desks faster.', editing: 'Editing is your bottleneck, so reviews come first.' };
const SENT = { recruiting: 'Hires monkeys for you. Each new monkey needs a desk.', construction: 'Builds desks for the monkeys.', editing: 'Reviews submissions. Without Editors, finds go to waste.' };
const CODE = { recruiting: '5-D/1', construction: '5-D/2', editing: '5-D/3', funding: '5-D', room: '5-D' };
const PRESETS = [
  { id: 'sug', name: 'Suggested', s: { recruiting: 25, construction: 25, editing: 50 } },
  { id: 'gro', name: 'Favour growth', s: { recruiting: 40, construction: 40, editing: 20 } },
  { id: 'edi', name: 'Favour editing', s: { recruiting: 15, construction: 15, editing: 70 } },
];
const K = { recruiting: 0.29, construction: 0.29, editing: 0.30 };

const qs = new URLSearchParams(location.search);
const S = {
  v: qs.get('v') === 'b' ? 'b' : 'a', d: qs.get('d') === 'full' ? 'full' : 'peek',
  screen: qs.get('s') || 'room', tab: 'recruiting', open: qs.get('open') !== '0',
  b: Number(qs.get('b') || 206), theme: qs.get('t') || 'auto',
  lv: { recruiting: 1, construction: 1, editing: 5 }, shares: { recruiting: 45, construction: 45, editing: 10 },
  pick: qs.get('pick') || null, hand: qs.get('hand') === '1',
};
if (S.v === 'a' && DEPTS.concat('funding').includes(S.screen)) S.tab = S.screen;
const $ = (s) => document.querySelector(s);
const meter = (d, sh) => Math.round(sh[d] * K[d]);
const same = (a, b) => DEPTS.every((d) => a[d] === b[d]);
const fmtB = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 1 : 2).replace(/\.?0+$/, '') + 'K' : String(Math.round(n));
const out = (d, L) => BASE[d] * (1 + 0.5 * (L - 1));
const fr = (x) => x >= 1 ? x.toFixed(1) : x.toFixed(2).replace(/0$/, '');
const cost = (d) => COST0[d][0] + (S.lv[d] - COST0[d][1]);
const bn = '<svg class="bn" aria-hidden="true"><use href="#bn"/></svg>';
const chev = (n) => `<svg viewBox="0 0 20 20" aria-hidden="true"><use href="#chev-${n}"/></svg>`;

function price(label, c, act, key, aria) {
  const can = S.b >= c, fill = Math.min(100, (S.b / c) * 100);
  return `<button class="btn price ${can ? 'can' : 'save'}" ${can ? '' : 'aria-disabled="true"'} data-act="${act}" data-k="${key}" style="--fill:${fill.toFixed(1)}%" aria-label="${aria}, ${fmtB(c)} bananas${can ? '' : ', not yet: ' + fmtB(c - S.b) + ' more needed'}"><span>${label}</span><span class="cost">${bn}${fmtB(c)}</span></button>`;
}
const need = (c) => S.b >= c ? '' : `<p class="pw">Need ${fmtB(c - S.b)} more bananas.</p>`;

/* ---------- Next step ---------- */
function nextCard(scope) {
  const tab = '<span class="tabw"><span class="fold-tab"><span class="disc" aria-hidden="true">&#9656;</span><span>Next step</span></span></span>';
  const sug = PRESETS[0].s;
  if (scope === 'any' || scope === 'funding') {
    if (!same(S.shares, sug)) {
      const e0 = meter('editing', S.shares), e1 = meter('editing', sug), r0 = meter('recruiting', S.shares), r1 = meter('recruiting', sug);
      return `<section class="next" aria-label="Next step">${tab}<div><h3>Fund Editing first</h3><p class="why">Editing is the bottleneck. Others ease off.</p><p class="ba">Editing ${e0}% <span class="arr">&rarr;</span> ${e1}%</p></div>
        <button class="btn strong" data-act="applySug" aria-label="Apply suggested funding"><span>Apply</span><span>suggested</span></button></section>`;
    }
  }
  const d = scope && DEPTS.includes(scope) ? scope : 'editing';
  const L = S.lv[d], c = cost(d);
  return `<section class="next" aria-label="Next step">${tab}<div><h3>Level up ${NAME[d]}</h3><p class="why">${WHY[d]}</p>
    <p class="ba">${fr(out(d, L))} <span class="arr">&rarr;</span> ${fr(out(d, L + 1))} <em>${UNIT[d]}</em></p>${S.b >= c ? '' : `<p class="pw">Need ${fmtB(c - S.b)} more bananas.</p>`}</div>
    ${price('Level up', c, 'buy', d, `Level up ${NAME[d]}`)}</section>`;
}

/* ---------- department body ---------- */
function stageBlock(d) {
  const near = S.b >= STAGE_COST * 0.4;
  if (!near) return `<p class="lock"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><span>Stage 1 of 4. Stages unlock at 20K.</span></p>`;
  const o = out(d, S.lv[d]);
  return `<div class="prow"><div><p class="pn">Stage 1 &rarr; 2</p><p class="po"><b>${fr(o)}</b> <span class="arr">&rarr;</span> <b>${fr(o * STAGE_MUL[d])}</b> ${UNIT[d]}</p>${need(STAGE_COST)}</div>${price('Next stage', STAGE_COST, 'stage', d, `Next stage for ${NAME[d]}`)}</div>`;
}
function levelRow(d) {
  const L = S.lv[d], c = cost(d);
  return `<div class="prow"><div><p class="pn">Level ${L} &rarr; ${L + 1}</p><p class="po"><b>${fr(out(d, L))}</b> <span class="arr">&rarr;</span> <b>${fr(out(d, L + 1))}</b> ${UNIT[d]}</p>${need(c)}</div>${price('Level up', c, 'buy', d, `Level up ${NAME[d]}`)}</div>`;
}
function balanced() {
  const c = cost('recruiting') + cost('construction');
  return `<div class="prow"><div><p class="pn">Balanced buy</p><p class="po">+1 Recruiting and +1 Construction level, signed once.</p>${need(c)}</div>${price('Both', c, 'bal', 'bal', 'Balanced buy')}</div>`;
}
const legend = '<p class="legend"><b aria-hidden="true">+</b><span>Levels add a little. Stages multiply.</span></p>';
function nextIsLevel(d) { return same(S.shares, PRESETS[0].s) ? d === 'editing' : false; }
function deptBody(d) {
  return `${S.v === 'a' && nextIsLevel(d) ? '' : levelRow(d)}${stageBlock(d)}${d !== 'editing' ? balanced() : ''}<p class="sent">${SENT[d]}</p>${legend}`;
}
/* B cabinet sheet: the Next card IS the level-up row, so it is not repeated */
function cabBody(d) {
  const r = meter(d, S.shares);
  return `<div class="panel">${stageBlock(d)}${d !== 'editing' ? balanced() : ''}
    <div class="meter"><div class="mh"><span>Readiness</span><span><b>${r}%</b> Low · funded ${S.shares[d]}%</span></div>${ledgerEl(r, null, d)}</div>
    <button class="btn quiet" data-act="go" data-k="funding">Change funding ${chev('r')}</button>
    <p class="sent">${SENT[d]}</p>${legend}</div>`;
}
function ledgerEl(val, now, d) {
  return `<div class="ledger" role="progressbar" aria-label="${NAME[d]} readiness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${val}" aria-valuetext="${val}% Low" style="${now != null ? `--now:${now}%;` : ''}"><i style="--fill:${val}%"></i>${now != null ? '<u></u>' : ''}</div>`;
}

/* ---------- funding body ---------- */
function fundingBody() {
  const cur = S.shares, pick = PRESETS.find((p) => p.id === S.pick);
  const tgt = pick ? pick.s : cur, showCmp = !!pick && !same(pick.s, cur);
  const rows = DEPTS.map((d) => {
    const a = meter(d, cur), b = meter(d, tgt);
    return `<div class="meter"><div class="mh"><span>${NAME[d]}</span><span>${showCmp ? `${a}% <span class="arr">&rarr;</span> <em>${b}%</em>` : `<em>${a}%</em>`} Low</span></div>${ledgerEl(b, showCmp ? a : null, d)}</div>`;
  }).join('');
  const hand = DEPTS.map((d) => `<label class="sl"><span>${NAME[d]}</span><input type="range" min="0" max="100" value="${(S.handv || cur)[d]}" data-sl="${d}" aria-label="${NAME[d]} funding share" /><output>${(S.handv || cur)[d]}%</output></label>`).join('');
  return `<div class="${S.v === 'a' ? 'plain' : 'panel'}">
    <p class="pn" id="plbl">Funding split <span class="po" style="font-weight:400">now ${cur.recruiting} / ${cur.construction} / ${cur.editing}</span></p>
    <div class="presets" role="radiogroup" aria-labelledby="plbl">${PRESETS.map((p) => `<button class="pre" role="radio" aria-checked="${S.pick === p.id}" data-act="pick" data-k="${p.id}"><span class="pnm">${p.name}</span><span class="psp">${p.s.recruiting}·${p.s.construction}·${p.s.editing}</span></button>`).join('')}</div>
    <div class="meters" aria-label="Readiness preview">${rows}</div>
    ${showCmp ? `<button class="btn strong wide" data-act="applyPick">Apply ${pick.name.toLowerCase()}</button>` : `<p class="mnote">${same(cur, PRESETS[0].s) ? 'On the suggested split.' : 'Pick a split to preview the three meters.'}</p>`}
    <button class="fold-sw" data-act="hand" aria-expanded="${S.hand}">Adjust by hand ${chev('d')}</button>
    ${S.hand ? `<div class="hand">${hand}<p class="mnote">Sliders preview only. Apply to commit.</p>${S.handv ? '<button class="btn strong wide" data-act="applyHand">Apply my split</button>' : ''}</div>` : ''}
  </div>${legend}`;
}

/* ---------- sheet shell ---------- */
function summaryRows() {
  const r = DEPTS.map((d, i) => `<button class="crow" data-act="go" data-k="${d}"><span class="disc" aria-hidden="true">${i + 1}</span><span><span class="nm">${NAME[d]}</span><span class="sb">Level ${S.lv[d]} · ${fr(out(d, S.lv[d]))} ${UNIT[d]}</span></span>${chev('r')}</button>`).join('');
  const f = `<button class="crow" data-act="go" data-k="funding"><span class="disc" aria-hidden="true">&#9638;</span><span><span class="nm">Funding</span><span class="sb">${S.shares.recruiting} / ${S.shares.construction} / ${S.shares.editing} · Editing ${meter('editing', S.shares)}%</span></span>${chev('r')}</button>`;
  return `<div class="rows">${r}${f}</div>`;
}
function current() { return S.v === 'a' ? S.tab : S.screen; }
function render() {
  const sheet = $('#sheet'), keep = sheet.querySelector('.sbody')?.scrollTop || 0;
  const cur = current(), isDept = DEPTS.includes(cur);
  sheet.dataset.detent = S.d;
  $('#stage').classList.toggle('closed', !S.open);
  let title, code, back = '', body = '';
  if (S.v === 'a') {
    title = 'Departments'; code = 'Form 5-D';
    const tabs = ['recruiting', 'construction', 'editing', 'funding'].map((t) => {
      const hasNext = t === 'funding' && !same(S.shares, PRESETS[0].s);
      return `<button class="tab" role="tab" aria-selected="${S.tab === t}" data-act="tab" data-k="${t}"><span>${NAME[t]}</span>${hasNext ? '<i class="dot" aria-hidden="true"></i><span class="sr">has the next step</span>' : ''}</button>`;
    }).join('');
    body = `${nextCard('any')}<div class="tabs" role="tablist" aria-label="Department folders">${tabs}</div><div class="folder" role="tabpanel">${cur === 'funding' ? fundingBody() : deptBody(cur)}</div>`;
  } else if (cur === 'room') {
    title = 'Departments'; code = 'Form 5-D · Summary';
    body = `${nextCard('any')}${summaryRows()}`;
  } else {
    title = NAME[cur]; code = `Form ${CODE[cur]}`;
    back = `<button class="ibtn" data-act="go" data-k="room" aria-label="Back to Departments">${chev('l')}</button>`;
    if (isDept) body = `${nextCard(cur)}${cabBody(cur)}`;
    else body = `${nextCard('any')}${fundingBody()}`;
  }
  sheet.innerHTML = `<button class="grab" id="grab" aria-label="Sheet height: ${S.d}. Tap or drag to ${S.d === 'peek' ? 'open fully' : 'shrink'}" aria-expanded="${S.d === 'full'}"><i></i></button>
   <div class="shead">${back}<div class="ttl"><h2>${title}</h2><p class="code">${code}</p></div><div class="bank" aria-label="${S.b} bananas on hand">${bn}<b>${fmtB(S.b)}</b></div><button class="ibtn" data-act="close" aria-label="Fold sheet down">${chev('d')}</button></div>
   <div class="sbody" id="sbody">${body}</div>`;
  sheet.querySelector('.sbody').scrollTop = keep;
  $('#bk').textContent = fmtB(S.b);
  roomRender();
  syncHarness();
}

/* ---------- room art ---------- */
function roomRender() {
  const B = S.v === 'b', cur = current();
  const cab = (x, y, w, h, rows, cols) => {
    let s = `<ellipse cx="${x + w / 2}" cy="${y + h + 2}" rx="${w / 2 + 6}" ry="7" fill="var(--soft-sh)"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--paper)" stroke="var(--edge)" stroke-width="3"/>`;
    const dh = (h - 22) / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const dw = (w - 14) / cols, dx = x + 7 + c * dw, dy = y + 7 + r * dh;
      s += `<rect x="${dx + 1}" y="${dy + 1}" width="${dw - 2}" height="${dh - 3}" rx="2" fill="var(--paper-shade)" stroke="var(--concrete)" stroke-width="1.5"/><rect x="${dx + dw / 2 - 8}" y="${dy + dh / 2 - 3}" width="16" height="5" rx="2" fill="var(--mustard)" stroke="var(--screen)" stroke-width="1"/>`;
    }
    return s;
  };
  const plate = (x, w, label, lv) => `<rect x="${x}" y="338" width="${w}" height="26" rx="2" fill="var(--mustard)" stroke="var(--screen)" stroke-width="1.5"/>${B ? `<text x="${x + w / 2}" y="356" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="14" letter-spacing=".2" fill="var(--screen)">${label}</text>` : `<text x="${x + w / 2}" y="356" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="14" letter-spacing=".8" fill="var(--screen)">STAGE ${lv} OF 4</text>`}`;
  const dots = (x, w, n) => [0, 1, 2, 3].map((i) => `<circle cx="${x + w / 2 - 27 + i * 18}" cy="331" r="4.5" fill="${i < n ? 'var(--tangerine)' : 'var(--paper)'}" stroke="var(--screen)" stroke-width="1.2"/>`).join('');
  const shutter = (x) => `<rect x="${x}" y="26" width="92" height="100" fill="var(--paper)" stroke="var(--edge)" stroke-width="3"/>${[0, 1, 2, 3, 4, 5, 6].map((i) => `<line x1="${x + 6}" x2="${x + 86}" y1="${36 + i * 13}" y2="${36 + i * 13}" stroke="var(--concrete)" stroke-width="1.5"/>`).join('')}<rect x="${x - 4}" y="126" width="100" height="8" fill="var(--edge)"/>`;
  const glowAt = !same(S.shares, PRESETS[0].s) ? 'f' : 'e';
  const ledger = `<g><rect x="16" y="22" width="104" height="104" rx="4" fill="var(--walnut)" stroke="var(--edge)" stroke-width="3"/><rect x="24" y="30" width="88" height="72" fill="var(--paper)"/>${[13, 13, 3].map((v, i) => `<rect x="31" y="${40 + i * 20}" width="74" height="11" fill="none" stroke="var(--walnut)" stroke-width="1.5"/><rect x="32.5" y="${41.5 + i * 20}" width="${Math.max(3, v * 3.2)}" height="8" fill="var(--olive)"/>`).join('')}<rect x="30" y="106" width="76" height="17" fill="var(--mustard)" stroke="var(--screen)" stroke-width="1.2"/><text x="68" y="119.5" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="14" letter-spacing=".8" fill="var(--screen)">FUNDING</text></g>`;
  const svg = `<svg viewBox="0 0 390 380" aria-hidden="true">
   <rect width="390" height="150" fill="var(--paper-shade)"/><rect y="146" width="390" height="6" fill="var(--edge)"/>
   ${B ? ledger : shutter(18)}${shutter(150)}${shutter(272)}
   <rect x="22" y="168" width="346" height="196" rx="8" fill="var(--pad)" stroke="var(--ink)" stroke-opacity=".5" stroke-width="2" stroke-dasharray="7 6"/>
   <line x1="64" x2="326" y1="160" y2="160" stroke="var(--mustard)" stroke-width="5" stroke-linecap="round"/><circle cx="64" cy="160" r="6" fill="var(--mustard)" stroke="var(--screen)" stroke-width="1.5"/><circle cx="326" cy="160" r="6" fill="var(--mustard)" stroke="var(--screen)" stroke-width="1.5"/>
   <line x1="152" x2="152" y1="160" y2="176" stroke="var(--screen)" stroke-width="1.5"/><line x1="238" x2="238" y1="160" y2="176" stroke="var(--screen)" stroke-width="1.5"/>
   <rect x="120" y="174" width="150" height="34" rx="2" fill="var(--mustard)" stroke="var(--screen)" stroke-width="2"/><text x="195" y="198" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="20" letter-spacing="2" fill="var(--screen)">DEPARTMENTS</text>
   <g>${cab(38, 214, 88, 118, 4, 1)}${dots(38, 88, 1)}${plate(38, 88, 'RECRUITING', 1)}<rect x="48" y="198" width="30" height="5" fill="var(--edge)" stroke="var(--concrete)"/><rect x="50" y="205" width="30" height="5" fill="var(--edge)" stroke="var(--concrete)"/><line x1="104" x2="104" y1="214" y2="190" stroke="var(--screen)" stroke-width="2"/><path d="M104 190l16 5-16 5z" fill="var(--tangerine)" stroke="var(--screen)" stroke-width="1.2"/></g>
   <g>${cab(152, 252, 86, 80, 2, 2)}${dots(152, 86, 1)}${plate(152, 86, 'CONSTRUCTION', 1)}<path d="M170 252a25 21 0 0150 0z" fill="var(--mustard)" stroke="var(--screen)" stroke-width="1.5"/><rect x="164" y="248" width="62" height="6" rx="3" fill="var(--mustard)" stroke="var(--screen)" stroke-width="1.5"/></g>
   <g>${cab(264, 214, 88, 118, 4, 1)}${dots(264, 88, 1)}${plate(264, 88, 'EDITING', 1)}<rect x="296" y="192" width="24" height="22" rx="2" fill="var(--paper)" stroke="var(--screen)" stroke-width="1.5"/>${[0, 1, 2].map((i) => `<line x1="${302 + i * 6}" x2="${298 + i * 9}" y1="192" y2="${176 - i * 2}" stroke="var(--alert)" stroke-width="2.4"/>`).join('')}</g>
   ${B && glowAt === 'f' ? '<circle cx="68" cy="75" r="62" fill="var(--glow)" opacity=".28"/>' : ''}
   <g><ellipse cx="26" cy="338" rx="12" ry="5" fill="var(--soft-sh)"/><line x1="26" x2="26" y1="338" y2="262" stroke="var(--screen)" stroke-width="3"/><path d="M12 262l8-26h12l8 26z" fill="var(--tangerine)" stroke="var(--screen)" stroke-width="1.5"/><ellipse cx="26" cy="262" rx="14" ry="4" fill="var(--glow)" opacity=".7"/></g>
   <g><ellipse cx="364" cy="338" rx="12" ry="5" fill="var(--soft-sh)"/><line x1="364" x2="364" y1="338" y2="262" stroke="var(--screen)" stroke-width="3"/><path d="M350 262l8-26h12l8 26z" fill="var(--tangerine)" stroke="var(--screen)" stroke-width="1.5"/><ellipse cx="364" cy="262" rx="14" ry="4" fill="var(--glow)" opacity=".7"/></g>
  </svg>`;
  const hit = (act, k, x, y, w, h, label) => `<button class="hit" data-act="${act}" data-k="${k}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px" aria-label="${label}" ${B && cur === k ? 'aria-current="true"' : ''}></button>`;
  let hits = '';
  if (B) hits = hit('go', 'room', 110, 168, 170, 46, 'Departments sign: floor summary') + hit('go', 'funding', 16, 22, 104, 106, 'Funding ledger on the wall') + hit('go', 'recruiting', 34, 190, 96, 176, 'Recruiting cabinet') + hit('go', 'construction', 148, 232, 94, 134, 'Construction cabinet') + hit('go', 'editing', 260, 170, 96, 196, 'Editing cabinet');
  else hits = hit('openA', 'x', 0, 0, 390, 380, 'Open Departments');
  $('#room').innerHTML = svg + hits;
}

/* ---------- actions ---------- */
let flashT;
function flash(t) { const f = $('#flash'); f.textContent = t; f.classList.add('on'); clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('on'), 1800); }
function act(a, k) {
  switch (a) {
    case 'tab': S.tab = k; break;
    case 'go': S.screen = k; if (S.d !== 'full') S.d = 'peek'; S.open = true; if (k === 'funding') S.pick = S.pick; break;
    case 'openA': S.open = true; break;
    case 'close': S.open = false; break;
    case 'pick': S.pick = S.pick === k ? null : k; S.handv = null; break;
    case 'hand': S.hand = !S.hand; break;
    case 'applySug': S.shares = { ...PRESETS[0].s }; S.pick = null; flash('Funding applied: 25 / 25 / 50'); break;
    case 'applyPick': { const p = PRESETS.find((x) => x.id === S.pick); S.shares = { ...p.s }; S.pick = null; flash(`Funding applied: ${p.name}`); break; }
    case 'applyHand': S.shares = { ...S.handv }; S.handv = null; S.hand = false; flash('Funding applied'); break;
    case 'buy': { const c = cost(k); if (S.b < c) { flash(`Need ${fmtB(c - S.b)} more bananas`); return; } S.b -= c; S.lv[k]++; flash(`${NAME[k]} is now level ${S.lv[k]}`); break; }
    case 'bal': { const c = cost('recruiting') + cost('construction'); if (S.b < c) { flash(`Need ${fmtB(c - S.b)} more bananas`); return; } S.b -= c; S.lv.recruiting++; S.lv.construction++; flash('Recruiting and Construction +1'); break; }
    case 'stage': flash(S.b < STAGE_COST ? `Need ${fmtB(STAGE_COST - S.b)} more bananas` : 'Stage purchased'); return;
  }
  render();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.getAttribute('aria-disabled') === 'true' && t.dataset.act !== 'buy' && t.dataset.act !== 'bal' && t.dataset.act !== 'stage') return;
  act(t.dataset.act, t.dataset.k);
});
document.addEventListener('input', (e) => {
  const d = e.target.dataset.sl; if (!d) return;
  const base = S.handv || { ...S.shares }, v = Number(e.target.value), rest = 100 - v, others = DEPTS.filter((x) => x !== d), sum = others.reduce((a, x) => a + base[x], 0) || 1;
  const next = { [d]: v }; let acc = 0;
  others.forEach((x, i) => { next[x] = i === others.length - 1 ? rest - acc : Math.round(base[x] / sum * rest); acc += next[x]; });
  S.handv = next; S.pick = null;
  document.querySelectorAll('[data-sl]').forEach((el) => { el.value = next[el.dataset.sl]; el.nextElementSibling.textContent = next[el.dataset.sl] + '%'; });
  if (!document.querySelector('[data-act=applyHand]')) render(); const f = document.querySelector('[data-sl="' + d + '"]'); f && f.focus();
});

/* drag the handle between detents (tap toggles) */
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const g = e.target.closest('#grab'); if (!g) return;
  const sh = $('#sheet'); drag = { y: e.clientY, h: sh.offsetHeight, moved: false }; g.setPointerCapture(e.pointerId); sh.classList.add('dragging');
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return; const dy = drag.y - e.clientY; if (Math.abs(dy) > 5) drag.moved = true;
  if (drag.moved) $('#sheet').style.height = Math.max(90, Math.min($('#stage').offsetHeight * 0.9, drag.h + dy)) + 'px';
});
document.addEventListener('pointerup', () => {
  if (!drag) return; const sh = $('#sheet'), H = $('#stage').offsetHeight, r = sh.offsetHeight / H;
  sh.classList.remove('dragging'); sh.style.height = '';
  if (!drag.moved) S.d = S.d === 'peek' ? 'full' : 'peek';
  else if (r < 0.2) S.open = false; else S.d = r > 0.62 ? 'full' : 'peek';
  drag = null; render();
});
document.addEventListener('scroll', (e) => { if (e.target.id === 'sbody' && S.d === 'peek' && e.target.scrollTop > 8) { S.d = 'full'; render(); } }, true);

/* ---------- mockup harness ---------- */
function syncHarness() {
  document.querySelectorAll('[data-h=v]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.v));
  document.querySelectorAll('[data-h=d]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.d));
  const hs = $('#hs'), opts = S.v === 'a' ? ['recruiting', 'construction', 'editing', 'funding'] : ['room', 'recruiting', 'construction', 'editing', 'funding'];
  hs.innerHTML = opts.map((o) => `<option value="${o}">${NAME[o] || 'Room sign'}</option>`).join('');
  hs.value = current();
  $('#hb').value = ['12', '206', '18200'].includes(String(S.b)) ? String(S.b) : '206';
  document.documentElement.dataset.theme = S.theme === 'auto' ? '' : S.theme;
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  document.querySelector('.th').textContent = S.theme === 'auto' ? 'Auto' : S.theme[0].toUpperCase() + S.theme.slice(1);
}
document.querySelectorAll('[data-h]').forEach((b) => b.addEventListener('click', () => {
  const h = b.dataset.h;
  if (h === 'v') { S.v = b.dataset.v; if (S.v === 'b' && !['room', ...DEPTS, 'funding'].includes(S.screen)) S.screen = 'room'; }
  if (h === 'd') S.d = b.dataset.v;
  if (h === 'theme') S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme];
  S.open = true; render();
}));
$('#hs').addEventListener('change', (e) => { if (S.v === 'a') S.tab = e.target.value; else S.screen = e.target.value; S.open = true; render(); });
$('#hb').addEventListener('change', (e) => { S.b = Number(e.target.value); render(); });
$('#reopen').addEventListener('click', () => { S.open = true; render(); });
render();
</script>
</body>
</html>
