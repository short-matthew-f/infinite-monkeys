<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bureau of Infinite Typing - Cutaway Dollhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Courier+Prime&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* ---------- tokens (copied from game/style.css, plus scene helpers) ---------- */
:root {
  --paper: #f2e8d5; --paper-shade: #e4d6bc; --ink: #2b2622; --ink-muted: #6b6157;
  --walnut: #6b4423; --concrete: #8a8780; --mustard: #c9a227; --tangerine: #d9732b;
  --olive: #6e7046; --alert: #b23a2e; --phosphor-amber: #b87400; --phosphor-green: #3f7d4e;
  --glow: #ffe9b0;
  --screen: #14110d; --screen-ink: #ffb000; --screen-muted: #a89c8a;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --font-type: 'Courier Prime', 'Courier New', monospace;
  /* scene helpers (still tokens: every colour lives in this block) */
  --shadow: rgb(43 38 34 / .30);
  --grain-op: .34; --grain-blend: multiply;
  --cone-op: .20;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1f1b17; --paper-shade: #2a241e; --ink: #ede3cf; --ink-muted: #a89c8a;
    --walnut: #8a5a33; --concrete: #5e5b55; --mustard: #d9b23a; --tangerine: #e8843a;
    --olive: #8c8f5a; --alert: #d2554a; --phosphor-amber: #ffb000; --phosphor-green: #7cd992;
    --glow: #ffd27a;
    --shadow: rgb(0 0 0 / .55); --grain-op: .16; --grain-blend: screen; --cone-op: .26;
  }
}
:root[data-theme="dark"] {
  --paper: #1f1b17; --paper-shade: #2a241e; --ink: #ede3cf; --ink-muted: #a89c8a;
  --walnut: #8a5a33; --concrete: #5e5b55; --mustard: #d9b23a; --tangerine: #e8843a;
  --olive: #8c8f5a; --alert: #d2554a; --phosphor-amber: #ffb000; --phosphor-green: #7cd992;
  --glow: #ffd27a;
  --shadow: rgb(0 0 0 / .55); --grain-op: .16; --grain-blend: screen; --cone-op: .26;
}
:root {
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.1 -.35'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  --hh: 60px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font-body); }
button { font: inherit; color: inherit; cursor: pointer; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* utility fills (so SVG art uses tokens only) */
.f-paper{fill:var(--glow)} .f-shade{fill:var(--paper-shade)} .f-ink{fill:var(--ink)} .f-muted{fill:var(--ink-muted)}
.f-walnut{fill:var(--walnut)} .f-conc{fill:var(--concrete)} .f-must{fill:var(--mustard)} .f-tang{fill:var(--tangerine)}
.f-olive{fill:var(--olive)} .f-alert{fill:var(--alert)} .f-glow{fill:var(--glow)} .f-screen{fill:var(--screen)} .f-amber{fill:var(--screen-ink)}
.s-paper{stroke:var(--paper)} .s-shade{stroke:var(--paper-shade)} .s-ink{stroke:var(--ink)} .s-walnut{stroke:var(--walnut)} .s-conc{stroke:var(--concrete)}
.s-must{stroke:var(--mustard)} .s-tang{stroke:var(--tangerine)} .s-olive{stroke:var(--olive)} .s-alert{stroke:var(--alert)} .s-screen{stroke:var(--screen)} .s-glow{stroke:var(--glow)}
.o { stroke: var(--screen); stroke-opacity: .5; stroke-width: .8; }
.sh { fill: var(--shadow); }
.dim { opacity: .22; } .dim2 { opacity: .35; }

/* ---------- header ---------- */
#top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; filter: drop-shadow(0 3px 3px var(--shadow)); }
#top .in { background: var(--paper); padding: max(8px, env(safe-area-inset-top)) 14px 11px; display: flex; align-items: center; gap: 10px; position: relative; }
#top .in::after, .cpi::after, #sheet .sheet-in::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--grain); opacity: var(--grain-op); mix-blend-mode: var(--grain-blend); }
.seal { flex: none; width: 34px; height: 34px; }
.stats { flex: 1; display: grid; grid-template-columns: 1.25fr 1fr .9fr; gap: 6px; }
.stat { display: flex; flex-direction: column; min-width: 0; border-left: 2px dashed var(--concrete); padding-left: 8px; }
.lab { font: 500 12px/1.1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); }
.num { font: 600 16px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.num small { font: 400 12px var(--font-mono); color: var(--ink-muted); }

/* ---------- world / building ---------- */
#world { position: fixed; left: 0; right: 0; bottom: 0; top: var(--hh); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
#world::-webkit-scrollbar { display: none; }
#stage { position: relative; width: 100%; height: 920px; overflow: hidden; --py: 0; }
#stage::before { content: ""; position: absolute; inset: 0; background: var(--grain); opacity: calc(var(--grain-op) * .6); mix-blend-mode: var(--grain-blend); pointer-events: none; }
#sky { position: absolute; inset: 0; transform: translateY(calc(var(--py) * .12px)); transition: opacity .5s; pointer-events: none; }
.cloud { position: absolute; filter: drop-shadow(3px 5px 0 var(--shadow)); }
.cloud svg { display: block; }
#building { position: absolute; top: 56px; left: 50%; margin-left: -175px; width: 350px; height: 760px; transform-origin: 0 0; transform: translate(10.5px, 0) scale(.94); transition: transform .75s cubic-bezier(.62,0,.22,1); }
.layer { position: absolute; inset: 0; pointer-events: none; }
.layer > * { position: absolute; }
#fore { transform: translateY(calc(var(--py) * -.06px)); transition: opacity .45s; }
.zoomed #fore, .zoomed #sky { opacity: 0; }
.wall { position: absolute; left: 0; right: 0; top: -12px; transform: translateY(calc(var(--py) * .07px)); }
.wall svg { display: block; }

/* paper pieces: outer = cast shadow, inner = jittered cut + grain */
.cp { filter: drop-shadow(2px 4px 2.5px var(--shadow)); }
.cpi { position: absolute; inset: 0; overflow: hidden; }
.cpi::after { z-index: 3; }
.cp.slab { filter: drop-shadow(0 6px 5px var(--shadow)); }
.cp.thin { filter: drop-shadow(1px 2px 1.5px var(--shadow)); }
.win .cpi::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 30px; z-index: 2; background: linear-gradient(var(--shadow), transparent); opacity: .8; }

.room { transition: transform .18s ease-out, opacity .45s; }
.room.lit { transform: translateY(-2px); }
.room.press { transform: translateY(1px); transition-duration: .05s; }
.cp.win { transition: opacity .45s; }
[data-active] .cp.win:not(.on), [data-active] .room:not(.on), [data-active] .plq:not(.on) { opacity: .3; }
.room.on .plaque { transform: translateY(-3px); }
.room svg { position: absolute; left: 0; top: 0; overflow: visible; }

/* plaques: hanging signs with a glowing lamp, the "tap me" cue without a button */
.plaque { position: absolute; display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; background: var(--paper); color: var(--ink); border: 2px solid var(--walnut); border-radius: 3px; font: 700 14px/1.2 var(--font-display); letter-spacing: .06em; white-space: nowrap; filter: drop-shadow(2px 3px 1.5px var(--shadow)); transform-origin: 50% -8px; transition: transform .18s ease-out; }
.plaque::before, .plaque::after { content: ""; position: absolute; top: -9px; width: 2px; height: 9px; background: var(--walnut); }
.plaque::before { left: 12%; } .plaque::after { right: 12%; }
.plaque i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 0 2px var(--mustard), 0 0 9px 3px var(--glow); }
.plaque.off { border-color: var(--concrete); }
.plaque.off i { background: var(--concrete); box-shadow: none; }
.sign12 { font-size: 12px; letter-spacing: .08em; }
.lit .plaque { transform: translateY(-2px); }
.lit .plaque i, .press .plaque i { box-shadow: 0 0 0 2px var(--mustard), 0 0 14px 6px var(--glow); }

/* light bowls: the guide's section anchors */
.bowl { width: 30px; height: 16px; }
.bowl .stem { position: absolute; left: 13px; top: -9px; width: 4px; height: 10px; background: var(--concrete); }
.bowl .shade { position: absolute; left: 0; top: 0; width: 30px; height: 15px; border-radius: 0 0 30px 30px; background: var(--glow); box-shadow: 0 2px 8px 2px var(--glow); }
.bowl .cone { position: absolute; left: -45px; top: 12px; width: 120px; background: linear-gradient(transparent, var(--glow) 38%, transparent); opacity: var(--cone-op); }

/* ---------- monkeys & desks ---------- */
.desk { position: absolute; overflow: visible; }
.desk * { transform-box: view-box; }
.vacant .mk { display: none; }
.arrive .mk { animation: arrive .9s cubic-bezier(.3,0,.2,1) both; }
@keyframes arrive { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
.lid { opacity: 0; } .zz { opacity: 0; }
/* static poses = reduced-motion meaning: who is doing what */
.b-peck .ar { transform: rotate(-24deg); }
.b-slam .ar { transform: rotate(-38deg); }
.b-sip .ar { transform: rotate(-110deg); }
.b-read .page { transform: translateY(-18px); } .b-read .al { transform: rotate(-70deg); } .b-read .ar { transform: rotate(70deg); }
.b-doze .head { transform: rotate(14deg); } .b-doze .lid { opacity: 1; } .b-doze .zz { opacity: 1; }
.b-stretch .al { transform: rotate(170deg); } .b-stretch .ar { transform: rotate(-170deg); }
.b-stamp .stampmark { opacity: 1; }
.stampmark { opacity: 0; }
.capsule { opacity: 0; }

@media (prefers-reduced-motion: no-preference) {
  .b-peck .ar, .b-slam .ar, .b-sip .ar, .b-read .page, .b-read .al, .b-read .ar, .b-doze .head, .b-stretch .al, .b-stretch .ar { transform: none; }
  .b-doze .lid, .b-doze .zz, .b-stamp .stampmark { opacity: 0; }
  .b-fast .al { animation: tap calc(.30s * var(--k)) steps(2, jump-none) var(--d) infinite; }
  .b-fast .ar { animation: tap calc(.30s * var(--k)) steps(2, jump-none) var(--d) infinite reverse; }
  .b-fast .head { animation: jit calc(.9s * var(--k)) steps(2, jump-none) var(--d) infinite; }
  .b-peck .ar { animation: peck calc(3.4s * var(--k)) steps(1, end) var(--d) infinite; }
  .b-peck .head { animation: nod calc(3.4s * var(--k)) ease-in-out var(--d) infinite; }
  .b-slam .al { animation: tap calc(.34s * var(--k)) steps(2, jump-none) var(--d) infinite; }
  .b-slam .ar { animation: slam calc(4.6s * var(--k)) ease-in-out var(--d) infinite; }
  .b-slam .cart { animation: cart calc(4.6s * var(--k)) ease-in-out var(--d) infinite; }
  .b-sip .ar { animation: sip calc(6s * var(--k)) ease-in-out var(--d) infinite; }
  .b-sip .al { animation: tap calc(.5s * var(--k)) steps(2, jump-none) var(--d) infinite; }
  .b-read .page { animation: read calc(8s * var(--k)) ease-in-out var(--d) infinite; }
  .b-read .al { animation: readL calc(8s * var(--k)) ease-in-out var(--d) infinite; }
  .b-read .ar { animation: readR calc(8s * var(--k)) ease-in-out var(--d) infinite; }
  .b-doze .head { animation: doze calc(9s * var(--k)) ease-in-out var(--d) infinite; }
  .b-doze .lid { animation: lids calc(9s * var(--k)) steps(1, end) var(--d) infinite; }
  .b-doze .zz { animation: zz calc(9s * var(--k)) ease-in-out var(--d) infinite; }
  .b-stretch .al { animation: stretchL calc(7s * var(--k)) ease-in-out var(--d) infinite; }
  .b-stretch .ar { animation: stretchR calc(7s * var(--k)) ease-in-out var(--d) infinite; }
  .b-stamp .ar { animation: stampA 9s ease-in-out infinite; }
  .b-stamp .stampmark { animation: mark 9s steps(1, end) infinite; }
  .b-stamp .head { animation: stampHead 9s ease-in-out infinite; }
  .capsule { animation: cap 9s linear infinite; }
  .plaque { animation: sway 5.5s ease-in-out infinite; }
  .plaque i { animation: lamp 3.2s ease-in-out infinite; }
  .room.lit .plaque { animation-play-state: paused; }
  .waiter { animation: wait 4s ease-in-out infinite; }
  .jib { animation: jib 7s ease-in-out infinite alternate; }
  .cloud { animation: drift 40s ease-in-out infinite alternate; }
  .pip { animation: pip 2.4s steps(1, end) infinite; }
  .steam { animation: steam 3s ease-in-out infinite; }
}
@keyframes tap { from { transform: translateY(0); } to { transform: translateY(1.8px); } }
@keyframes jit { from { transform: translateY(0); } to { transform: translateY(.5px); } }
@keyframes peck { 0%, 30% { transform: rotate(0); } 34% { transform: rotate(-24deg); } 40% { transform: rotate(0); } 62% { transform: rotate(0); } 66% { transform: rotate(-24deg); } 72%, 100% { transform: rotate(0); } }
@keyframes nod { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(5deg) translateY(1px); } }
@keyframes slam { 0%, 74% { transform: rotate(0); } 80% { transform: rotate(-38deg); } 87%, 100% { transform: rotate(0); } }
@keyframes cart { 0% { transform: translateX(0); } 76% { transform: translateX(-5px); } 82%, 100% { transform: translateX(0); } }
@keyframes sip { 0%, 24% { transform: rotate(0); } 40%, 62% { transform: rotate(-110deg); } 78%, 100% { transform: rotate(0); } }
@keyframes read { 0%, 8% { transform: translateY(0); } 20%, 76% { transform: translateY(-18px); } 88%, 100% { transform: translateY(0); } }
@keyframes readL { 0%, 8% { transform: rotate(0); } 20%, 76% { transform: rotate(-70deg); } 88%, 100% { transform: rotate(0); } }
@keyframes readR { 0%, 8% { transform: rotate(0); } 20%, 76% { transform: rotate(70deg); } 88%, 100% { transform: rotate(0); } }
@keyframes doze { 0%, 8% { transform: rotate(0); } 22%, 70% { transform: rotate(14deg) translateY(1px); } 73% { transform: rotate(-5deg); } 80%, 100% { transform: rotate(0); } }
@keyframes lids { 0%, 14% { opacity: 0; } 15%, 71% { opacity: 1; } 72%, 100% { opacity: 0; } }
@keyframes zz { 0%, 20% { opacity: 0; transform: translateY(0); } 36%, 62% { opacity: 1; transform: translateY(-3px); } 70%, 100% { opacity: 0; } }
@keyframes stretchL { 0%, 30% { transform: rotate(0); } 42%, 58% { transform: rotate(170deg); } 72%, 100% { transform: rotate(0); } }
@keyframes stretchR { 0%, 30% { transform: rotate(0); } 42%, 58% { transform: rotate(-170deg); } 72%, 100% { transform: rotate(0); } }
@keyframes stampA { 0%, 3% { transform: rotate(0); } 8%, 9% { transform: rotate(-50deg); } 11% { transform: rotate(3deg); } 15%, 100% { transform: rotate(0); } }
@keyframes stampHead { 0%, 8% { transform: translateY(0); } 11% { transform: translateY(1px); } 15%, 100% { transform: translateY(0); } }
@keyframes mark { 0%, 11% { opacity: 0; } 12%, 40% { opacity: 1; } 41%, 100% { opacity: 0; } }
@keyframes cap { 0%, 15% { transform: translateY(0); opacity: 0; } 16% { opacity: 1; } 36% { transform: translateY(-410px); opacity: 1; } 37%, 100% { transform: translateY(-410px); opacity: 0; } }
@keyframes sway { 0%, 100% { transform: rotate(-.7deg); } 50% { transform: rotate(.7deg); } }
@keyframes lamp { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
@keyframes wait { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-2px); } }
@keyframes jib { from { transform: rotate(-.8deg); } to { transform: rotate(.8deg); } }
@keyframes drift { from { transform: translateX(-8px); } to { transform: translateX(8px); } }
@keyframes pip { 0% { opacity: 1; } 50% { opacity: .55; } }
@keyframes steam { 0%, 100% { opacity: .2; } 50% { opacity: .7; } }

/* hit layer */
#hits { position: absolute; inset: 0; z-index: 5; }
.hit { position: absolute; padding: 0; margin: 0; background: transparent; border: 0; border-radius: 4px; touch-action: manipulation; }
.hit:focus-visible { outline: 3px solid var(--ink); outline-offset: -5px; box-shadow: inset 0 0 0 7px var(--paper); }

/* ---------- elevator directory (the one non-spatial control) ---------- */
#fab[hidden] { display: none; }
#fab { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 41; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--mustard); color: var(--screen); display: grid; place-items: center; box-shadow: 0 0 0 3px var(--walnut), 0 5px 0 3px var(--walnut), 0 8px 8px var(--shadow); transition: transform .08s, box-shadow .08s; }
#fab:active { transform: translateY(4px); box-shadow: 0 0 0 3px var(--walnut), 0 1px 0 3px var(--walnut), 0 3px 4px var(--shadow); }
#fab:focus-visible, .btn:focus-visible, .hire:focus-visible, .ok:focus-visible, .dirbtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#fab svg { width: 26px; height: 26px; }
#fab .fl { position: absolute; top: -8px; left: -8px; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 12px; background: var(--screen); color: var(--screen-ink); font: 600 12px/24px var(--font-mono); text-align: center; }
#dir { position: fixed; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 42; width: 244px; filter: drop-shadow(2px 4px 3px var(--shadow)); transform-origin: 100% 100%; }
#dir[hidden] { display: none; }
#dir .dir-in { background: var(--paper); border: 2px solid var(--walnut); padding: 12px 12px 10px; position: relative; }
#dir h2 { margin: 0 0 8px; font: 700 15px/1.2 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.dirbtn { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; margin: 0 0 6px; padding: 0 10px 0 6px; border: 2px solid var(--ink); border-radius: 26px; background: var(--paper-shade); text-align: left; font: 700 16px var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.dirbtn:active { transform: translateY(2px); }
.dirbtn b { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--mustard); color: var(--screen); font: 600 14px/32px var(--font-mono); text-align: center; box-shadow: inset 0 0 0 2px var(--walnut); }
#scrim { position: fixed; inset: 0; z-index: 35; background: transparent; border: 0; padding: 0; display: none; }
#scrim.on { display: block; }
#dirscrim { position: fixed; inset: 0; z-index: 41; display: none; }
#dirscrim.on { display: block; }

/* ---------- sheet (paper form) ---------- */
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; filter: drop-shadow(0 -5px 6px var(--shadow)); transform: translateY(108%) rotate(-.6deg); visibility: hidden; transition: transform .6s cubic-bezier(.55,0,.2,1), visibility 0s .6s; max-height: 62vh; }
#sheet.open { transform: none; visibility: visible; transition-delay: .18s, 0s; }
#sheet .sheet-in { position: relative; background: var(--paper); padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); overflow: auto; max-height: 62vh; }
.fh { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 2px dashed var(--concrete); }
.fcode { margin: 0; font: 400 12px/1.4 var(--font-type); letter-spacing: .04em; color: var(--ink-muted); text-transform: uppercase; }
#sheet h2 { margin: 0; font: 700 28px/1.05 var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
#sheet h2:focus { outline: none; }
.btn { min-height: 44px; min-width: 44px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 22px; background: var(--paper-shade); color: var(--ink); font: 700 16px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .06s; }
.btn:active { transform: translateY(2px); }
.btn[disabled] { border-style: dashed; cursor: not-allowed; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px dotted var(--concrete); }
.row .k { font: 500 14px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); }
.row .v { font: 600 16px var(--font-mono); font-variant-numeric: tabular-nums; }
.hint { margin: 6px 0 0; font: 14px/1.4 var(--font-body); color: var(--ink-muted); }
.hint b { color: var(--ink); font-weight: 600; }
.pips { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; margin: 8px 0 0; }
.pips i { height: 12px; background: var(--paper-shade); border: 1.5px solid var(--ink); border-radius: 2px; }
.pips i.on { background: var(--mustard); }
.hirewrap { margin: 12px 0 4px; text-align: center; }
.hire { position: relative; display: block; margin: 8px auto 12px; width: min(100%, 270px); min-height: 62px; border: 0; background: var(--tangerine); color: var(--screen); border-radius: 46px 46px 46px 46px / 38px 38px 26px 26px; font: 700 26px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 0 0 4px var(--mustard), 0 9px 0 4px var(--walnut), 0 14px 10px var(--shadow); transition: transform .08s, box-shadow .08s; }
.hire > * { position: relative; }
.hire::before { content: ""; position: absolute; left: 16%; right: 16%; top: 5px; height: 7px; border-radius: 12px; background: var(--glow); opacity: .35; }

    + `<rect x="188" y="108" width="20" height="20" rx="2" class="f-tang o"/><ellipse cx="193" cy="96" rx="3.5" ry="11" class="f-olive" transform="rotate(-20 193 105)"/><ellipse cx="204" cy="96" rx="3.5" ry="11" class="f-olive" transform="rotate(20 204 105)"/><ellipse cx="198" cy="92" rx="3.5" ry="13" class="f-olive"/>`;
  M += roomWrap('director', r, svg(218, 150, art), plaque('DIRECTOR’S OFFICE', 14, 10));
}
// Archive (shuttered, not a tap target)
M += roomWrap('arch', ARCH, svg(126, 150, floorStrip(126, 150, 128) + `<rect x="24" y="52" width="78" height="76" class="f-conc o"/><path d="M24 70 H102 M24 88 H102 M24 106 H102" class="s-screen" stroke-width="1" opacity=".5"/><rect x="58" y="116" width="10" height="12" class="f-must o"/>` + `<rect x="106" y="44" width="20" height="10" class="f-shade o"/>`), plaque('ARCHIVE · CLOSED', 10, 12, true).replace('class="plaque off"', 'class="plaque off sign12"'));

/* ---- fore plane ---- */
F += piece({ x: -14, y: 132, w: 15, h: 592, bg: 'color-mix(in srgb, var(--concrete) 70%, var(--paper-shade))', cls: '', ch: 3, j: 1.4, step: 18, seed: 301 });
F += piece({ x: 349, y: 132, w: 15, h: 592, bg: 'color-mix(in srgb, var(--concrete) 70%, var(--paper-shade))', cls: '', ch: 3, j: 1.4, step: 18, seed: 302 });
// mushroom columns at dividers
F += `<div style="left:150px;top:314px;width:36px;height:150px;filter:drop-shadow(2px 3px 2px var(--shadow))">${svg(36, 150, `<path d="M0 0 H36 Q30 6 24 14 H12 Q6 6 0 0Z M12 12 H24 V150 H12Z" class="f-conc o"/><rect x="12" y="12" width="3" height="138" class="f-paper" opacity=".25"/>`)}</div>`;
F += `<div style="left:206px;top:152px;width:36px;height:150px;filter:drop-shadow(2px 3px 2px var(--shadow))">${svg(36, 150, `<path d="M0 0 H36 Q30 6 24 14 H12 Q6 6 0 0Z M12 12 H24 V150 H12Z" class="f-conc o"/><rect x="12" y="12" width="3" height="138" class="f-paper" opacity=".25"/>`)}</div>`;
// light bowls
const bowl = (x, y, h) => `<div class="bowl" style="left:${x - 15}px;top:${y}px"><i class="stem"></i><i class="shade"></i><i class="cone" style="height:${h}px;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)"></i></div>`;
F += bowl(178, 166, 100) + bowl(142, 328, 100) + bowl(170, 490, 120) + bowl(262, 490, 120);
// pneumatic tube from the Editor's desk to the Archive
F += `<div style="left:334px;top:214px;width:8px;height:424px;border-radius:5px;background:linear-gradient(90deg,var(--paper-shade),var(--glow) 40%,var(--paper-shade));box-shadow:0 0 0 1.5px color-mix(in srgb,var(--screen) 45%,transparent),2px 3px 2px var(--shadow)"></div>`;
F += `<div style="left:327px;top:206px;width:22px;height:9px;border-radius:2px;background:var(--concrete);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--screen) 45%,transparent)"></div>`;
F += `<div style="left:327px;top:636px;width:22px;height:8px;border-radius:2px;background:var(--concrete);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--screen) 45%,transparent)"></div>`;
// foreground fern in the pool
F += `<div style="left:0;top:652px;width:40px;height:66px;filter:drop-shadow(2px 3px 2px var(--shadow))">${svg(40, 66, `<path d="M20 44 C6 40 2 22 4 8 C12 14 18 26 20 44Z M20 44 C34 40 38 22 36 8 C28 14 22 26 20 44Z M20 44 C14 30 14 14 20 2 C26 14 26 30 20 44Z" class="f-olive o"/><path d="M9 46 H31 L28 64 H12Z" class="f-tang o"/><rect x="8" y="44" width="24" height="4" class="f-tang o"/>`)}</div>`;

/* ---- hit targets (>= 44px; labelled; no visible chrome) ---- */
const HL = {
  personnel: 'Personnel: hire monkeys and manage desks. Opens a form.',
  pool: 'Typing Pool: 8 monkeys at work, one Editor. Opens a form.',
  departments: 'Departments: Recruiting, Construction, Editing. Opens a form.',
  director: 'Director’s Office: Readiness, Permit, Declare. Opens a form.',
};
Object.entries(R).forEach(([k, r]) => { H += `<button class="hit" data-room="${k}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px" aria-label="${HL[k]}"></button>`; });

back.innerHTML = B; mid.innerHTML = M; fore.innerHTML = F; hits.innerHTML = H;

/* sky: paper clouds on the far plane */
const cloud = (x, y, w, o = 1) => `<div class="cloud" style="left:${x}px;top:${y}px;opacity:${o}">${svg(w, w * .45, `<path d="M${w * .08} ${w * .4} a${w * .09} ${w * .09} 0 0 1 ${w * .08} -${w * .17} a${w * .15} ${w * .15} 0 0 1 ${w * .27} -${w * .06} a${w * .17} ${w * .17} 0 0 1 ${w * .3} ${w * .09} a${w * .1} ${w * .1} 0 0 1 ${w * .07} ${w * .14}z" class="f-shade"/>`)}</div>`;
$('#sky').innerHTML = cloud(-30, 18, 150) + cloud(262, 66, 120) + cloud(10, 118, 90, .9) + cloud(250, 770, 130) + cloud(-20, 800, 100, .9);

/* header cut edge */
function header() {
  const t = $('#topin'), w = innerWidth, h = t.offsetHeight, r = rng(7), pts = [[0, 0], [w, 0]];
  for (let x = w; x >= 0; x -= 22) pts.push([x, h - 2 + (r() - .5) * 3]);
  t.style.clipPath = 'polygon(' + pts.map(p => p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px').join(',') + ')';
  document.documentElement.style.setProperty('--hh', t.offsetHeight + 'px');
}
header(); addEventListener('resize', () => { header(); });

/* ---------- parallax + floor indicator on scroll ---------- */
const world = $('#world'), stage = $('#stage'), building = $('#building'), sheet = $('#sheet');
let s0 = 0, tick = false, locked = false;
function onScroll() {
  if (tick) return; tick = true;
  requestAnimationFrame(() => {
    tick = false;
    stage.style.setProperty('--py', (world.scrollTop - s0).toFixed(1));
    const y = world.scrollTop + world.clientHeight / 2 - 56;
    $('#fl').textContent = y < 140 ? 'F4' : y < 302 ? 'F3' : y < 464 ? 'F2' : 'F1';
  });
}
world.addEventListener('scroll', onScroll, { passive: true });
function initScroll() { world.scrollTop = world.scrollHeight; s0 = world.scrollTop; stage.style.setProperty('--py', 0); onScroll(); }
initScroll();

/* ---------- ceremony of opening a room ---------- */
const sheets = {
  personnel: () => `
    <div class="row"><span class="k">Seated</span><span class="v" id="seatv"></span></div>
    <div class="pips" id="pips" role="progressbar" aria-label="Desks seated"></div>
    <p class="hint" id="bneck"></p>
    <button class="hire" id="hire"><span id="hirel">Hire</span><small id="hirecost"></small></button>
    <div class="buy"><span class="t">Buy desk<br><b id="deskcost"></b></span><button class="btn" id="buydesk">Buy desk</button></div>`,
  pool: () => `
    <div class="row"><span class="k">Typing</span><span class="v">62 / 100 per s</span></div>
    <div class="bar" role="progressbar" aria-label="Typing" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62" aria-valuetext="Typing: 62% of capacity"><i style="width:62%"></i></div>
    <div class="row"><span class="k">Editing</span><span class="v">38 / 100 per s</span></div>
    <div class="bar" role="progressbar" aria-label="Editing" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38" aria-valuetext="Editing: 38% of demand"><i style="width:38%"></i></div>
    <p class="hint"><b>Bottleneck: editing.</b> Unreviewed submissions are discarded.</p>
    <div class="buy"><span class="t">Suggested split<br><b>62 / 38 → 55 / 45</b></span><button class="btn">Use suggested</button></div>`,
  departments: () => ['Recruiting|Lv 4|60', 'Construction|Lv 3|35', 'Editing|Lv 2|20'].map(s => { const [n, l, p] = s.split('|'); return `<div class="row"><span class="k">${n}</span><span class="v">${l}</span></div><div class="bar" role="progressbar" aria-label="${n}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}" aria-valuetext="${n}: ${p}% funded"><i style="width:${p}%"></i></div>`; }).join('') + `<div class="buy"><span class="t">Balanced buy<br><b>Need 40 more bananas</b></span><button class="btn" disabled>Sign</button></div>`,
  director: () => `
    <div class="dials" role="group" aria-label="Readiness"><div class="dial"><svg width="58" height="40" viewBox="0 0 58 40" aria-hidden="true"><path d="M5 36 A24 24 0 0 1 53 36" fill="none" class="s-ink" stroke-width="2"/><path d="M5 36 A24 24 0 0 1 36 13" fill="none" class="s-must" stroke-width="5"/><path d="M29 36 L40 18" class="s-ink" stroke-width="2"/></svg>Scale</div><div class="dial"><svg width="58" height="40" viewBox="0 0 58 40" aria-hidden="true"><path d="M5 36 A24 24 0 0 1 53 36" fill="none" class="s-ink" stroke-width="2"/><path d="M5 36 A24 24 0 0 1 20 14" fill="none" class="s-must" stroke-width="5"/><path d="M29 36 L18 20" class="s-ink" stroke-width="2"/></svg>Stability</div><div class="dial"><svg width="58" height="40" viewBox="0 0 58 40" aria-hidden="true"><path d="M5 36 A24 24 0 0 1 53 36" fill="none" class="s-ink" stroke-width="2"/><path d="M5 36 A24 24 0 0 1 12 22" fill="none" class="s-must" stroke-width="5"/><path d="M29 36 L12 30" class="s-ink" stroke-width="2"/></svg>Variety</div></div>
    <div class="row"><span class="k">Infinity Permit</span><span class="stamp">NOT ISSUED</span></div>
    <p class="hint"><b>Bottleneck: Variety.</b> Declare Infinity needs a stamped Permit.</p>
    <div class="buy"><span class="t">Declare Infinity<br><b>Permit required</b></span><button class="btn" disabled>Lift cover</button></div>`,
};
const state = { seated: 8, desks: 10, bananas: 12840, monkeys: 8, cost: 120, deskCost: 400 };
const fmt = n => n.toLocaleString('en-US');
function renderPersonnel() {
  const full = state.seated >= state.desks;
  $('#seatv').textContent = `${state.seated} / ${state.desks} desks`;
  $('#pips').innerHTML = Array.from({ length: state.desks }, (_, i) => `<i class="${i < state.seated ? 'on' : ''}"></i>`).join('');
  const pb = $('#pips'); pb.setAttribute('aria-valuemin', 0); pb.setAttribute('aria-valuemax', state.desks); pb.setAttribute('aria-valuenow', state.seated); pb.setAttribute('aria-valuetext', `${state.seated} of ${state.desks} desks seated`);
  $('#bneck').innerHTML = full ? '<b>Bottleneck: no free desk.</b> Buy a desk to hire again.' : `<b>${state.desks - state.seated} desk${state.desks - state.seated > 1 ? 's' : ''} vacant.</b> Income ${(state.monkeys * .525).toFixed(1)}/s → ${((state.monkeys + 1) * .525).toFixed(1)}/s with one more hire.`;
  const h = $('#hire'); h.disabled = full || state.bananas < state.cost;
  $('#hirel').textContent = full ? 'No free desk' : state.bananas < state.cost ? 'Need bananas' : 'Hire';
  $('#hirecost').textContent = full ? 'Buy a desk first' : state.bananas < state.cost ? `Need ${fmt(state.cost - state.bananas)} more bananas` : `Cost ${fmt(state.cost)} bananas`;
  $('#deskcost').textContent = `${fmt(state.deskCost)} bananas · desks ${state.desks} → ${state.desks + 1}`;
  $('#buydesk').disabled = state.bananas < state.deskCost;
  $('#hirel').parentElement.setAttribute('aria-live', 'polite');
}
function readout() { $('#bn').textContent = fmt(state.bananas); $('#mkn').textContent = state.monkeys; $('#inc').innerHTML = `${(state.monkeys * .525).toFixed(1)}<small>/s</small>`; }
function wirePersonnel() {
  $('#hire').addEventListener('click', () => {
    if (state.seated >= state.desks) return;
    const v = document.querySelector('.desk.vacant');
    if (v) { v.classList.remove('vacant'); v.classList.add('arrive'); }
    state.seated++; state.monkeys++; state.bananas -= state.cost; readout(); renderPersonnel();
  });
  $('#buydesk').addEventListener('click', () => { state.desks++; state.bananas -= state.deskCost; readout(); renderPersonnel(); });
}

let openRoom = null, lastFocus = null, savedScroll = 0;
const ernest = $('#ernest');
function camera(key) {
  const r = R[key], wr = world.getBoundingClientRect();
  const sh = sheet.offsetHeight, vh = innerHeight, vw = innerWidth;
  const ernestUp = ernest.classList.contains('in') && !ernest.classList.contains('out');
  const top = wr.top + 6 + (ernestUp ? ernest.offsetHeight + 8 : 0), bottom = vh - sh - 14;
  const availW = vw - 24, availH = Math.max(120, bottom - top);
  const s = Math.max(.8, Math.min(2.1, availW / (r.w + 16), availH / (r.h + 18)));
  const ox = wr.left + building.offsetLeft, oy = wr.top - world.scrollTop + building.offsetTop;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2, tx = vw / 2, ty = (top + bottom) / 2;
  return { s, x: tx - ox - s * cx, y: ty - oy - s * cy };
}
function open(key) {
  if (openRoom) return;
  openRoom = key; lastFocus = document.activeElement; savedScroll = world.scrollTop;
  const r = R[key];
  $('#sheetin').innerHTML = `<div class="fh"><div><p class="fcode">${r.code} · Floor ${r.floor}</p><h2 id="sheetTitle" tabindex="-1">${r.name}</h2></div><button class="btn" id="closeSheet" aria-label="Close ${r.name} and return to the floor">Close</button></div>` + sheets[key]();
  $('#sheetin').parentElement.style.setProperty('--x', 0);
  sheet.querySelector('.sheet-in').style.clipPath = cutPoly(innerWidth, 900, 77, { ch: 0, j: 1.6, step: 22 });
  if (key === 'personnel') { wirePersonnel(); renderPersonnel(); }
  $('#closeSheet').addEventListener('click', close);
  world.style.overflowY = 'hidden'; world.inert = true; $('#fab').hidden = true;
  $('#scrim').classList.add('on');
  // Ernest steps aside to the top while the form is open
  const ernestUp = ernest.classList.contains('in') && !ernest.classList.contains('out');
  if (ernestUp) { const rect = ernest.getBoundingClientRect(); const wantTop = world.getBoundingClientRect().top + 6; ernest.style.setProperty('--ey', (-(rect.top - wantTop)).toFixed(0) + 'px'); }
  building.dataset.active = key;
  document.querySelectorAll(`[data-room="${key}"]`).forEach(e => e.classList.add('on'));
  sheet.classList.add('open');
  if (reduce.matches) {
    // no travel: bring the room above the form with an instant jump; the rest is dimmed instead
    const wtop = world.getBoundingClientRect().top, topY = wtop + (ernestUp ? ernest.offsetHeight + 12 : 6), botY = innerHeight - sheet.offsetHeight - 10;
    stage.style.height = (920 + sheet.offsetHeight) + 'px';
    const centreStage = building.offsetTop + (r.y + r.h / 2) * .94;
    world.scrollTop = Math.max(0, Math.min(world.scrollHeight - world.clientHeight, centreStage - ((topY + botY) / 2 - wtop)));
  } else {
    const c = camera(key);
    building.style.transform = `translate(${c.x.toFixed(1)}px, ${c.y.toFixed(1)}px) scale(${c.s.toFixed(3)})`;
    stage.classList.add('zoomed');
  }
  setTimeout(() => { const t = $('#sheetTitle'); t && t.focus({ preventScroll: true }); }, reduce.matches ? 50 : 650);
}
function close() {
  if (!openRoom) return;
  const key = openRoom; openRoom = null;
  sheet.classList.remove('open'); $('#scrim').classList.remove('on');
  building.style.transform = ''; stage.classList.remove('zoomed');
  ernest.style.setProperty('--ey', '0px');
  delete building.dataset.active; document.querySelectorAll('.on[data-room], .plq.on').forEach(e => e.classList.remove('on'));
  world.inert = false; $('#fab').hidden = false;
  setTimeout(() => { world.style.overflowY = 'auto'; if (reduce.matches) { stage.style.height = ''; world.scrollTop = savedScroll; } }, reduce.matches ? 0 : 750);
  const b = hits.querySelector(`[data-room="${key}"]`); if (b) b.focus({ preventScroll: true });
}
hits.addEventListener('click', e => { const b = e.target.closest('.hit'); if (b) open(b.dataset.room); });
['pointerenter', 'pointerleave', 'pointerdown', 'pointerup', 'pointercancel'].forEach(ev => hits.addEventListener(ev, e => {
  const b = e.target.closest && e.target.closest('.hit'); if (!b) return;
  const el = document.querySelector(`.room[data-room="${b.dataset.room}"]`); if (!el) return;
  if (ev === 'pointerenter') el.classList.add('lit'); else if (ev === 'pointerleave' || ev === 'pointercancel') el.classList.remove('lit', 'press'); else if (ev === 'pointerdown') el.classList.add('press'); else el.classList.remove('press');
}, true));
$('#scrim').addEventListener('click', close);
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#dir').hidden) toggleDir(false); else close(); } });

/* directory */
function toggleDir(on) {
  const d = $('#dir'); on = on ?? d.hidden; d.hidden = !on; $('#fab').setAttribute('aria-expanded', on); $('#dirscrim').classList.toggle('on', on);
  if (on) d.querySelector('button').focus(); else if (document.activeElement && d.contains(document.activeElement)) $('#fab').focus();
}
$('#fab').addEventListener('click', () => toggleDir());
$('#dirscrim').addEventListener('click', () => toggleDir(false));
$('#dir').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; toggleDir(false); open(b.dataset.go); });

/* Ernest */
setTimeout(() => ernest.classList.add('in'), 450);
$('#ernest-ok').addEventListener('click', () => {
  ernest.classList.add('out'); ernest.classList.remove('in');
  setTimeout(() => ernest.remove(), 900);
});

/* quiet ticking readout: text only, no live region */
setInterval(() => { state.bananas += Math.round(state.monkeys * .525 * 10) / 10 > 0 ? Math.round(state.monkeys * .525) : 0; $('#bn').textContent = fmt(state.bananas); }, 1000);
readout();
})();
</script>
</body>
</html>
