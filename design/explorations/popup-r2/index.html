<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6B4423" />
<title>Pop-up Floor Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Courier+Prime&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
/* ---------- tokens (copied from game/style.css, plus derived paper tokens) ---------- */
:root {
  --paper: #f2e8d5; --paper-shade: #e4d6bc; --ink: #2b2622; --ink-muted: #5e554c;
  --walnut: #6b4423; --concrete: #8a8780; --mustard: #c9a227; --tangerine: #d9732b;
  --olive: #6e7046; --alert: #b23a2e; --phosphor-amber: #b87400; --phosphor-green: #3f7d4e;
  --glow: #ffe9b0; --screen: #14110d; --screen-ink: #ffb000; --screen-muted: #a89c8a;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --font-type: 'Courier Prime', 'Courier New', monospace;
  /* derived for this exploration: three clearly separated value layers */
  --edge: #fffaf0;          /* the white of cut paper (rims, tabs) */
  --on-walnut: #f2e8d5;
  --table: color-mix(in srgb, var(--walnut) 72%, var(--screen));
  --floor: color-mix(in srgb, var(--paper-shade) 60%, var(--walnut));   /* darkest sheet */
  --pad: color-mix(in srgb, var(--paper) 88%, var(--glow));             /* zone rugs: lightest sheet */
  --sheet: var(--paper);
  --head: var(--walnut);
  --focus: var(--ink);
  --stamp: color-mix(in srgb, var(--alert) 68%, var(--ink));
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #1f1b17; --paper-shade: #2a241e; --ink: #ede3cf; --ink-muted: #a89c8a;
    --walnut: #8a5a33; --concrete: #5e5b55; --mustard: #d9b23a; --tangerine: #e8843a;
    --olive: #8c8f5a; --alert: #d2554a; --phosphor-amber: #ffb000; --phosphor-green: #7cd992;
    --glow: #ffd27a; --edge: #d8ccb4; --on-walnut: #f2e8d5; --sheet: #302920; --head: #d9b23a;
    --table: color-mix(in srgb, var(--paper) 70%, var(--screen));
    --floor: color-mix(in srgb, var(--paper) 78%, var(--screen));
    --pad: color-mix(in srgb, var(--paper-shade) 55%, var(--concrete));
    --stamp: color-mix(in srgb, var(--alert) 66%, var(--ink));
  }
}
:root[data-theme='dark'] {
  --paper: #1f1b17; --paper-shade: #2a241e; --ink: #ede3cf; --ink-muted: #a89c8a;
  --walnut: #8a5a33; --concrete: #5e5b55; --mustard: #d9b23a; --tangerine: #e8843a;
  --olive: #8c8f5a; --alert: #d2554a; --phosphor-amber: #ffb000; --phosphor-green: #7cd992;
  --glow: #ffd27a; --edge: #d8ccb4; --on-walnut: #f2e8d5; --sheet: #302920; --head: #d9b23a;
  --table: color-mix(in srgb, var(--paper) 70%, var(--screen));
  --floor: color-mix(in srgb, var(--paper) 78%, var(--screen));
  --pad: color-mix(in srgb, var(--paper-shade) 55%, var(--concrete));
  --stamp: color-mix(in srgb, var(--alert) 66%, var(--ink));
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--table); color: var(--ink); font: 16px/1.45 var(--font-body); overscroll-behavior: none; position: relative; }
button { font: inherit; color: inherit; }
/* focus: ink on every paper/floor value in light, cream in dark (>= 3:1 against all backgrounds it sits on) */
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 6px var(--paper); }
h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; font-weight: 700; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- stage, camera, world ---------- */
.stage { position: absolute; inset: 0; overflow: hidden; width: 390px; max-width: 100%; margin: 0 auto; }
@media (min-width: 391px) { .stage { box-shadow: 0 0 0 1px var(--concrete); } }
.cam {
  position: absolute; left: 0; top: 0; width: 780px; height: 1340px;
  --tx: -195px; --ty: -202px; --s: 1;
  transform: translate3d(var(--tx), var(--ty), 0) scale(var(--s)); transform-origin: 0 0;
  transition: transform 760ms cubic-bezier(.5, .02, .2, 1);
  touch-action: none;
}
.cam.dragging { transition: none; will-change: transform; }
#map { position: absolute; left: 0; top: 0; width: 780px; height: 1340px; display: block; overflow: visible; }
.hot { position: absolute; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; border-radius: 10px; }
.hot:focus-visible { outline: 3px dashed var(--focus); outline-offset: -4px; box-shadow: none; }

/* ---------- map art: paper cutouts ---------- */
.floor { fill: var(--floor); }
.floor-edge { fill: color-mix(in srgb, var(--floor) 55%, var(--screen)); }
.floor-rim { fill: none; stroke: var(--edge); stroke-width: 1.6; opacity: .75; }
.table-shadow { fill: var(--screen); opacity: .35; }
.grain { mix-blend-mode: overlay; opacity: .45; pointer-events: none; }
.dots { fill: var(--edge); opacity: .28; }
.crease { stroke: var(--screen); stroke-width: 1; stroke-dasharray: 3 6; opacity: .22; fill: none; }
.crease-hi { stroke: var(--edge); stroke-width: 1; opacity: .35; fill: none; }
.route { stroke: var(--mustard); stroke-width: 2.4; stroke-dasharray: 1 8; stroke-linecap: round; fill: none; opacity: .95; }
.pad { fill: color-mix(in srgb, var(--tint, var(--concrete)) 16%, var(--pad)); stroke: var(--edge); stroke-width: 1.8; }
.pad-sh { fill: var(--screen); opacity: .3; }
.pad-sh2 { fill: var(--screen); opacity: .14; }
.t-pl { --tint: var(--olive); } .t-pe { --tint: var(--mustard); } .t-dp { --tint: var(--concrete); } .t-dr { --tint: var(--walnut); }
.rug { stroke: var(--edge); stroke-width: 1.2; }
.ring { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; opacity: 0; transition: opacity .3s; }
.zone.active .ring { opacity: .9; }
.tape { fill: var(--mustard); opacity: .9; stroke: var(--edge); stroke-width: .8; }

.up { transition: transform 620ms cubic-bezier(.3, .8, .25, 1); transform: scaleY(1); }
.zone.pop .up { transform: scaleY(1.18); }
.stage:has(.hot[data-zone='personnel']:is(:hover, :active)) #z-personnel .up,
.stage:has(.hot[data-zone='pool']:is(:hover, :active)) #z-pool .up,
.stage:has(.hot[data-zone='departments']:is(:hover, :active)) #z-departments .up,
.stage:has(.hot[data-zone='director']:is(:hover, :active)) #z-director .up { transform: scaleY(1.07); transition-duration: 160ms; }

/* standing pieces: front face, lighter cut rim, lighter top face, two shadow tiers */
.fr { fill: var(--c, var(--walnut)); stroke: var(--edge); stroke-width: 1.7; stroke-linejoin: round; }
.tp { fill: color-mix(in srgb, var(--c, var(--walnut)) 62%, var(--edge)); stroke: var(--edge); stroke-width: 1.7; stroke-linejoin: round; }
.rim { fill: none; stroke: var(--edge); stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: round; opacity: .95; }
.shl { fill: var(--screen); opacity: .2; filter: url(#soft); }
.shc { fill: var(--screen); opacity: .42; }
.sh { fill: var(--screen); opacity: .3; }
.tb { fill: var(--edge); stroke: var(--concrete); stroke-width: .8; stroke-linejoin: round; opacity: .95; }
.c-walnut { --c: var(--walnut); } .c-concrete { --c: var(--concrete); } .c-mustard { --c: var(--mustard); }
.c-olive { --c: var(--olive); } .c-alert { --c: var(--alert); } .c-paper { --c: color-mix(in srgb, var(--edge) 88%, var(--paper-shade)); }
.c-shade { --c: var(--paper-shade); } .c-steel { --c: color-mix(in srgb, var(--concrete) 62%, var(--glow)); }
.c-glass { --c: var(--glow); } .c-wall { --c: color-mix(in srgb, var(--paper-shade) 70%, var(--concrete)); }
.c-paper .fr, .c-shade .fr, .c-wall .fr { stroke: var(--edge); }
.ink { fill: var(--screen); } .inkl { stroke: var(--screen); fill: none; stroke-linecap: round; }
.glowf { fill: var(--glow); } .brass { fill: var(--mustard); stroke: var(--screen); stroke-width: .8; }
.sg { font: 700 12px var(--font-display); letter-spacing: .1em; fill: var(--screen); text-anchor: middle; text-transform: uppercase; }
.sg.sm { font-size: 11px; letter-spacing: .06em; }
.halo { fill: url(#halo); }
.pulse { animation: pulse 3.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.sway { animation: sway 5s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
/* tap cue: a small mechanical nudge every few seconds (sign hops 3px, dog-ear lifts) */
.nd { animation: nd 8s steps(1) infinite; animation-delay: var(--nd, 0s); }
@keyframes nd { 0%, 100% { transform: translateY(0); } 4% { transform: translateY(-3px); } 8% { transform: translateY(0); } 12% { transform: translateY(-2px); } 16% { transform: translateY(0); } }
.ear { animation: ear 8s ease-in-out infinite; animation-delay: var(--nd, 0s); transform-box: fill-box; transform-origin: 100% 100%; }
@keyframes ear { 0%, 70%, 100% { transform: scale(1); } 76%, 86% { transform: scale(1.5) translate(1px, 1px); } 92% { transform: scale(1); } }
.glass-f { fill: color-mix(in srgb, var(--glow) 26%, transparent); stroke: var(--mustard); stroke-width: 2; stroke-linejoin: round; }
.glass-t { fill: color-mix(in srgb, var(--glow) 44%, transparent); stroke: var(--mustard); stroke-width: 1.6; stroke-linejoin: round; }
.leaf { fill: var(--olive); stroke: var(--edge); stroke-width: .9; }
.leaf2 { fill: color-mix(in srgb, var(--olive) 70%, var(--phosphor-green)); stroke: var(--edge); stroke-width: .9; }
.page { fill: var(--edge); stroke: var(--concrete); stroke-width: .7; }
.sil { fill: var(--screen); stroke: var(--edge); stroke-width: .8; stroke-opacity: .55; }
.skyg { fill: color-mix(in srgb, var(--glow) 82%, var(--paper)); }
.cloud { fill: var(--edge); opacity: .9; animation: cloud 80s linear infinite; }
@keyframes cloud { from { transform: translateX(-120px); } to { transform: translateX(900px); } }

/* monkeys */
.f0 { --fur: var(--walnut); }
.f1 { --fur: color-mix(in srgb, var(--walnut) 55%, var(--tangerine)); }
.f2 { --fur: color-mix(in srgb, var(--walnut) 40%, var(--concrete)); }
.f3 { --fur: color-mix(in srgb, var(--walnut) 62%, var(--screen)); }
.f4 { --fur: color-mix(in srgb, var(--mustard) 50%, var(--walnut)); }
.f5 { --fur: color-mix(in srgb, var(--tangerine) 70%, var(--walnut)); }
.fur { fill: var(--fur); stroke: var(--edge); stroke-width: 1.2; stroke-linejoin: round; }
.furl { fill: none; stroke: var(--fur); stroke-width: 2.4; stroke-linecap: round; }
.face { fill: color-mix(in srgb, var(--fur) 40%, var(--glow)); }
.tongue { fill: color-mix(in srgb, var(--alert) 60%, var(--glow)); stroke: var(--screen); stroke-width: .5; }
.shirt { fill: var(--shirt); stroke: var(--edge); stroke-width: 1.3; stroke-linejoin: round; }
.sleeve { stroke: var(--shirt); stroke-width: 7; stroke-linecap: round; fill: none; }
.hand { fill: var(--fur); stroke: var(--edge); stroke-width: .9; }
.chair { fill: color-mix(in srgb, var(--concrete) 50%, var(--paper)); stroke: var(--edge); stroke-width: 1.4; stroke-linejoin: round; }
.sk-paper { --shirt: var(--edge); } .sk-mustard { --shirt: var(--mustard); } .sk-olive { --shirt: var(--olive); }
.sk-shade { --shirt: var(--concrete); } .sk-rust { --shirt: color-mix(in srgb, var(--tangerine) 60%, var(--paper)); }
.vacant .mk, .vacant .hands, .vacant .tail { display: none; }
.tent { display: none; }
.vacant .tent { display: inline; }
.arrive { animation: arrive 700ms cubic-bezier(.3, .8, .25, 1) both; }
@keyframes arrive { from { transform: translateY(-26px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.zz { font: 700 10px var(--font-display); fill: var(--ink); opacity: 0; }
.g-glance .eyes { animation: glance 7s ease-in-out infinite; animation-delay: var(--d); }
@keyframes glance { 0%, 38%, 100% { transform: translateX(0); } 44%, 62% { transform: translateX(1.6px); } 70% { transform: translateX(-1px); } }

/* behaviours */
@keyframes tap { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
@keyframes hb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(.8px); } }
.b-type .armL { animation: tap calc(.2s * var(--t)) ease-in-out infinite; }
.b-type .armR { animation: tap calc(.23s * var(--t)) ease-in-out infinite reverse; }
.b-type .head { animation: hb calc(.4s * var(--t)) ease-in-out infinite; }
@keyframes peck { 0%, 8% { transform: rotate(-16deg); } 15% { transform: rotate(3deg); } 22%, 46% { transform: rotate(-16deg); } 53% { transform: rotate(-1deg); } 60%, 100% { transform: rotate(-14deg); } }
@keyframes look { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(4deg); } 53% { transform: rotate(-4deg); } 80% { transform: rotate(1deg); } }
.b-peck .armR { animation: peck calc(3.6s * var(--t)) linear infinite; animation-delay: var(--d); }
.b-peck .head { animation: look calc(3.6s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
@keyframes slam { 0%, 58%, 100% { transform: rotate(0); } 64% { transform: rotate(-34deg); } 74% { transform: rotate(-34deg); } 82% { transform: rotate(0); } }
@keyframes feed { 0%, 70% { transform: translateY(0); } 71%, 98% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
.b-slam .armR { animation: slam calc(3.4s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-slam .armL { animation: tap calc(.3s * var(--t)) ease-in-out infinite; }
.b-slam .sheet { animation: feed calc(3.4s * var(--t)) steps(1) infinite; animation-delay: var(--d); }
@keyframes sip { 0%, 16% { transform: rotate(0); } 30%, 52% { transform: rotate(var(--sa)); } 66%, 100% { transform: rotate(0); } }
@keyframes mugt { 0%, 16% { transform: rotate(0); } 30%, 52% { transform: rotate(-64deg); } 66%, 100% { transform: rotate(0); } }
.b-sip .armR { animation: sip calc(6s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-sip .mug { animation: mugt calc(6s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
@keyframes stL { 0%, 30%, 100% { transform: rotate(0); } 42%, 68% { transform: rotate(150deg); } 80% { transform: rotate(0); } }
@keyframes stR { 0%, 30%, 100% { transform: rotate(0); } 42%, 68% { transform: rotate(-150deg); } 80% { transform: rotate(0); } }
@keyframes stH { 0%, 30%, 100% { transform: translateY(0); } 42%, 68% { transform: translateY(-3px); } 80% { transform: translateY(0); } }
.b-stretch .armL { animation: stL calc(7s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-stretch .armR { animation: stR calc(7s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-stretch .head { animation: stH calc(7s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
@keyframes flip { 0%, 66%, 100% { transform: scaleX(1); } 72% { transform: scaleX(.12); } 78% { transform: scaleX(1); } }
@keyframes scan { 0%, 100% { transform: translateX(-1.2px); } 50% { transform: translateX(1.2px); } }
.b-read .rpage { animation: flip calc(5s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-read .eyes { animation: scan calc(1.6s * var(--t)) ease-in-out infinite; }
@keyframes doze { 0% { transform: rotate(0); } 12%, 46% { transform: rotate(17deg) translateY(3px); } 52% { transform: rotate(-6deg); } 58% { transform: rotate(0); } 66%, 92% { transform: rotate(17deg) translateY(3px); } 100% { transform: rotate(0); } }
@keyframes lids { 0%, 6% { transform: scaleY(1); } 12%, 46% { transform: scaleY(.12); } 52%, 60% { transform: scaleY(1); } 66%, 92% { transform: scaleY(.12); } 98%, 100% { transform: scaleY(1); } }
@keyframes zzf { 0%, 10% { opacity: 0; transform: translate(0, 0); } 24%, 40% { opacity: 1; transform: translate(3px, -5px); } 48%, 62% { opacity: 0; } 76%, 88% { opacity: 1; transform: translate(3px, -5px); } 96%, 100% { opacity: 0; } }
.b-doze .head { animation: doze calc(9s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-doze .eyes { animation: lids calc(9s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
.b-doze .zz { animation: zzf calc(9s * var(--t)) ease-in-out infinite; animation-delay: var(--d); }
@keyframes crank { 0%, 44%, 100% { transform: rotate(0); } 48% { transform: rotate(-7deg); } 52% { transform: rotate(3deg); } 56% { transform: rotate(-7deg); } 60% { transform: rotate(3deg); } 64% { transform: rotate(-7deg); } 68% { transform: rotate(3deg); } 72% { transform: rotate(0); } }
@keyframes spin { 0%, 44% { transform: rotate(0); } 72%, 100% { transform: rotate(720deg); } }
.b-sharpen .armL { animation: crank calc(4s * var(--t)) linear infinite; animation-delay: var(--d); }
.b-sharpen .cr { animation: spin calc(4s * var(--t)) linear infinite; animation-delay: var(--d); }
/* editor stamps and sends a capsule up the tube */
@keyframes stampT { 0%, 30% { transform: translateY(-13px); } 38%, 50% { transform: translateY(0); } 62%, 100% { transform: translateY(-13px); } }
@keyframes stampA { 0%, 30% { transform: rotate(0); } 38%, 50% { transform: rotate(18deg); } 62%, 100% { transform: rotate(0); } }
@keyframes mark { 0%, 37% { opacity: 0; } 39%, 96% { opacity: 1; } 100% { opacity: 0; } }
@keyframes tube { 0%, 52% { transform: translateY(0); opacity: 0; } 54% { opacity: 1; } 80% { transform: translateY(-96px); opacity: 1; } 84%, 100% { transform: translateY(-100px); opacity: 0; } }
.b-stamp .stampT { animation: stampT 3.4s cubic-bezier(.6, 0, .4, 1) infinite; }
.b-stamp .armR { animation: stampA 3.4s cubic-bezier(.6, 0, .4, 1) infinite; }
.b-stamp .mark { animation: mark 3.4s steps(1) infinite; }
.cap { animation: tube 3.4s ease-in infinite; }
.b-stamp .armL { animation: tap 1.1s ease-in-out infinite; }
@keyframes foot { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-12deg); } 86% { transform: rotate(0); } 92% { transform: rotate(-12deg); } }
.foot { animation: foot 2.6s ease-in-out infinite; }
.cand { transition: opacity .6s; }
.cand.gone { opacity: 0; }

/* ---------- life in the aisles ---------- */
.cartpos { animation: cartxy var(--cd) linear infinite; animation-delay: var(--cdl); }
.cartflip { animation: cartflip var(--cd) steps(1) infinite; animation-delay: var(--cdl); }
.wheel { animation: roll .5s linear infinite; }
@keyframes roll { to { transform: rotate(360deg); } }
.cartbob { animation: cbob .7s steps(2, jump-none) infinite; }
@keyframes cbob { 0% { transform: translateY(0); } 50% { transform: translateY(-.8px); } }
.plane { animation: plane 17s ease-in-out infinite; animation-delay: -5s; }
.planesh { animation: planesh 17s ease-in-out infinite; animation-delay: -5s; }
@keyframes plane { 0% { transform: translate(0, 0) rotate(8deg); opacity: 0; } 3% { opacity: 1; } 14% { transform: translate(60px, -22px) rotate(-5deg); } 28% { transform: translate(140px, -8px) rotate(6deg); } 42% { transform: translate(230px, -26px) rotate(-6deg); } 56% { transform: translate(310px, -12px) rotate(7deg); opacity: 1; } 60% { transform: translate(330px, -6px) rotate(14deg); opacity: 0; } 100% { transform: translate(330px, -6px); opacity: 0; } }
@keyframes planesh { 0% { transform: translate(0, 0); opacity: 0; } 3% { opacity: .28; } 56% { transform: translate(310px, 0); opacity: .28; } 60%, 100% { transform: translate(330px, 0); opacity: 0; } }
@keyframes water { 0%, 8%, 62%, 100% { transform: rotate(0); } 18%, 50% { transform: rotate(32deg); } }
@keyframes drop { 0%, 18% { transform: translateY(0); opacity: 0; } 22% { opacity: 1; } 50% { transform: translateY(24px); opacity: 1; } 54%, 100% { transform: translateY(26px); opacity: 0; } }
.shred { animation: shred 6s steps(8) infinite; }
@keyframes shred { 0%, 20% { transform: translateY(-14px); opacity: 0; } 24% { opacity: 1; } 60% { transform: translateY(8px); opacity: 1; } 62%, 100% { transform: translateY(10px); opacity: 0; } }
.can { animation: water 7s ease-in-out infinite; }
.drp { animation: drop 7s linear infinite; }
@keyframes bub { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-20px); opacity: 0; } }
.bub { animation: bub 2.4s ease-in infinite; animation-delay: var(--d); }
@keyframes cup { 0%, 20% { transform: rotate(0); } 34%, 56% { transform: rotate(var(--sa)); } 70%, 100% { transform: rotate(0); } }
.cupa { animation: cup 8s ease-in-out infinite; }
@keyframes scanbar { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(26px); } }
@keyframes eject { 0%, 45% { transform: translateY(0); } 70%, 100% { transform: translateY(7px); } }
.scan { animation: scanbar 2.6s ease-in-out infinite; }
.eject { animation: eject 5.2s steps(6) infinite; }
@keyframes coat { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
.coat { animation: coat 6s ease-in-out infinite; animation-delay: var(--d); }
@keyframes drawer { 0%, 50%, 100% { transform: translateY(0); } 58%, 82% { transform: translateY(5px); } }
.drw { animation: drawer 9s ease-in-out infinite; animation-delay: var(--d); }
@keyframes dstamp { 0%, 52% { transform: translateY(-9px); } 58%, 66% { transform: translateY(0); } 74%, 100% { transform: translateY(-9px); } }

  return `<rect class="chair" x="${-w / 2}" y="-78" width="${w}" height="52" rx="7"/><rect x="${-w / 2 + 4}" y="-74" width="${w - 8}" height="5" rx="2.4" fill="var(--edge)" opacity=".35"/>`;
}
function tailSVG(kind, bw, lean) {
  const x = bw / 2 + 5;
  const d = { curl: `M${x} -34c13 2 17 -10 10 -20c-5 -7 -12 -3 -9 3`, up: `M${x} -34c16 -4 20 -22 14 -36`, hang: `M${x} -34c12 6 16 14 12 24`, none: '' }[kind];
  return d ? `<path class="furl tail-o" d="${d}" style="stroke:var(--edge);stroke-width:6"/><path class="furl" d="${d}" stroke-width="3.6"/>` : '';
}

/* seated monkey + desk. all authored in local coords, then placed with one translate */
function seatSVG(i, cx, yb, o = {}) {
  const s = Object.assign({}, CAST[i] || gen(i), o.over || {});
  const hr = s.hr, ys0 = -37 - s.H + hr * 1.9, dw = o.dw || 64, hw2 = dw / 2;
  const v = { f: 0, l: -1, r: 1, pl: -1, pr: 1 }[s.view];
  const lean = s.lean || 0, fwd = s.fwd || 0;
  const pivot = [0, -30];
  const hx = (v ? v * fwd : 0) + 0, hy = -37 - s.H + hr + fwd * .7;
  const ys = hy + hr * .92;
  const sw = s.bw, hwid = s.bw * s.tw;
  const sh0 = [[-(sw / 2 - 2), ys + 8], [sw / 2 - 2, ys + 8]].map(p => rot(p, lean, pivot));
  const hxL = -8, hxR = 8, hyH = -31;
  const L = sh0[0], R = sh0[1];
  let hL = [hxL, hyH], hRt = [hxR, hyH];
  const mouthPt = rot([hx + (v ? v * hr * .5 : 0), hy + hr * .7], lean, pivot);
  const armLen = Math.hypot(mouthPt[0] - R[0], mouthPt[1] - R[1]);
  let sa = 0;
  if (s.beh === 'sip') {
    const ang = Math.atan2(hyH - R[1] - 1, 18 - R[0]);
    hRt = [R[0] + armLen * Math.cos(ang) * 1, R[1] + armLen * Math.sin(ang)];
    // rotate the arm so the mug reaches the mouth
    const a1 = Math.atan2(hRt[1] - R[1], hRt[0] - R[0]), a2 = Math.atan2(mouthPt[1] - R[1], mouthPt[0] - R[0]);
    sa = Math.round(((a2 - a1) * 180 / Math.PI + 540) % 360 - 180);
  }
  if (s.beh === 'sharpen') hL = [-19, -32];
  let page = '';
  if (s.beh === 'read') {
    const px = hx + (v || s.ps) * (hr * 1.3 + 6), py = hy + hr * .35, ph = 24;
    hL = [px - 6, py + ph - 1]; hRt = [px + 6, py + ph - 1];
    page = `<g class="rpage" style="transform-origin:${f1(px)}px ${f1(py + 12)}px"><rect class="page" x="${f1(px - 11)}" y="${f1(py)}" width="22" height="${ph}" rx="1"/><path d="M${f1(px - 7)} ${f1(py + 5)}h14M${f1(px - 7)} ${f1(py + 9)}h14M${f1(px - 7)} ${f1(py + 13)}h14M${f1(px - 7)} ${f1(py + 17)}h9" stroke="var(--concrete)" stroke-width="1"/></g>`;
  }
  if (s.beh === 'stamp') { hRt = [hxR + 14, -32]; hL = [-10, -30]; }
  const bodyAcc = {
    cardigan: `<path d="M${-hwid / 2} ${f1(ys + 18)}L${f1(-sw * .28)} ${f1(ys + 4)}L${f1(-sw * .06)} ${f1(ys + 18)}V${f1(ys + 52)}H${-hwid / 2 - 2}z M${hwid / 2} ${f1(ys + 18)}L${f1(sw * .28)} ${f1(ys + 4)}L${f1(sw * .06)} ${f1(ys + 18)}V${f1(ys + 52)}H${hwid / 2 + 2}z" fill="var(--olive)" stroke="var(--edge)" stroke-width="1" stroke-linejoin="round"/><circle cx="${f1(-sw * .02)}" cy="${f1(ys + 22)}" r="1.4" class="brass"/><circle cx="${f1(-sw * .02)}" cy="${f1(ys + 30)}" r="1.4" class="brass"/>`,
    tie: `<path d="M-2.4 ${ys + 3}h4.8l2 20l-4.4 5l-4.4 -5z" fill="var(--alert)" stroke="var(--edge)" stroke-width=".9" stroke-linejoin="round"/>`,
    bowtie: `<path d="M0 ${ys + 5}l-7 -3.4v7z M0 ${ys + 5}l7 -3.4v7z" fill="var(--mustard)" stroke="var(--screen)" stroke-width=".9" stroke-linejoin="round"/>`,
    lanyard: `<path d="M${f1(-sw * .26)} ${ys + 1}L0 ${f1(ys + 22)}L${f1(sw * .26)} ${ys + 1}" fill="none" stroke="var(--alert)" stroke-width="1.6"/><rect x="-5" y="${f1(ys + 20)}" width="10" height="13" rx="1.4" class="page"/><circle cx="0" cy="${f1(ys + 25)}" r="2.2" class="ink"/>`, none: ''
  }[s.body];
  const sleeveC = s.body === 'cardigan' ? 'style="stroke:var(--olive)"' : '';
  const arm = (cls, S, H2, extra = '') => `<g class="${cls}" style="transform-origin:${f1(S[0])}px ${f1(S[1])}px"><line class="sleeve" ${sleeveC} x1="${f1(S[0])}" y1="${f1(S[1])}" x2="${f1(H2[0])}" y2="${f1(H2[1] - 1)}"/>${extra}<circle class="hand" cx="${f1(H2[0])}" cy="${f1(H2[1])}" r="3.6"/></g>`;
  const mug = s.beh === 'sip' ? `<g class="mug" style="transform-origin:${f1(hRt[0])}px ${f1(hRt[1])}px"><rect x="${f1(hRt[0] - 4)}" y="${f1(hRt[1] - 9)}" width="8" height="9" rx="1" fill="var(--edge)" stroke="var(--screen)" stroke-width=".9"/><path d="M${f1(hRt[0] + 4)} ${f1(hRt[1] - 7)}h2.4a2.2 2.2 0 0 1 0 4.4h-2.4" class="inkl" stroke-width="1.1"/></g>` : '';
  const stamper = s.beh === 'stamp' ? `<g class="stampT"><rect x="${f1(hRt[0] - 1.6)}" y="${f1(hRt[1] - 20)}" width="3.2" height="13" fill="var(--walnut)" stroke="var(--edge)" stroke-width=".8"/><rect x="${f1(hRt[0] - 8)}" y="${f1(hRt[1] - 9)}" width="16" height="8" rx="1.5" fill="var(--screen)" stroke="var(--edge)" stroke-width=".9"/></g>` : '';
  const armR = arm('armR', R, hRt, mug), armL = arm('armL', L, hL);
  const pside = (s.beh === 'sip' || s.beh === 'slam') ? -1 : s.beh === 'sharpen' ? 1 : s.ps;
  const propX = pside * (hw2 - 9);
  const writing = s.beh === 'sharpen' ? `<g><rect x="-30" y="-37" width="12" height="9" rx="1" fill="var(--concrete)" stroke="var(--edge)" stroke-width=".9"/><g class="cr" style="transform-origin:-24px -33px"><circle cx="-24" cy="-33" r="2.6" class="brass"/><path d="M-24 -33h4.4" class="inkl" stroke-width="1.1"/></g></g>` : '';
  const tw = s.beh === 'stamp'
    ? `<rect class="page" x="-${hw2 - 8}" y="-36" width="24" height="11"/><rect class="mark" x="-${hw2 - 11}" y="-34" width="18" height="7" fill="none" stroke="var(--alert)" stroke-width="1.6"/>`
    : `<rect class="sheet page" x="-6.5" y="-46" width="13" height="10"/><rect x="-11" y="-37" width="22" height="9" rx="1.5" fill="var(--concrete)" stroke="var(--edge)" stroke-width="1"/><path d="M-8 -32h16" stroke="var(--screen)" stroke-width="1.3" stroke-dasharray="1.7 1.3"/>`;
  const tent = `<polygon class="tb tent" points="-7,-30 7,-30 0,-46"/>`;
  const zzx = hx + hr + 4;
  const mk = `<g class="mk"><g transform="rotate(${lean} 0 -30)"><path class="shirt" d="${torsoPath(sw, hwid, ys, -28)}"/>${bodyAcc}<g class="head" style="transform-origin:${f1(hx)}px ${f1(ys + 2)}px">${headSVG(s, hx, hy, hr)}<text class="zz" x="${f1(zzx)}" y="${f1(hy - hr + 2)}" aria-hidden="true">z</text></g></g></g>`;
  // desk
  const d = 11, dh = 26;
  const desk = `<polygon class="shl" points="${-hw2},0 ${hw2},0 ${hw2 + 30},12 ${-hw2 + 6},12"/><polygon class="shc" points="${-hw2},0 ${hw2},0 ${hw2 + 3},4 ${-hw2 + 3},4"/>` +
    `<polygon class="tb" points="${-hw2 + 6},-1 ${-hw2 + 18},-1 ${-hw2 + 21},6 ${-hw2 + 3},6"/><polygon class="tb" points="${hw2 - 18},-1 ${hw2 - 6},-1 ${hw2 - 3},6 ${hw2 - 21},6"/>` +
    `<rect class="fr c-walnut" x="${-hw2}" y="${-dh}" width="${dw}" height="${dh}" rx="1.5"/><path class="rim" d="M${-hw2 + 1.5} -1V${-dh + 1.5}H${hw2 - 1.5}"/>` +
    `<polygon class="tp c-walnut" points="${-hw2 + 3},${-dh - d} ${hw2 - 3},${-dh - d} ${hw2},${-dh} ${-hw2},${-dh}"/><rect x="-5" y="-15" width="10" height="3" rx="1.2" class="brass"/>`;
  const aa = o.arrive ? ' arrive' : '';
  const flags = `${s.beh === 'sip' ? `--sa:${sa}deg;` : ''}`;
  const cls = `up seat b-${s.beh} f${s.fur} ${s.shirt}${s.gaze && s.beh !== 'read' && s.beh !== 'doze' && (hash(i) % 2) ? ' g-glance' : ''}${o.vacant ? ' vacant' : ''}${aa}`;
  const bpx = mouthPt;
  return `<g transform="translate(${cx} ${yb})"><g class="${cls}" data-i="${i}" style="transform-origin:0px 0px;--t:${(.85 + (hash(i + 5) % 30) / 100).toFixed(2)};--d:-${((hash(i + 9) % 40) / 10).toFixed(1)}s;${flags}">` +
    `<g class="tail">${tailSVG(s.tail, sw, lean)}</g>${chairSVG(s.chair, sw)}${mk}${desk}${tw}${writing}${prop(s.prop, propX, -30)}${page}<g class="hands">${armL}${armR}${stamper}</g>${tent}</g></g>`;
}

/* standing monkey (aisle life): ground at 0,0 */
function stand(s, pose = {}) {
  const hr = s.hr || 11, H = s.H || 66, legH = 22;
  const hy = -(H - hr), ys = hy + hr * .92, sw = s.bw || 22, hwid = sw * (s.tw || 1);
  const v = { f: 0, l: -1, r: 1, pl: -1, pr: 1 }[s.view || 'pr'];
  const L = [-(sw / 2 - 2), ys + 8], R = [sw / 2 - 2, ys + 8];
  const hl = pose.hl || [-7, -legH - 6], hrt = pose.hr || [7, -legH - 6];
  const arm = (cls, S, Hd, ex = '') => `<g class="${cls}" style="transform-origin:${f1(S[0])}px ${f1(S[1])}px"><line class="sleeve" x1="${f1(S[0])}" y1="${f1(S[1])}" x2="${f1(Hd[0])}" y2="${f1(Hd[1] - 1)}"/>${ex}<circle class="hand" cx="${f1(Hd[0])}" cy="${f1(Hd[1])}" r="3.6"/></g>`;
  const legs = `<rect class="fur" x="${-hwid / 2 + 2}" y="${-legH}" width="8" height="${legH}" rx="3"/><rect class="fur" x="${hwid / 2 - 10}" y="${-legH}" width="8" height="${legH}" rx="3"/><ellipse class="fur" cx="${-hwid / 2 + 8}" cy="-1" rx="7" ry="3.6"/><ellipse class="fur" cx="${hwid / 2 - 4}" cy="-1" rx="7" ry="3.6"/>`;
  const tail = s.tail ? `<path class="furl" d="M${-v * (sw / 2) || -sw / 2} ${-legH - 6}c${-v * 14 || -14} 4 ${-v * 18 || -18} -8 ${-v * 12 || -12} -18" style="stroke:var(--edge);stroke-width:6"/><path class="furl" d="M${-v * (sw / 2) || -sw / 2} ${-legH - 6}c${-v * 14 || -14} 4 ${-v * 18 || -18} -8 ${-v * 12 || -12} -18" stroke-width="3.6"/>` : '';

}

  s += `<g transform="translate(236 396)"><path class="planesh" d="M0 20l22 -6l-4 6l-8 2z" fill="var(--screen)"/><g class="plane"><path d="M0 0l30 -9l-9 14z" fill="var(--edge)" stroke="var(--concrete)" stroke-width="1.1" stroke-linejoin="round"/><path d="M0 0l21 5l-5 4z" fill="var(--edge)" stroke="var(--concrete)" stroke-width="1.1" stroke-linejoin="round"/><path d="M21 5l9 -14" stroke="var(--concrete)" stroke-width=".9"/></g></g>`;
  s += `<text class="sg sm" x="0" y="0" style="display:none"></text>`;
  $('#map').innerHTML = s;
}
function cart() {
  return `<polygon class="shl" points="-30,0 30,0 54,9 -6,9"/><polygon class="shc" points="-28,0 28,0 31,3 -25,3"/>` +
    // trundling monkey in profile pushing from behind
    `<g transform="translate(-20 0)" class="cartbob">${stand({ fur: 1, H: 60, bw: 22, tw: 1.1, hr: 11, ears: 'big', view: 'pr', gaze: [1, .2], eyes: 'open', mouth: 'smile', tail: true, shirt: 'sk-mustard' }, { hr: [14, -30], hl: [10, -28] })}</g>` +
    `<rect class="fr c-steel" x="-6" y="-34" width="56" height="26" rx="2"/><path class="rim" d="M-4 -10V-33H48"/><rect x="-2" y="-30" width="48" height="8" fill="var(--edge)" stroke="var(--screen)" stroke-width=".8"/><rect class="page" x="2" y="-38" width="14" height="9" transform="rotate(-6 8 -34)"/><rect class="page" x="20" y="-37" width="12" height="8" transform="rotate(5 26 -33)"/><rect x="34" y="-41" width="12" height="12" fill="var(--walnut)" stroke="var(--edge)" stroke-width="1"/><path d="M34 -35h12M40 -41v12" stroke="var(--mustard)" stroke-width="1.4"/>` +
    `<path d="M-6 -34h-8l-2 10" stroke="var(--screen)" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M50 -34v-14" stroke="var(--screen)" stroke-width="1.4"/><path d="M50 -48l9 3l-9 3z" fill="var(--alert)" stroke="var(--edge)" stroke-width=".8"/>` +
    `<g class="wheel" style="transform-origin:4px -4px"><circle cx="4" cy="-4" r="5" fill="var(--screen)" stroke="var(--edge)" stroke-width="1.2"/><path d="M4 -8v8" stroke="var(--edge)" stroke-width="1.2"/></g><g class="wheel" style="transform-origin:40px -4px"><circle cx="40" cy="-4" r="5" fill="var(--screen)" stroke="var(--edge)" stroke-width="1.2"/><path d="M40 -8v8" stroke="var(--edge)" stroke-width="1.2"/></g>`;
}
// mail-cart keyframes: a loop of the aisles around the pool, with a short stop at each corner
(function routeCSS() {
  const pts = [[120, 440], [660, 440], [660, 928], [120, 928], [120, 440]], sp = 38, dwell = 2.5;
  const segs = []; let t = 0;
  const ev = [{ t: 0, p: pts[0], f: 1 }];
  for (let k = 1; k < pts.length; k++) {
    const d = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]), dt = d / sp; t += dt;
    ev.push({ t, p: pts[k], f: pts[k][0] <= pts[k - 1][0] && k >= 3 ? -1 : pts[k][0] < pts[k - 1][0] ? -1 : 1 });
    if (k < pts.length - 1) { t += dwell; ev.push({ t, p: pts[k], f: ev[ev.length - 1].f }); }
  }
  const total = t; const pc = x => (x / total * 100).toFixed(2) + '%';
  let a = '', b = '';
  ev.forEach(e => { a += `${pc(e.t)}{transform:translate(${e.p[0]}px,${e.p[1]}px)}`; });
  // flip: moving right/down faces right (1), moving left/up faces left (-1); transitions happen at the stops
  const fl = [[0, 1], [ev[1].t, 1], [ev[2].t, 1], [ev[3].t + .01, -1], [ev[5].t + .01, -1], [ev[6].t, -1], [total - .02, 1]];
  const flipKF = `0%{transform:scaleX(1)}${pc(ev[4].t - .05)}{transform:scaleX(-1)}${pc(ev[6].t)}{transform:scaleX(-1)}${pc(ev[7].t - .01)}{transform:scaleX(1)}`;
  // dynamic duration to match: --cd is set to total seconds
  const st = document.createElement('style');
  st.textContent = `@keyframes cartxy{${a}}@keyframes cartflip{${flipKF}}`;
  document.head.appendChild(st);
  document.documentElement.style.setProperty('--cdur', total + 's');
  window.__cartTotal = total;
})();

build();

/* ===== state + readout ===== */
const state = { seated: 8, desks: 10, bananas: 1284, income: 12.4, monkeys: 8, hireCost: 40, deskCost: 120, open: null, ernest: false, tut: false };
const fmt = n => n.toLocaleString('en-US');
function paintReadout() { $('#r-ban').textContent = fmt(Math.floor(state.bananas)); $('#r-inc').textContent = state.income.toFixed(1) + '/s'; $('#r-mon').textContent = state.monkeys; }
setInterval(() => { state.bananas += state.income; paintReadout(); }, 1000);
const say = t => { const l = $('#live'); l.textContent = ''; setTimeout(() => (l.textContent = t), 30); };

/* ===== zones ===== */
const Z = {
  personnel: { n: 1, name: 'Personnel', form: 'Form 3-H · Hiring', box: [100, 962, 270, 222], sy: 975, hint: () => `${state.desks - state.seated} desk${state.desks - state.seated === 1 ? '' : 's'} free` },
  pool: { n: 2, name: 'Typing Pool', form: 'Form 7-T · Output', box: [212, 446, 356, 452], sy: 460, hint: () => 'Typing and editing' },
  departments: { n: 3, name: 'Departments', form: 'Form 5-D · Funding', box: [26, 146, 282, 196], sy: 160, hint: () => 'Three departments' },
  director: { n: 4, name: "Director's Office", form: 'Form 9-R · Readiness', box: [474, 146, 282, 200], sy: 160, hint: () => 'Readiness and Permit' }
};
function dial(label, val, max, word) {
  const a = -180 + 180 * (val / max);
  return `<div class="gauge"><svg viewBox="0 0 100 62" role="img" aria-label="${label}: ${word}"><path d="M10 54A40 40 0 0 1 90 54" fill="none" stroke="var(--concrete)" stroke-width="8"/><path d="M62 21.5A40 40 0 0 1 90 54" fill="none" stroke="var(--mustard)" stroke-width="8"/><line x1="50" y1="54" x2="50" y2="22" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" transform="rotate(${a + 90} 50 54)"/><circle cx="50" cy="54" r="5" fill="var(--walnut)" stroke="var(--edge)"/></svg><p class="lab">${label}</p><div class="gv">${word}</div></div>`;
}
const SHEETS = {
  personnel() {
    const free = state.desks - state.seated, full = free <= 0;
    const desks = Array.from({ length: state.desks }, (_, i) => `<i class="${i < state.seated ? 'on' : ''}"></i>`).join('');
    const ptr = state.tut && !full ? `<svg class="pt" viewBox="0 0 46 34" aria-hidden="true"><path d="M2 10h24V2l18 15l-18 15v-8H2z" fill="var(--mustard)" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/></svg>` : '';
    return `<div class="panel"><p class="lab">Seated</p><div class="big" id="seatnum">${state.seated} / ${state.desks} <small>desks</small></div>
      <div class="desks" role="progressbar" aria-label="Desks seated" aria-valuemin="0" aria-valuemax="${state.desks}" aria-valuenow="${state.seated}" aria-valuetext="${state.seated} of ${state.desks} desks seated">${desks}</div>
      <p class="note">${full ? 'Every desk is taken. Buy a desk before the next hire.' : `${free} free desk${free === 1 ? '' : 's'}. A monkey is waiting at the entrance.`}</p></div>
      <div class="hirebox${state.tut && !full ? ' tut' : ''}">${ptr}<button class="hire ${state.tut ? 'nudge' : ''}" id="hire" ${full ? 'disabled' : ''}>Hire monkey</button>
      <p class="delta" id="hiredelta">${full ? '' : `Monkeys ${state.monkeys} → ${state.monkeys + 1} · Income ${state.income.toFixed(1)} → ${(state.income + 1.1).toFixed(1)}/s`}</p>
      <p class="why">${full ? 'No free desk. Buy one below.' : `Cost ${state.hireCost} bananas. You have ${fmt(Math.floor(state.bananas))}.`}</p></div>
      <div class="panel sheetinner" style="margin-top:14px"><div class="row2"><div><p class="lab">Desk ${state.desks + 1}</p><p class="delta">Desks ${state.desks} → ${state.desks + 1} · ${state.deskCost} bananas</p></div><button class="btn2" id="buydesk">Buy desk</button></div></div>`;
  },
  pool() {
    return `<div class="panel"><div class="gauges">${dial('Typing', 7, 10, 'Partial')}${dial('Editing', 9, 10, 'Full')}</div>
      <p class="note"><b>Bottleneck:</b> editing capacity is fully committed. Submissions in excess are discarded.</p></div>
      <div class="hirebox" style="margin-top:12px"><div class="row2" style="width:100%"><div><p class="lab">Move one monkey to Editing</p><p class="delta">Certified 4.0/s → 5.1/s</p></div><button class="btn2">Reassign</button></div></div>
      <p class="why" style="margin-top:8px">Seated: 8 typing, 1 Editor at the stamping desk.</p>`;
  },
  departments() {
    const row = (nm, lv, pct, cost) => `<div class="drow"><div><span class="nm">${nm}</span> <span class="delta">Level ${lv} → ${lv + 1}</span><div class="bar" role="progressbar" aria-label="${nm} output" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-valuetext="${pct} percent of demand"><i style="width:${pct}%"></i></div></div><button class="btn2">${cost}</button></div>`;
    return `<div class="panel">${row('Recruiting', 3, 70, '90 🍌')}${row('Construction', 2, 40, '120 🍌')}${row('Editing', 4, 90, '150 🍌')}</div><p class="why" style="margin-top:8px">Funding split: balanced. Each purchase is signed once on a single requisition form.</p>`;
  },
  director() {
    return `<div class="panel"><div class="gauges">${dial('Scale', 6, 10, 'Partial')}${dial('Stability', 2, 10, 'Building')}</div>
      <p class="note">Infinity Permit: <span class="stamp">NOT ISSUED</span></p></div>
      <div class="hirebox" style="margin-top:12px"><button class="btn2" style="min-height:50px;width:100%" disabled>Declare Infinity</button><p class="why">Locked: the Permit is not issued. Hold Full readiness for 60 s.</p></div>`;
  }
};

/* ===== camera: a free-panning sheet on a table ===== */
const cam = $('#cam'), sheet = $('#sheet'), ernest = $('#ernest'), efig = $('#efig'), aim = $('#aim');
let cx = -195, cy = -202, cs = 1;            // translate + scale of the world on screen
const DEFAULT = [-195, -202, 1];
function put(x, y, s) { cx = x; cy = y; cs = s; cam.style.setProperty('--tx', x + 'px'); cam.style.setProperty('--ty', y + 'px'); cam.style.setProperty('--s', s); }
const lim = () => ({ minX: VW - WW - 18, maxX: 18, minY: VH - WH - 14, maxY: HDR + 6 });   // a sliver of table shows at each edge
function clampFree(x, y) { const l = lim(); return [clamp(x, l.minX, l.maxX), clamp(y, l.minY, l.maxY)]; }
function goTo(wx, wy, sx, sy, s = 1, free = true) {                 // put world point (wx,wy) at screen (sx,sy)
  let x = sx - s * wx, y = sy - s * wy;
  if (free) [x, y] = clampFree(x, y);
  put(x, y, s);
}
function frameZone(id) {
  const [bx, by, bw, bh] = Z[id].box;
  const sh = sheet.offsetHeight || 430, bottom = VH - sh - 34, top = state.ernest ? HDR + 80 : HDR + 8;
  const s = clamp(Math.min((VW - 8) / bw, (bottom - top) / bh), .5, 1.35);
  goTo(bx + bw / 2, by + bh / 2, VW / 2, (top + bottom) / 2, s, false);
}
function open(id) {
  const z = Z[id];
  if (!state.open) free = [cx, cy, cs];
  if (state.open && state.open !== id) $(`#z-${state.open}`).classList.remove('pop', 'active');
  state.open = id;
  $('#foldtab').innerHTML = `<b>${z.n}</b>${z.name}`;
  renderBody(id);
  sheet.setAttribute('aria-label', z.name + ' sheet');
  $(`#z-${id}`).classList.add('pop', 'active');
  ernest.classList.toggle('docked', state.ernest);
  sheet.classList.add('open');
  frameZone(id);
  document.querySelectorAll('#dirlist button').forEach(b => b.setAttribute('aria-current', b.dataset.zone === id ? 'true' : 'false'));
  say(z.name + ' opened.');
  setTimeout(() => { if (state.open === id) { frameZone(id); aimErnest(); } }, 60);
  aimErnest();
}
let free = DEFAULT.slice();
function close() {
  if (!state.open) return;
  const id = state.open; state.open = null;
  $(`#z-${id}`).classList.remove('pop', 'active');
  sheet.classList.remove('open');
  put(...free);
  ernest.classList.remove('docked');
  document.querySelectorAll('#dirlist button').forEach(b => b.setAttribute('aria-current', 'false'));
  const hot = $(`.hot[data-zone="${id}"]`); if (hot) hot.focus({ preventScroll: true });
  say('Back on the floor.');
  aimErnest();
}
function wire() {
  const c = $('#closebtn'); if (c) c.onclick = close;
  const h = $('#hire'); if (h) h.onclick = hire;
  const b = $('#buydesk'); if (b) b.onclick = buyDesk;
}
function renderBody(id) {
  const z = Z[id];
  $('#sheetbody').innerHTML = `<div class="sheet-head"><div><h2>${z.name}</h2><p class="form">${z.form}</p></div><button class="close" id="closebtn" aria-label="Fold down ${z.name}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>Fold down</button></div>` + SHEETS[id]();
  wire();
}
function hire() {
  if (state.seated >= state.desks) return;
  const idx = state.seated;
  state.seated++; state.monkeys++; state.income += 1.1; state.bananas -= state.hireCost;
  const seat = $(`.seat[data-i="${idx}"]`);
  if (seat) { seat.classList.remove('vacant'); seat.classList.add('arrive'); setTimeout(() => seat.classList.remove('arrive'), 800); }
  const cand = $('#cand'); if (cand) cand.classList.add('gone');
  if (state.seated < state.desks) setTimeout(() => cand && cand.classList.remove('gone'), 2200);
  paintReadout(); say(`Monkey seated at desk ${idx + 1}. ${state.seated} of ${state.desks} desks seated.`);
  const h = $('#hire'); const focusHire = document.activeElement === h;
  renderBody('personnel'); if (focusHire && $('#hire') && !$('#hire').disabled) $('#hire').focus(); else if ($('#buydesk')) $('#buydesk').focus();
}
function buyDesk() { state.desks++; state.bananas -= state.deskCost; paintReadout(); say(`Desk ${state.desks} installed.`); renderBody('personnel'); $('#buydesk').focus(); }

/* directory */
const dir = $('#dir'), dirbtn = $('#dirbtn');
$('#dirlist').innerHTML = Object.entries(Z).map(([id, z]) => `<li><button data-zone="${id}" aria-current="false"><span class="fl" aria-hidden="true">${z.n}</span><span class="nm">${z.name}<span class="hn">${z.hint()}</span></span></button></li>`).join('') +
  `<li><div class="dis" role="note"><span class="fl" aria-hidden="true">2</span><span class="nm">Floor 2<span class="hn">Under construction. Not yet open.</span></span></div></li>`;
function closeDir() { dir.hidden = true; dirbtn.setAttribute('aria-expanded', 'false'); }
dirbtn.addEventListener('click', () => { const o = dir.hidden; dir.hidden = !o; dirbtn.setAttribute('aria-expanded', String(o)); if (o) document.querySelectorAll('#dirlist button').forEach(b => { b.querySelector('.hn').textContent = Z[b.dataset.zone].hint(); }); });
$('#dirlist').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; closeDir(); open(b.dataset.zone); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!dir.hidden) { closeDir(); dirbtn.focus(); } else close(); }
  if (!state.open && e.target === document.body && e.key.startsWith('Arrow')) { const d = { ArrowLeft: [80, 0], ArrowRight: [-80, 0], ArrowUp: [0, 80], ArrowDown: [0, -80] }[e.key]; const [x, y] = clampFree(cx + d[0], cy + d[1]); put(x, y, 1); }
});
document.addEventListener('pointerdown', e => { if (!dir.hidden && !e.target.closest('#dir, #dirbtn')) closeDir(); });

/* ===== free pan: drag with gentle momentum, clamped edges ===== */
let dragMoved = false, coasting = false;
(() => {
  let down = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0, hist = [], raf = 0;
  const live = () => { const m = new DOMMatrix(getComputedStyle(cam).transform); return [m.m41, m.m42]; };
  cam.addEventListener('pointerdown', e => {
    if (state.open) return;
    cancelAnimationFrame(raf); const wasCoast = coasting; coasting = false;
    const [lx, ly] = live(); put(lx, ly, 1); cam.classList.add('dragging');
    down = true; moved = false; sx = e.clientX; sy = e.clientY; ox = lx; oy = ly; hist = [[performance.now(), lx, ly]];
    if (wasCoast) dragMoved = true;
  });
  window.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < 6) return;
    moved = true;
    const [x, y] = clampFree(ox + dx, oy + dy); put(x, y, 1);
    hist.push([performance.now(), x, y]); if (hist.length > 6) hist.shift();
  });
  window.addEventListener('pointerup', () => {
    if (!down) return; down = false;
    if (!moved) { cam.classList.remove('dragging'); if (dragMoved) setTimeout(() => (dragMoved = false), 80); return; }
    dragMoved = true; setTimeout(() => (dragMoved = false), 120);
    const a = hist[0], b = hist[hist.length - 1], dt = Math.max(1, b[0] - a[0]);
    let vx = (b[1] - a[1]) / dt, vy = (b[2] - a[2]) / dt;
    if (performance.now() - b[0] > 90 || reduce.matches) { cam.classList.remove('dragging'); return; }
    coasting = true; let last = performance.now();
    const step = t => {
      const d = Math.min(32, t - last); last = t;
      const k = Math.pow(.93, d / 16); vx *= k; vy *= k;
      let nx = cx + vx * d, ny = cy + vy * d; const [qx, qy] = clampFree(nx, ny);
      if (qx !== nx) vx = 0; if (qy !== ny) vy = 0;
      put(qx, qy, 1);
      if (Math.hypot(vx, vy) > .03 && coasting) raf = requestAnimationFrame(step); else { coasting = false; cam.classList.remove('dragging'); setTimeout(() => (dragMoved = false), 80); }
    };
    raf = requestAnimationFrame(step);
  });
})();
document.querySelectorAll('.hot').forEach(h => h.addEventListener('click', () => { if (dragMoved) return; closeDir(); open(h.dataset.zone); }));

/* ===== Ernest: peeks in from the top-right corner, points, never covers the lesson ===== */
function aimErnest() {
  if (!state.ernest) { aim.classList.remove('in'); return; }
  const handX = 236, handY = 236;                 // screen position of his pointer tip
  let tx, ty;
  if (state.open) { aim.classList.remove('in'); efig.style.setProperty('--aim', '24deg'); $('#esay').textContent = state.open === 'personnel' ? 'Press Hire monkey.' : 'Back to Personnel to hire.'; return; }
  $('#esay').textContent = 'Personnel is the desk below. Tap it to seat a monkey.';
  const [bx, by, bw] = Z.personnel.box;
  tx = cx + cs * (bx + bw / 2); ty = cy + cs * (Z.personnel.sy - 8);
  const dx = tx - handX, dy = ty - handY;
  const q = `M${handX} ${handY}Q${handX - 40} ${(handY + ty) / 2} ${tx} ${ty - 14}`;
  $('#aimline').setAttribute('d', q);
  const ang = Math.atan2(14, 0) ; // pointing straight down at the end
  $('#aimhead').setAttribute('d', `M${tx} ${ty} l-9 -14 h18z`);
  efig.style.setProperty('--aim', '28deg');
  aim.classList.add('in');
}
function showErnest() {
  state.ernest = true; state.tut = true;
  if (!state.open) { goTo(Z.personnel.box[0] + Z.personnel.box[2] / 2, 1100, VW / 2, 600, 1); }   // pan so Personnel sits below the card
  ernest.classList.toggle('docked', !!state.open); ernest.classList.add('in'); efig.classList.add('in');
  if (state.open === 'personnel') { renderBody('personnel'); }
  setTimeout(aimErnest, reduce.matches ? 0 : 20);
}
$('#ernest-ok').addEventListener('click', () => {
  state.ernest = false; state.tut = false; ernest.classList.remove('in'); efig.classList.remove('in'); aim.classList.remove('in');
  if (state.open === 'personnel') renderBody('personnel');
  if (state.open) frameZone(state.open);
  say('Orientation card dismissed.');
});
if (!/noernest/.test(location.search)) setTimeout(showErnest, reduce.matches ? 500 : 3000);

window.__beh = Array.from({ length: 8 }, (_, i) => CAST[i].beh);
window.__cam = { put, goTo, open, close, showErnest, get: () => [cx, cy, cs] };
paintReadout();
})();
</script>
</body>
