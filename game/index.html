<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6B4423" />
    <title>Infinite Monkeys</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Courier+Prime&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="shell-header">
      <div class="shell-title">
        <p class="eyebrow">Bureau of Infinite Typing</p>
        <h1>Infinite Monkeys</h1>
      </div>
      <div class="readout" aria-live="off">
        <div><span class="label">Bananas</span><span class="value" id="bananas">0</span></div>
        <div><span class="label">Income</span><span class="value" id="income">0/s</span></div>
        <div><span class="label">Monkeys</span><span class="value" id="monkeys">1</span></div>
      </div>
    </header>

    <div id="diorama" class="shell-slot"></div>
    <div id="feed" class="shell-slot"></div>

    <main id="screens"></main>

    <footer class="shell-footer">
      <button id="reset" class="quiet">Reset save</button>
      <span class="label">Build <span id="build"></span></span>
      <button id="check-update" class="quiet">Check for updates</button>
      <span id="update-status" class="label" aria-live="polite"></span>
    </footer>

    <nav id="tabs" class="shell-tabs" aria-label="Screens"></nav>

    <div id="update" class="toast" hidden>
      New version available. <button id="reload">Reload</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
